<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập Vật lý 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#14213D;--mute:#5B6478;--line:#D5DBE7;--brand:#0E6E8C;--on:#fff;--ok:#146C43;--okbg:#E2F3E9;--bad:#A4262C;--badbg:#FBE5E6;--soft:#E3EFF5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--card:#172036;--ink:#E8ECF5;--mute:#9AA5BD;--line:#2A3550;--brand:#6FD3F0;--on:#0E1424;--ok:#6FD79A;--okbg:#12301F;--bad:#FF9094;--badbg:#3A1A1E;--soft:#212C48}}
:root[data-theme="dark"]{--bg:#0E1424;--card:#172036;--ink:#E8ECF5;--mute:#9AA5BD;--line:#2A3550;--brand:#6FD3F0;--on:#0E1424;--ok:#6FD79A;--okbg:#12301F;--bad:#FF9094;--badbg:#3A1A1E;--soft:#212C48}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:700;font-size:15px;color:var(--mute)}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--mute);font-size:14px}
h1{font-size:clamp(26px,5vw,36px);line-height:1.2;margin:8px 0 8px;letter-spacing:-.02em}
.lead{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.card+.card{margin-top:14px}
h2{font-size:15px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on);border-color:var(--brand);font-weight:600}
.cta{display:block;width:100%;background:var(--brand);color:var(--on);border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700}
.cta.alt{background:var(--soft);color:var(--ink);margin-top:10px}
.note{font-size:13.5px;color:var(--mute);margin-top:14px}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin:8px 0 14px}
.tag{display:inline-block;font-size:13px;background:var(--soft);color:var(--brand);border-radius:8px;padding:2px 10px;margin-bottom:10px;font-weight:600}
.q{font-size:clamp(17px,3.6vw,20px);font-weight:600;line-height:1.5;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:14px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok b{background:var(--ok);color:var(--on)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad b{background:var(--bad);color:var(--on)}
.opt:disabled{cursor:default;color:inherit}
.fb{margin-top:16px;font-weight:600;min-height:26px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.nav{margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.nav .cta{width:auto;padding:11px 26px}
.hint{font-size:13px;color:var(--mute)}
.score{font-size:64px;font-weight:700;line-height:1;margin:6px 0}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv p{margin:0 0 6px}.rv .y{color:var(--bad)}.rv .c{color:var(--ok)}
[hidden]{display:none!important}.tools{display:flex;gap:8px}.ghost[aria-pressed="true"]{color:var(--brand);border-color:var(--brand);font-weight:600}
.ex{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:15px;line-height:1.65}.ex .ln{padding:4px 0 4px 12px;margin:6px 0;border-left:3px solid var(--brand)}.ex span{display:block}
.ex small{display:block;color:var(--mute);margin-bottom:4px;font-weight:600}
:root{--gl:rgba(255,255,255,.5);--glb:rgba(255,255,255,.75);--b1:#8fd6ff;--b2:#c9bcff;--b3:#9ff0d2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gl:rgba(28,40,76,.45);--glb:rgba(255,255,255,.14);--b1:#0b5c8a;--b2:#3b2a7a;--b3:#0c5b52}}
:root[data-theme="dark"]{--gl:rgba(28,40,76,.45);--glb:rgba(255,255,255,.14);--b1:#0b5c8a;--b2:#3b2a7a;--b3:#0c5b52}
html[data-glass="on"] body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(42vmax 42vmax at 10% 8%,var(--b1),transparent 70%),radial-gradient(46vmax 46vmax at 92% 28%,var(--b2),transparent 70%),radial-gradient(52vmax 52vmax at 38% 105%,var(--b3),transparent 70%)}
html[data-glass="on"] :is(.card,.opt,.chip,.ghost,.ex,.cta.alt){background:var(--gl);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glb);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.08),0 10px 30px rgba(20,33,61,.14)}
html[data-glass="on"] .card{border-radius:28px}
html[data-glass="on"] :is(.opt,.cta,.ex){border-radius:18px}
html[data-glass="on"] .chip[aria-pressed="true"]{background:color-mix(in srgb,var(--brand) 88%,transparent);color:var(--on);border-color:var(--glb)}
html[data-glass="on"] .cta:not(.alt){background:linear-gradient(160deg,color-mix(in srgb,var(--brand) 80%,#fff),var(--brand));border:1px solid var(--glb);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 24px color-mix(in srgb,var(--brand) 35%,transparent)}
html[data-glass="on"] .opt.ok{background:color-mix(in srgb,var(--ok) 24%,transparent);border-color:var(--ok)}
html[data-glass="on"] .opt.bad{background:color-mix(in srgb,var(--bad) 22%,transparent);border-color:var(--bad)}
html[data-glass="on"] .bar{background:var(--gl);box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
math{font-size:1.08em}.q img.fg{display:block;margin:12px auto 4px}img[data-i]{background:#fff;border-radius:6px;max-width:100%;height:auto}img.fm{vertical-align:middle;padding:1px 3px;zoom:1.5}.opt span{min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.hint{display:none}.nav .cta{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><span class="brand">Vật lý 1 · Ngân hàng câu hỏi</span><div class="tools"><button class="ghost" id="glass" aria-pressed="true" aria-label="Bật hoặc tắt hiệu ứng kính lỏng">Kính lỏng</button><button class="ghost" id="theme" aria-label="Đổi giao diện sáng/tối">Sáng/Tối</button></div></div>
<div id="app"></div>
</main>
<script>
const D=[[1,"1.1","Chọn câu trả lời <strong>đúng</strong>: Trong công thức của chuyển động thẳng chậm dần đều: V= V<sub>0</sub> + at.",["V luôn luôn dương","a luôn luôn dương","a luôn cùng dấu với V","a luôn ngược dấu với V"],3,["Chậm dần đều: vận tốc giảm về độ lớn.","Nên gia tốc a luôn ngược dấu với v."]],[1,"1.2","Chọn câu trả lời <strong>đúng</strong>: Trong công thức của chuyển động thẳng nhanh dần đều: V= V<sub>0</sub> + at.",["V luôn luôn dương","a luôn luôn dương","a luôn cùng dấu với V","a luôn ngược dấu với V"],2,["Nhanh dần đều: vận tốc tăng về độ lớn.","Nên gia tốc a luôn cùng dấu với v."]],[1,"1.3","Trong chuyển động tròn, gia tốc pháp tuyến của chất điểm có độ lớn được xác định bởi biểu thức nào sau đây?",["<math><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mi>v</mi><mi>R</mi></mrow></math>","<math><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mfrac><msup><mi>v</mi><mn>2</mn></msup><mi>R</mi></mfrac></mrow></math>","<math><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mfrac><mi>v</mi><msup><mi>R</mi><mn>2</mn></msup></mfrac></mrow></math>","<math><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mi>ω</mi><msup><mi>R</mi><mn>2</mn></msup></mrow></math>"],1,["Gia tốc pháp tuyến (hướng tâm): aₙ = v²/R = ω²R.","Phương án B đã lấy \"v²R\" theo cách viết của đề."]],[1,"1.4","Chọn câu trả lời <strong>sai</strong>: Trong chuyển động thẳng nhanh dần đều, nếu chọn chiều dương là chiều chuyển động thì:",["Gia tốc là đại lượng véctơ cùng phương chiều với véctơ vận tốc","Gia tốc là đại lượng véctơ cùng phương ngược chiều với véctơ vận tốc","Gia tốc là đại lượng véctơ tiếp tuyến với quỹ đạo chuyển động","Gia tốc là đại lượng véctơ có độ lớn a là một hằng số dương ."],1,["Nhanh dần đều thì a cùng chiều v.","Phát biểu \"a ngược chiều v\" là của chuyển động chậm dần đều, nên B sai."]],[1,"1.5","Chọn câu trả lời <strong>sai</strong>: Khi nói về sự rơi tự do của vật",["Sự rơi tự do là sự rơi của các vật trong chân không, chỉ dưới tác dụng của trọng lực .","Các vật rơi tự do tại cùng một nơi thì gia tốc như nhau.","Trong quá trình rơi tự do vận tốc giảm dần theo thời gian.","Trong quá trình rơi tự do gia tốc của vật không đổi cả về hướng và độ lớn."],2,["Rơi tự do có gia tốc g không đổi, vận tốc tăng dần theo thời gian (v = gt).","Vậy \"vận tốc giảm dần\" là sai."]],[1,"1.6","Chọn câu trả lời <strong>đúng</strong>: khi nói về vận tốc trong chuyển động cong:",["Véctơ vận tốc tức thời tại mỗi điểm trên quỹ đạo có phương trùng với phương của tiếp tuyến với quỹ đạo tại điểm đó.","Véctơ vận tốc tức thời tại mỗi điểm trên quỹ đạo có phương vuông góc với phương tiếp tuyến với quỹ đạo tại điểm đó.","Phương của véctơ vận tốc không đổi theo thời gian.","Trong quá trình chuyển động vận tốc luôn có giá trị dương."],0,["Vận tốc tức thời luôn tiếp tuyến với quỹ đạo tại điểm đang xét.","Phương của vận tốc đổi theo thời gian trong chuyển động cong."]],[1,"1.7","Phát biểu nào sau đây chỉ tốc độ tức thời?",["Ôtô chuyển động từ A đến B với tốc độ 40km/h.","Vận động viên chạm đích với tốc độ 10m/s.","Xe máy chuyển động với tốc độ 30km/h trong thời gian 2 giờ thì đến TPHCM.","Tốc độ của người đi bộ là 5 km/h."],1,["Tốc độ tức thời là tốc độ tại một thời điểm xác định, như lúc chạm đích.","Các phương án còn lại là tốc độ trung bình hoặc tốc độ chung chung."]],[1,"1.8","Một vật được ném xiên trong trường trọng lực, bỏ qua sức cản không khí. Tại điểm cao nhất của quỹ đạo:",["vận tốc và gia tốc đều bằng không.","vận tốc bằng không nhưng gia tốc khác không.","thành phần vận tốc thẳng đứng bằng không.","gia tốc bằng không nhưng vận tốc khác không."],2,["Vật ném xiên chỉ chịu trọng lực, gia tốc luôn bằng g.","Tại điểm cao nhất, thành phần vận tốc thẳng đứng bằng 0, thành phần ngang vẫn khác 0."]],[1,"1.9","Hai viên bi sắt ở cùng một độ cao, viên A thả rơi tự do, viên B bắn theo phương ngang. Nếu bỏ qua sức cản không khí thì",["viên A chạm đất trước.","viên B chạm đất trước.","hai viên bi chạm đất cùng lúc.","viên có khối lượng lớn hơn chạm đất trước."],2,["Thời gian rơi chỉ phụ thuộc độ cao: t = √(2h/g).","Chuyển động ngang không ảnh hưởng chuyển động thẳng đứng, nên hai viên chạm đất cùng lúc."]],[1,"1.10","Chọn phát biểu đúng về chuyển động của viên đạn sau khi ra khỏi nòng súng (bỏ qua sức cản không khí):",["Tầm xa của đạn sẽ lớn nhất nếu nòng súng nằm ngang.","Tầm xa của đạn sẽ lớn nhất nếu nòng súng nghiêng góc 60<sup>o</sup> so với phương ngang.","Nếu mục tiêu (ở mặt đất) nằm trong tầm bắn thì có 2 góc ngắm để trúng đích.","Độ cao cực đại mà viên đạn đạt được sẽ lớn nhất khi nòng súng nghiêng một góc 45<sup>0</sup>."],2,["Tầm xa R = v₀² sin2α / g, hai góc α và 90° − α cho cùng tầm xa.","Vì vậy với một mục tiêu trong tầm bắn có 2 góc ngắm."]],[1,"1.11","Một viên đạn được bắn lên từ mặt đất với vận tốc đầu nòng là 800 m/s theo phương hợp với mặt phẳng ngang một góc 30<sup>o</sup>. Xác định tầm xa mà viên đạn đạt được. Bỏ qua sức cản không khí, lấy g = 10 m/s<sup>2</sup>.",["46562 m","55426 m","60000 m","65345 m"],1,["R = v₀² sin2α / g = 800² · sin60° / 10 ≈ 55 426 m."]],[1,"1.12","Một viên đạn được bắn lên từ mặt đất với vận tốc đầu nòng là 800m/s theo phương hợp với mặt phẳng ngang một góc 30<sup>o</sup>. Xác định độ cao cực đại mà viên đạn đạt được. Bỏ qua sức cản không khí, lấy g = 10 m/s<sup>2</sup>.",["2000m","4000 m","8000 m","16000 m"],2,["H = v₀² sin²α / (2g) = 800² · 0,25 / 20 = 8000 m."]],[1,"1.13","Từ mặt đất một vật được bắn lên với vận tốc ban đầu V<sub>0</sub>= 20m/s hợp với phương nằm ngang một góc α = 60<sup>0</sup>. Lấy g = 10m/s<sup>2</sup>. Hãy xác định thời gian chuyển động của vật.",["3,46 s","2,04 s","21,65 s","2,55 s"],0,["t = 2v₀ sinα / g = 2 · 20 · sin60° / 10 ≈ 3,46 s."]],[1,"1.14","Một người thợ xây ném một viên gạch theo phương thẳng đứng cho một người khác ở trên tầng cao 4 m. Người này chỉ việc giơ tay ngang ra là bắt được viên gạch. Lấy g = 10 m/s<sup>2</sup>. Để cho viên gạch lúc người kia bắt được bằng không thì vận tốc ném bằng bao nhiêu?",["6,32 m/s.","8,94 m/s<sup>2</sup>.","6,32 m/s<sup>2</sup>.","8,94 m/s."],3,["Tới tay người kia thì v = 0: v₀² = 2gh.","v₀ = √(2 · 10 · 4) = √80 ≈ 8,94 m/s (đơn vị đúng là m/s)."]],[1,"1.15","Một quả bóng được ném từ đỉnh một tòa nhà có độ cao 20 m so với mặt đất với vận tốc ban đầu <math><mrow><mn>20</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><mi>s</mi></mrow></math> theo phương ngang. Bỏ qua sức cản không khí, lấy <math><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>. Thời gian chuyển động của quả bóng là:",["1 s","2 s","3 s","4 s"],1,["Ném ngang: h = ½gt² nên t = √(2h/g) = √(2 · 20/10) = 2 s."]],[1,"1.16","Người ta ném một vật từ mặt đất lên cao theo phương thẳng đứng với vận tốc 4,0 m/s. Lấy g = 10 m/s<sup>2</sup>. Thời gian vật chuyển động đến độ cao cực đại và độ cao cực đại vật đạt được là :",["t = 0,4 s; H = 0,8 m.","t = 0,4 s; H = 1,6 m.","t = 0,8 s; H = 3,2 m.","t = 0,8 s; H = 0,8 m."],0,["Lên cao nhất thì v = 0: t = v₀/g = 0,4 s.","H = v₀²/(2g) = 16/20 = 0,8 m."]],[1,"1.17","Một quả bóng được ném từ đỉnh một tòa nhà có độ cao 20 m so với mặt đất với vận tốc ban đầu <math><mrow><mn>20</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><mi>s</mi></mrow></math> theo phương ngang. Bỏ qua sức cản không khí, lấy <math><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>. Tầm xa của quả bóng là:",["<math><mrow><mn>20</mn><mspace width=\"0.17em\"></mspace><mi>m</mi></mrow></math>","<math><mrow><mn>28</mn><mo>,</mo><mn>3</mn><mspace width=\"0.17em\"></mspace><mi>m</mi></mrow></math>","<math><mrow><mn>40</mn><mspace width=\"0.17em\"></mspace><mi>m</mi></mrow></math>","<math><mrow><mn>80</mn><mspace width=\"0.17em\"></mspace><mi>m</mi></mrow></math>"],2,["Thời gian rơi t = 2 s (như câu trước).","Tầm xa L = v₀t = 20 · 2 = 40 m."]],[1,"1.20","Một ô tô chuyển động thẳng chậm dần đều, tốc độ giảm từ 12 m/s xuống 4 m/s. Tốc độ trung bình của ô tô trong khoảng thời gian đó là:",["6 m/s","8 m/s","10 m/s","4 m/s"],1,["Chuyển động thẳng biến đổi đều: v̄ = (v₀ + v)/2.","v̄ = (12 + 4)/2 = 8 m/s."]],[1,"1.21","Ô tô chuyển động thẳng, nhanh dần đều, lần lượt đi qua A và B với tốc độ v<sub>A</sub> = 2 m/s và v<sub>B</sub> = 8 m/s. Tốc độ trung bình của ôtô trên quãng đường AB là:",["5 m/s","4 m/s","6 m/s","3 m/s"],0,["Nhanh dần đều: v̄ = (2 + 8)/2 = 5 m/s."]],[1,"1.22","Một canô xuôi dòng từ bến A đến bến B với tốc độ v<sub>1</sub> = 30 km/h; rồi ngược dòng từ B về A với tốc độ v<sub>2</sub> = 20 km/h. Tính tốc độ trung bình trên lộ trình đi – về của canô.",["25 km/h","26 km/h","24 km/h","0 km/h"],2,["Đi và về cùng quãng đường S nên tốc độ trung bình là trung bình điều hòa.","v̄ = 2v₁v₂/(v₁ + v₂) = 2 · 30 · 20/50 = 24 km/h."]],[1,"1.23","Một ôtô dự định chuyển động từ A đến B với vận tốc 30km/h. Nhưng sau khi đi được 1/3 đoạn đường, xe bị chết máy. Tài xế phải dừng 30 phút để sửa xe, sau đó đi tiếp với vận tốc 40km/h và đến B đúng giờ qui định. Tính thời gian dự định chuyển động ban đầu của ôtô.",["2 giờ","3 giờ","2,5 giờ","3,5 giờ"],1,["Gọi AB = S, thời gian dự định t = S/30.","Thực tế: S/90 + 0,5 + (2S/3)/40 = S/90 + 0,5 + S/60.","Cho bằng S/30 suy ra S = 90 km, nên t = 90/30 = 3 giờ."]],[1,"1.24","Một ôtô dự định chuyển động từ A đến B với vận tốc 30km/h. Nhưng sau khi đi được 1/3 đoạn đường, xe bị chết máy. Tài xế phải dừng 30 phút để sửa xe, sau đó đi tiếp với vận tốc 40km/h và đến B đúng giờ qui định. Tính quãng đường AB.",["60 km","80 km","90 km","100 km"],2,["Từ phương trình ở câu trước: S/30 = S/90 + 0,5 + S/60.","Giải ra S = 90 km."]],[1,"1.25","Một môtơ bắt đầu khởi động nhanh dần đều, sau 2 giây đạt tốc độ ổn định 300 vòng/phút. Tính gia tốc góc của môtơ.",["10π rad/s<sup>2</sup>","5π rad/s<sup>2</sup>","15π rad/s<sup>2</sup>","20π rad/s<sup>2</sup>"],1,["ω = 300 vòng/phút = 10π rad/s.","γ = ω/t = 10π/2 = 5π rad/s²."]],[1,"1.26","Một bánh xe có bán kính 0,25m quay đều quanh trục với tốc độ 500 vòng/phút. Gia tốc hướng tâm của điểm trên vành bánh xe có giá trị:",["334,3 m/s<sup>2</sup>","190,8 m/s<sup>2</sup>","686,4 m/s<sup>2</sup>","1800 m/s<sup>2</sup>"],2,["ω = 500 · 2π/60 ≈ 52,36 rad/s.","aₙ = ω²R = 52,36² · 0,25 ≈ 686 m/s²."]],[1,"1.27","Một môtơ bắt đầu khởi động nhanh dần đều, sau 2 giây đạt tốc độ ổn định 300 vòng/phút. Tính góc quay của môtơ trong thời gian đó.",["10 π rad","5 π rad","15 π rad","20 π rad"],0,["ω = 10π rad/s, quay nhanh dần đều từ nghỉ.","φ = ½ωt = ½ · 10π · 2 = 10π rad."]],[1,"1.28","Một bánh mài đang quay với vận tốc 300 vòng/phút thì bị ngắt điện và nó quay chậm dần đều. Sau đó một phút, vận tốc còn 180 vòng/phút. Tính số vòng nó đã quay trong thời gian đó.",["120 vòng","240 vòng","60 vòng","180 vòng"],1,["Số vòng = (n₀ + n)/2 · t = (300 + 180)/2 · 1 phút = 240 vòng."]],[1,"1.29","Một đồng hồ có kim giờ dài 3cm, kim phút dài 4cm. Gọi ω<sub>P</sub>, ω<sub>g</sub> là vận tốc góc và v<sub>p</sub> , v<sub>g</sub> là vận tốc dài của đầu kim phút , kim giờ. Quan hệ nào sau đây là đúng?",["ω<sub>p</sub> = 12ω<sub>g</sub> ; v<sub>p</sub> = 16 v<sub>g</sub>","ω<sub>p</sub> = 12ω<sub>g</sub> ; v<sub>g</sub> = 16v<sub>p</sub>","ω<sub>g</sub> = 12ω<sub>p</sub> ; v<sub>p</sub> = 16v<sub>g</sub>","ω<sub>g</sub> = 12ω<sub>p</sub> ; v<sub>g</sub> = 9v<sub>p</sub>"],0,["Kim phút quay 1 vòng/giờ, kim giờ 1 vòng/12 giờ nên ω_p = 12ω_g.","v = ωR nên v_p/v_g = 12 · 4/3 = 16."]],[1,"1.30","Một dây cuaroa truyền động, vòng qua vô lăng I và bánh xe II (hình vẽ). Bán kính của vô lăng và bánh xe là R<sub>1</sub> = 10cm và R<sub>2</sub> = 50cm. Vô lăng đang quay với vận tốc 720 vòng/phút thì bị ngắt điện, nó quay chậm dần đều, sau đó 30 giây vận tốc chỉ còn 180 vòng/phút. Vận tốc quay của bánh xe ngay trước khi ngắt điện là:<br><img data-i=\"image1\" class=\"fg\" style=\"width:2.07222in;height:0.84028in\">",["720 vòng/phút","144 vòng/phút","3600 vòng/phút","180 vòng/phút"],1,["Dây cuaroa không trượt nên tốc độ dài hai vành bằng nhau: n₁R₁ = n₂R₂.","n₂ = 720 · 10/50 = 144 vòng/phút."]],[1,"1.31","Một dây cuaroa truyền động, vòng qua vô lăng I và bánh xe II (hình vẽ). Bán kính của vô lăng và bánh xe là R<sub>1</sub> = 10cm và R<sub>2</sub> = 50cm. Vô lăng đang quay với vận tốc 720 vòng/phút thì bị ngắt điện, nó quay chậm dần đều, sau đó 30 giây vận tốc chỉ còn 180 vòng/phút. Tính số vòng quay của vô lăng trong khoảng thời gian 30 giây đó.<br><img data-i=\"image1\" class=\"fg\" style=\"width:2.07222in;height:0.84028in\">",["540 vòng","270 vòng","225 vòng","45 vòng"],2,["Quay chậm dần đều nên số vòng = (720 + 180)/2 · (30/60) = 225 vòng."]],[1,"1.32","Một dây cuaroa truyền động, vòng qua vô lăng I và bánh xe II (hình vẽ). Bán kính của vô lăng và bánh xe là R<sub>1</sub> = 10cm và R<sub>2</sub> = 50cm. Vô lăng đang quay với vận tốc 720 vòng/phút thì bị ngắt điện, nó quay chậm dần đều, sau đó 30 giây vận tốc chỉ còn 180 vòng/phút. Sau bao lâu kể từ lúc ngắt điện, hệ thống sẽ dừng?<br><img data-i=\"image1\" class=\"fg\" style=\"width:2.07222in;height:0.84028in\">",["40 giây","50 giây","60 giây","80 giây"],0,["Giảm 540 vòng/phút trong 30 s, tức 18 vòng/phút mỗi giây.","Dừng hẳn sau t = 720/18 = 40 s."]],[1,"1.33","Một dây cuaroa truyền động, vòng qua vô lăng I và bánh xe II (hình vẽ). Bán kính của vô lăng và bánh xe là R<sub>1</sub> = 10cm và R<sub>2</sub> = 50cm. Vô lăng đang quay với vận tốc 720 vòng/phút thì bị ngắt điện, nó quay chậm dần đều, sau đó 30 giây vận tốc chỉ còn 180 vòng/phút. Tính số vòng quay của bánh xe trong khoảng thời gian 30 giây đó.<br><img data-i=\"image1\" class=\"fg\" style=\"width:2.07222in;height:0.84028in\">",["540 vòng","144 vòng","225 vòng","45 vòng"],3,["Bánh xe có số vòng tỉ lệ nghịch với bán kính: N₂ = N₁ · R₁/R₂.","N₂ = 225 · 10/50 = 45 vòng."]],[1,"1.34","Một dây cuaroa truyền động, vòng qua vô lăng I và bánh xe II (hình vẽ). Bán kính của vô lăng và bánh xe là R<sub>1</sub> = 10cm và R<sub>2</sub> = 50cm. Vô lăng đang quay với vận tốc 720 vòng/phút thì bị ngắt điện, nó quay chậm dần đều, sau đó 30 giây vận tốc chỉ còn 180 vòng/phút. Tính số vòng quay của bánh xe kể từ lúc ngắt điện cho đến khi dừng lại.<br><img data-i=\"image1\" class=\"fg\" style=\"width:2.07222in;height:0.84028in\">",["480 vòng","240 vòng","45 vòng","48 vòng"],3,["Vô lăng dừng sau 40 s: N₁ = 720/2 · (40/60) = 240 vòng.","Bánh xe: 240 · 10/50 = 48 vòng."]],[1,"1.35","Một dây cuaroa truyền động, vòng qua vô lăng I và bánh xe II (hình vẽ). Bán kính của vô lăng và bánh xe là R<sub>1</sub> = 10cm và R<sub>2</sub> = 50cm. Vô lăng đang quay với vận tốc 720 vòng/phút thì bị ngắt điện, nó quay chậm dần đều, sau đó 30 giây vận tốc chỉ còn 180 vòng/phút. Tính số vòng quay của vô lăng kể từ lúc ngắt điện cho đền khi dừng lại.<br><img data-i=\"image1\" class=\"fg\" style=\"width:2.07222in;height:0.84028in\">",["480 vòng","240 vòng","225 vòng","48 vòng"],1,["Từ lúc ngắt điện đến khi dừng (40 s):","N = (720/2) · (40/60) = 240 vòng."]],[1,"1.36","Một vật chuyển động nhanh dần đều với vận tốc ban đầu <math><mrow><msub><mi>v</mi><mn>0</mn></msub><mo>=</mo><mn>0</mn><mi>.</mi><mspace width=\"0.17em\"></mspace></mrow></math>Trong giây thứ nhất vật đi được quãng đường S<sub>1</sub> = 3m. Gia tốc chuyển động của vật bằng:",["6 m/s<sup>2</sup>.","9 m/s<sup>2</sup>.","8 m/s<sup>2</sup>.","7 m/s<sup>2</sup>."],0,["S₁ = ½at² với t = 1 s: 3 = ½a nên a = 6 m/s²."]],[1,"1.37","Một ô tô đang chuyển động với vận tốc 36 km/h thì hãm phanh, chuyển động chậm dần đều và dừng lại sau 10 s. Gia tốc chuyển động của ô tô có độ lớn là:",["0,5 m/s<sup>2</sup>.","1 m/s<sup>2</sup>.","1,5 m/s<sup>2</sup>.","2 m/s<sup>2</sup>."],1,["v₀ = 36 km/h = 10 m/s, dừng sau 10 s.","|a| = 10/10 = 1 m/s²."]],[1,"1.38","Một vật chuyển động nhanh dần đều với vận tốc ban đầu v<sub>0</sub> = 0. Trong giây thứ nhất vật đi được quãng đường S<sub>1</sub> = 3m. Trong giây thứ hai vật đi được quãng đường S<sub>2</sub> bằng bao nhiêu?",["3 m","36 m","6 m","9 m"],3,["Quãng đường trong các giây liên tiếp tỉ lệ 1 : 3 : 5.","S₂ = 3S₁ = 9 m."]],[1,"1.39","Một ô tô đang chuyển động với vận tốc 54 km/h thì hãm phanh, chuyển động chậm dần đều và dừng lại sau 10 s. Chọn chiều dương là chiểu chuyển động của ô tô. Vận tốc của ô tô sau khi hãm phanh được 6s là:",["2,5 m/s.","6 m/s","7,5 m/s.","9 m/s."],1,["v₀ = 15 m/s, a = −15/10 = −1,5 m/s².","v(6 s) = 15 − 1,5 · 6 = 6 m/s."]],[1,"1.40","Một chiếc xe hơi giảm tốc chậm dần đều từ 54 km/h còn 36 km/h trên quãng đường thẳng dài 125 m. Độ lớn gia tốc của xe là:",["1,5 m/s<sup>2</sup>","0,7 m/s<sup>2</sup>","0,5 m/s<sup>2</sup>","1 m/s<sup>2</sup>"],2,["v₀ = 15 m/s, v = 10 m/s.","v² − v₀² = 2as nên a = (100 − 225)/(2 · 125) = −0,5 m/s², độ lớn 0,5."]],[1,"1.41","Một đoàn tàu đang chạy với vận tốc 36 km/h thì hãm phanh, sau 5s thì dừng lại hẳn. Quãng đường đoàn tàu chạy sau 3s từ lúc hãm phanh là bao nhiêu?",["21 m","25,2 m","52 m","2,52 m"],0,["v₀ = 10 m/s, dừng sau 5 s nên a = −2 m/s².","s(3 s) = 10 · 3 − ½ · 2 · 9 = 21 m."]],[1,"1.42","Hai viên bi sắt được thả rơi cùng độ cao cách nhau một khoảng thời gian 0,5 s. Lấy g = 10 m/s<sup>2</sup>. Khoảng cách giữa hai viên bi sau khi viên thứ nhất rơi được 1,5 s là bao nhiêu?",["6,25 m.","12,5 m.","5,0 m.","2,5 m."],0,["Viên 1 rơi 1,5 s: ½ · 10 · 2,25 = 11,25 m.","Viên 2 rơi 1 s: 5 m.","Khoảng cách = 11,25 − 5 = 6,25 m."]],[1,"1.43","Một xe ô tô chuyển động chậm dần đều với vận tốc ban đầu v<sub>0</sub> = 20 m/s và gia tốc 3 m/s<sup>2</sup>. Vận tốc của xe khi đi thêm 50 m và quãng đường đi được cho đến khi dừng lại hẳn lần lượt có giá trị là:",["12,37 m/s; 150 m","17,32 m/s; 200 m","13,72 m/s; 150 m","13,27 m/s; 200 m"],1,["Dùng v² = v₀² − 2as với s = 50 m và đáp án B (17,32 m/s, 200 m).","Hai số này khớp khi a = 1 m/s² (400 − 100 = 300, v = 17,32; s = 400/2 = 200 m).","Lưu ý: đề ghi 3 m/s² có vẻ sai số liệu, đáp án B khớp với a = 1 m/s²."]],[1,"1.44","Tình huống quạt công nghiệp.  Một quạt thông gió công nghiệp đang quay với tốc độ <math><mrow><mn>600</mn><mspace width=\"0.17em\"></mspace><mi>v</mi><mi>ò</mi><mi>n</mi><mi>g</mi><mi>/</mi><mi>p</mi><mi>h</mi><mi>ú</mi><mi>t</mi></mrow></math> thì bị ngắt điện. Sau khi ngắt điện, quạt quay chậm dần đều do mômen cản tổng hợp không đổi. Sau <math><mrow><mn>10</mn><mspace width=\"0.17em\"></mspace><mi>s</mi></mrow></math> tốc độ còn <math><mrow><mn>300</mn><mspace width=\"0.17em\"></mspace><mi>v</mi><mi>ò</mi><mi>n</mi><mi>g</mi><mi>/</mi><mi>p</mi><mi>h</mi><mi>ú</mi><mi>t</mi></mrow></math>. Kể từ lúc ngắt điện:",["quạt dừng sau <math><mrow><mn>15</mn><mspace width=\"0.17em\"></mspace><mi>s</mi></mrow></math> và quay được <math><mn>75</mn></math> vòng.","quạt dừng sau <math><mrow><mn>20</mn><mspace width=\"0.17em\"></mspace><mi>s</mi></mrow></math> và quay được <math><mn>100</mn></math> vòng.","quạt dừng sau <math><mrow><mn>20</mn><mspace width=\"0.17em\"></mspace><mi>s</mi></mrow></math> và quay được <math><mn>150</mn></math> vòng.","quạt dừng sau <math><mrow><mn>30</mn><mspace width=\"0.17em\"></mspace><mi>s</mi></mrow></math> và quay được <math><mn>150</mn></math> vòng."],1,["Giảm 300 vòng/phút sau 10 s nên dừng sau 20 s.","Số vòng = (600/60)/2 · 20 = 100 vòng."]],[1,"1.45","Tình huống an toàn giao thông.  Một ô tô đang chạy với tốc độ <math><mrow><mn>72</mn><mspace width=\"0.17em\"></mspace><mi>k</mi><mi>m</mi><mi>/</mi><mi>h</mi></mrow></math>. Người lái phát hiện một vật cản cách xe <math><mrow><mn>50</mn><mspace width=\"0.17em\"></mspace><mi>m</mi></mrow></math>. Thời gian phản ứng của người lái là <math><mrow><mn>0</mn><mo>,</mo><mn>8</mn><mspace width=\"0.17em\"></mspace><mi>s</mi></mrow></math>; trong thời gian phản ứng, coi xe vẫn chuyển động đều với tốc độ ban đầu. Sau đó xe hãm chậm dần đều với gia tốc có độ lớn <math><mrow><mn>5</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>. Nhận định nào sau đây đúng?",["Xe dừng trước vật cản <math><mrow><mn>6</mn><mspace width=\"0.17em\"></mspace><mi>m</mi></mrow></math>.","Xe vừa dừng đúng tại vật cản.","Xe va vào vật cản với tốc độ xấp xỉ <math><mrow><mn>7</mn><mo>,</mo><mn>7</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><mi>s</mi></mrow></math>.","Xe va vào vật cản với tốc độ <math><mrow><mn>20</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><mi>s</mi></mrow></math>."],2,["v₀ = 20 m/s: quãng đường phản ứng 0,8 · 20 = 16 m, còn 34 m.","v² = 20² − 2 · 5 · 34 = 60 nên v ≈ 7,7 m/s.","Xe cần 40 m để dừng nên va vào vật cản."]],[2,"2.1","Phát biểu nào sau đây là <strong>sai</strong>?",["Quán tính là xu hướng bảo toàn gia tốc của vật.","Khối lượng đặc trưng cho mức quán tính.","Định luật I Newton còn gọi là định luật quán tính.","Chuyển động thẳng đều được gọi là chuyển động theo quán tính."],0,["Quán tính là xu hướng bảo toàn vận tốc (giữ nguyên trạng thái chuyển động), không phải bảo toàn gia tốc.","Vậy A sai."]],[2,"2.2","Trọng lực có đặc điểm nào sau đây?",["Luôn có chiều hướng về tâm của trái đất","Phụ thuộc vào toạ độ địa lí.","Có biểu thức <em>,</em><img data-i=\"image2\" class=\"fm\" style=\"width:0.55069in;height:0.23194in\">, với m là khối lượng của vật và g là gia tốc trọng trường.","Tất cả đều là các đặc điểm của trong lực."],3,["Trọng lực hướng về tâm Trái Đất, phụ thuộc vĩ độ và độ cao, có biểu thức P = mg.","Cả A, B, C đều đúng nên chọn D."]],[2,"2.3","Theo định luật III Newton, <em>lực</em> và phản <em>lực</em> <strong>không</strong> có đặc điểm nào sau đây?",["Cùng bản chất.","Cùng tồn tại và cùng mất đi đồng thời.","Cùng điểm đặt","Cùng phương nhưng ngược chiều"],2,["Lực và phản lực đặt vào hai vật khác nhau.","Vì vậy chúng không cùng điểm đặt."]],[2,"2.4","Phát biểu nào sau đây là <em><strong>đúng</strong></em>?",["Trọng lượng là đại lượng đặc trưng cho mức độ quán tính của vật.","Khi hai xe va chạm, xe nhỏ hơn sẽ chịu lực tác dụng mạnh hơn.","Gia tốc của vật luôn tỉ lệ nghịch với khối lượng.","Đội kéo co chiến thắng là đội tác dụng một lực lớn hơn vào sợi dây."],2,["Theo định luật II: a = F/m, nên gia tốc tỉ lệ nghịch với khối lượng khi lực không đổi.","Các phương án khác sai: trọng lượng không phải mức quán tính; lực va chạm có độ lớn bằng nhau; kéo co thắng nhờ ma sát với đất."]],[2,"2.5","Phát biểu nào sau đây là <em><strong>đúng</strong></em>?",["Lực và phản lực có chung điểm đặt.","Cặp lực trực đối thì triệt tiêu nhau.","Cặp lực trực đối thì luôn ngược hướng.","Lực pháp tuyến và trọng lực là hai lực trực đối của nhau."],2,["Cặp lực trực đối: cùng giá, cùng độ lớn, ngược chiều.","Lực và phản lực đặt vào hai vật khác nhau nên không triệt tiêu."]],[2,"2.6","Động lượng của một hệ chất điểm <strong>không</strong> có đặc điểm nào sau đây:",["Là tổng động lượng của các chất điểm trong hệ.","Không thay đổi theo thời gian, nếu hệ kín.","Đạo hàm của nó theo thời gian bằng tổng các ngoại lực tác dụng lên hệ.","Đặc trưng cho tính chất nhanh, chậm của khối tâm của hệ."],3,["Phương án A, B, C là các tính chất đúng của động lượng hệ chất điểm.","D mô tả chưa chuẩn nên được chọn là \"không có đặc điểm\" (câu này đề khá mơ hồ)."]],[2,"2.7","Trong biểu thức của định II Newton là <img data-i=\"image3\" class=\"fm\" style=\"width:1.30417in;height:0.50694in\"> là:",["Tổng hợp ngoại lực tác dụng lên vật.","Là trọng lực.","Là lực đẩy tác dụng lên vật.","Là lực kéo tác dụng lên vật."],0,["Trong a = F/m, F là hợp (tổng hợp) các ngoại lực tác dụng lên vật."]],[2,"2.8","Đại lượng đặc trưng cho mức quán tính của một vật là:",["trọng lương.","khối lượng.","vận tốc.","lực."],1,["Khối lượng là số đo mức quán tính của vật."]],[2,"2.9","Điều nào sau đây là <strong>sai</strong> khi nói về lực và phản lực?",["Lực và phản lực luôn xuất hiện và mất đi đồng thời.","Lực và phản lực luôn đặt vào hai vật khác nhau.","Lực và phản lực luôn cùng hướng với nhau.","Lực và phản lực không cân bằng nhau."],2,["Lực và phản lực xuất hiện đồng thời, đặt vào hai vật khác nhau, không cân bằng, và ngược hướng nhau.","\"Cùng hướng\" là sai."]],[2,"2.10","Chọn câu phát biểu sai :",["Động lượng của vật là đại lượng đặc trưng cho khả năng truyền chuyển động của vật.","Động lượng là đại lượng véc tơ đo bằng tích giữa khối lượng và véc tơ vận tốc của vật.","Véc tơ động lượng của vật luôn cùng phương, cùng chiều với véc tơ vận tốc của vật.","Véc tơ động lượng của vật luôn cùng phương, ngược chiều với véc tơ vận tốc của vật."],3,["Động lượng p = mv luôn cùng phương, cùng chiều với v (vì m > 0).","Nên \"ngược chiều\" là sai."]],[2,"2.11","Theo định luật II Newton, khi hợp lực tác dụng lên vật khác không, vectơ gia tốc của vật:",["cùng hướng với hợp lực tác dụng lên vật.","luôn cùng hướng với vận tốc của vật.","luôn ngược hướng với vận tốc của vật.","vuông góc với hợp lực tác dụng lên vật."],0,["Theo định luật II Newton, a cùng hướng với hợp lực: a = F/m."]],[2,"2.12","Đặc điểm nào sau đây <strong>không</strong> phải của lực ma sát trượt?",["Xuất hiện khi vật trượt trên bề mặt vật khác.","Luôn ngược chiều với chiều chuyển động.","Tỉ lệ với áp lực vuông góc với mặt tiếp xúc.","Luôn cân bằng với thành phần tiếp tuyến với mặt tiếp xúc của ngoại lực."],3,["Ma sát trượt chỉ xuất hiện khi trượt, ngược chiều chuyển động tương đối và tỉ lệ với áp lực.","\"Luôn cân bằng với ngoại lực tiếp tuyến\" là đặc điểm của ma sát nghỉ."]],[2,"2.13","Theo định luật III Newton, các vật tương tác với nhau bằng các cặp lực trực đối gọi là <em>lực</em> và <em>phản lực</em>.Vậy một vật đặt nằm yên trên mặt bàn nằm ngang thì <em>phản lực</em> của trọng lực P là lực nào?",["Phản lực N của mặt bàn.","Áp lực Q mà vật đè lên bàn.","Lực ma sát giữa mặt bàn và vật.","Lực mà vật hút Trái Đất."],3,["Phản lực của trọng lực (Trái Đất hút vật) là lực vật hút Trái Đất, cùng bản chất hấp dẫn.","Phản lực N của bàn là cặp với áp lực, không phải với trọng lực."]],[2,"2.14","Các giọt mưa rơi được xuống đất là do nguyên nhân nào sau đây?",["Quán tính.","Lực đẩy Ác-si-mét của không khí.","Lực hấp dẫn của Trái Đất.","Gió."],2,["Giọt mưa rơi xuống đất do lực hấp dẫn của Trái Đất."]],[2,"2.15","Trường hợp nào sau đây vật chịu tác dụng của lực ma sát nghỉ?",["Vật đứng yên trên mặt đường, không có xu hướng chuyển động.","Vật đứng yên trên mặt đường, nhưng có xu hướng chuyển động.","Vật trượt đều trên mặt đường.","Cả ba trường hợp đều xuất hiện lực ma sát nghỉ."],1,["Ma sát nghỉ xuất hiện khi vật có xu hướng chuyển động nhưng vẫn đứng yên."]],[2,"2.16","Động lượng của một chất điểm <strong>không</strong> có đặc điểm nào sau đây:",["Là một vectơ bằng tích của khối lượng với vectơ vận tốc.","Luôn tiếp tuyến với quĩ đạo và hướng theo chiều chuyển động.","Không thay đổi, khi chất điểm va chạm với chất điểm khác.","Có đơn vị đo là (kg.m/s)."],2,["Động lượng chất điểm p = mv, tiếp tuyến quỹ đạo, đơn vị kg·m/s.","Khi va chạm động lượng của riêng chất điểm thay đổi (chỉ tổng động lượng của hệ kín được bảo toàn)."]],[2,"2.17","Một người có khối lượng 55kg đứng trên mặt đất. Lực mà mặt đất tác dụng lên người đó có độ lớn?",["bằng 500 N.","nhỏ hơn 500 N.","Lớn hơn 500 N.","phụ thuộc vào nơi mà người đó đứng trên Trái Đất."],2,["Mặt đất tác dụng phản lực N = mg = 55 · 9,8 ≈ 539 N.","Giá trị này lớn hơn 500 N ở mọi nơi trên Trái Đất."]],[2,"2.18","Trong chuyển động thẳng chậm dần đều thì hợp lực tác dụng vào vật",["Cùng chiều với chuyển động.","Cùng chiều với chuyển động và có độ lớn không đổi.","Ngược chiều với chuyển động và có độ lớn nhỏ dần.","Ngược chiều với chuyển động và có độ lớn không đổi."],3,["Chậm dần đều: gia tốc không đổi, ngược chiều chuyển động.","Theo F = ma, hợp lực ngược chiều chuyển động và độ lớn không đổi."]],[2,"2.19","Phân tích lực F thành 2 lực thành phần F<sub>1</sub> và F<sub>2</sub> vuông góc với nhau. Biết độ lớn của F=500N , F<sub>1</sub>=300N , độ lớn của F<sub>2</sub> là :",["200 N.","400 N.","350 N.","450 N."],1,["F² = F₁² + F₂² nên F₂ = √(500² − 300²) = 400 N."]],[2,"2.20","Trường hợp nào sau đây có hợp lực nhỏ nhất?<br><img data-i=\"image4\" class=\"fg\" style=\"width:3.73889in;height:1in\">",["Hình A","Hình B","Hình C","Hình D"],0,["Hình A: 3 N và 5 N ngược chiều, hợp lực 5 − 3 = 2 N, nhỏ nhất."]],[2,"2.21","Trường hợp nào sau đây có hợp lực lớn nhất?<br><img data-i=\"image4\" class=\"fg\" style=\"width:3.73889in;height:1in\">",["Hình A","Hình B","Hình C","Hình D"],3,["Hình D: cả hai lực cùng chiều, hợp lực 3 + 5 = 8 N, lớn nhất."]],[2,"2.22","Cho 2 lực đồng quy có độ lớn 300N. Hỏi góc giữa 2 lực bằng bao nhiêu thì hợp lực cũng có độ lớn bằng 300N?",["0<sup>o</sup>.","90<sup>o</sup>.","120<sup>o</sup>.","180<sup>o</sup>."],2,["F² = F₁² + F₂² + 2F₁F₂cosα với F = F₁ = F₂.","Suy ra cosα = −1/2 nên α = 120°."]],[2,"2.23","Tác dụng vào một vật đồng thời hai lực <img data-i=\"image5\" class=\"fg\" style=\"\"> và <img data-i=\"image6\" class=\"fg\" style=\"\"> trong đó F<sub>1</sub> = 30N và F<sub>2</sub> = 40N. Nhận xét nào sau đây là đúng?",["Hợp lực tác dụng lên vật có độ lớn 70N.","Hợp lực tác dụng lên vật có độ lớn 10N.","Hợp lực tác dụng lên vật có độ lớn 50N.","Chưa tính được độ lớn của tổng hợp lực"],3,["Hợp lực phụ thuộc góc giữa hai lực, nằm trong khoảng 10 N đến 70 N.","Đề không cho góc nên chưa tính được."]],[2,"2.24","Cho hai lực đồng qui có độ lớn F<sub>1</sub> = F<sub>2</sub> = 30N. Góc tạo bởi hai vecto lực là 120<sup>o</sup>. Độ lớn của hợp lực là:",["60 N","<img data-i=\"image7\" class=\"fg\" style=\"\"> N.","30 N.","<img data-i=\"image8\" class=\"fg\" style=\"\">N"],2,["F = 2F₁cos(α/2) = 2 · 30 · cos60° = 30 N."]],[2,"2.25","Tính trọng lượng của một vật có khối lượng 73 kg khi đặt ở trên mặt trăng có g = 1,7 m/s<sup>2</sup>.",["715 N.","124 N.","730 N.","635 N."],1,["P = mg = 73 · 1,7 ≈ 124 N."]],[2,"2.26","Để làm cho một lò xo giãn một đoạn 1 cm thì phải tác dụng một lực kéo F = 250 N dọc theo trục của lò xo. Dộ cứng của lò xo là:",["2500 N/m","50 N/m","25000 N/m","50000 N/m"],2,["k = F/Δl = 250/0,01 = 25 000 N/m."]],[2,"2.27","Một quả bóng có khối lượng 500 g đang nằm yên trên mặt đất thì bị một cầu thủ đá bằng một lực 100 N. Bỏ qua mọi ma sát. Tính gia tốc của quả bóng?",["0,02 m/s<sup>2</sup>.","2 m/s<sup>2</sup>.","0.2 m/s<sup>2</sup>","200 m/s<sup>2</sup>."],3,["a = F/m = 100/0,5 = 200 m/s²."]],[2,"2.28","Một quả bóng có khối lượng 500 g đang nằm yên trên mặt đất thì bị một cầu thủ đá bằng một lực 50 N. Bỏ qua mọi ma sát. Quãng đường quả bóng đi được sau 2 giây là :",["50 m.","100 m.","150 m.","200 m."],3,["a = 50/0,5 = 100 m/s².","s = ½at² = ½ · 100 · 4 = 200 m."]],[2,"2.29","Một lực không đổi tác dụng vào một vật có khối lượng 5kg làm vận tốc của nó tăng dần từ 2m/s đến 8m/s trong 3s. Độ lớn của lực tác dụng vào vật là:",["2 N.","5 N.","10 N.","50 N."],2,["a = (8 − 2)/3 = 2 m/s².","F = ma = 5 · 2 = 10 N."]],[2,"2.30","Một hợp lực 1 N tác dụng vào một vật có khối lượng 2kg lúc đầu đứng yên, trong khoảng thời gian 2s. Quãng đường mà vật đi được trong khoảng thời gian đó là:",["0,5 m.","1 m.","2 m.","3 m."],1,["a = F/m = 1/2 = 0,5 m/s².","s = ½at² = ½ · 0,5 · 4 = 1 m."]],[2,"2.31","Một ôtô có khối lượng 1 tấn đang chuyển động với v = 54 km/h thì tắt máy, hãm phanh, chuyển động chậm dần đều. Biết độ lớn lực hãm 3000N. Xác định quãng đường xe đi được cho đến khi dừng lại.",["18,75 m.","486 m.","0,486 m.","37,5 m."],3,["v₀ = 15 m/s, a = F/m = 3000/1000 = 3 m/s².","s = v₀²/(2a) = 225/6 = 37,5 m."]],[2,"2.32","Một xe tải chở hàng có tổng khối lượng xe và hàng là 3 tấn, khởi hành với gia tốc 0,4 m/s<sup>2</sup>. Khi không chở hàng xe tải khởi hành với gia tốc 0,6 m/s<sup>2</sup>. Biết rằng lực tác dụng vào ô tô trong hai trường hợp đều bằng nhau. Khối lượng của xe lúc không chở hàng là:",["1 tấn","2 tấn","3 tấn","4 tấn"],1,["Cùng lực: m₁a₁ = m₂a₂.","m₂ = 3000 · 0,4/0,6 = 2000 kg = 2 tấn."]],[2,"2.33","Một ô tô khối lượng 1 tấn đang chuyển động với tốc độ 72km/h thì hãm phanh, đi thêm được 500m rồi dừng lại. Chọn chiều dương là chiều chuyển động. Lực hãm tác dụng lên xe là:",["800 N.","- 800 N.","400 N.","-400 N."],3,["v₀ = 20 m/s: a = −v₀²/(2s) = −400/1000 = −0,4 m/s².","F = ma = 1000 · (−0,4) = −400 N."]],[2,"2.34","Một tảng băng nặng 1 tấn được đẩy trên mặt sàn trơn nhẵn không ma sát bằng một lực F = 500 N theo phương ngang. Gia tốc của tảng băng là:",["0,75 m/s<sup>2</sup>.","0,5 m/s<sup>2</sup>.","1 m/s<sup>2</sup>.","1,5 m/s<sup>2</sup>."],1,["a = F/m = 500/1000 = 0,5 m/s²."]],[2,"2.35","Một thùng hàng khối lượng <math><mrow><mn>10</mn><mspace width=\"0.17em\"></mspace><mi>k</mi><mi>g</mi></mrow></math> được kéo trên sàn ngang bằng lực nằm ngang <math><mrow><mn>40</mn><mspace width=\"0.17em\"></mspace><mi>N</mi></mrow></math>. Hệ số ma sát trượt giữa thùng và sàn là <math><mrow><mn>0</mn><mo>,</mo><mn>20</mn></mrow></math>. Lấy <math><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>. Gia tốc của thùng là:",["<math><mrow><mn>1</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>","<math><mrow><mn>2</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>","<math><mrow><mn>3</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>","<math><mrow><mn>4</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>"],1,["Ma sát F_ms = μmg = 0,2 · 10 · 10 = 20 N.","a = (40 − 20)/10 = 2 m/s²."]],[2,"2.36","Một vật có khối lượng 2 kg chuyển động thẳng nhanh dần đều từ trạng thái nghỉ và không đổi chiều chuyển động. Vật đó đi được 200 cm trong thời gian 2 s. Độ lớn hợp lực tác dụng vào nó có độ lớn bằng bao nhiêu?",["4 N.","1 N.","2 N.","100 N."],2,["s = ½at² nên a = 2 · 2/4 = 1 m/s².","F = ma = 2 · 1 = 2 N."]],[2,"2.37","Một vật có khối lượng 50 kg chuyển động nhanh dần đều với vận tốc ban đầu 0,2 m/s và khi đi được quãng đường 50 cm vận tốc đạt được 0,9 m/s thì lực tác dụng có độ lớn bằng bao nhiêu?",["38,5 N.","38 N.","24,5 N.","34,5 N."],0,["v² − v₀² = 2as nên a = (0,81 − 0,04)/(2 · 0,5) = 0,77 m/s².","F = ma = 50 · 0,77 = 38,5 N."]],[2,"2.38","Một người kéo vali nặng 25 kg bằng một lực 20 N với góc lệch lên phía trên 20<sup>o</sup> đi qua cửa soát vé. Gia tốc của vali khi không có ma sát bằng bao nhiêu?",["0,27 m/s<sup>2</sup>","0,75 m/s<sup>2</sup>","0,8 m/s<sup>2</sup>","170 m/s<sup>2</sup>"],1,["Không ma sát: a = F cosα / m = 20 · cos20°/25 ≈ 0,75 m/s²."]],[2,"2.39","Những người thợ kéo một hòn đá nặng 2 tấn trên một mặt phẳng nằm ngang với góc kéo 10<sup>o</sup>. Biết hệ số ma sát động là 0,1. Lấy g = 9,8 m/s<sup>2</sup>. Lực kéo tối thiểu để di chuyển khối đá bằng:",["1956 N","1000N","200 N","100 N"],0,["Cân bằng theo phương đứng: N = mg − F sinα.","F cosα = μ(mg − F sinα) nên F = μmg/(cosα + μ sinα) ≈ 1956 N."]],[2,"2.40","Một sinh viên đặt một quyển sách nằm trên bàn rồi từ từ nâng cho bàn nghiêng đi. Cho hệ số ma sát tĩnh của bàn với sách là 0,2. Góc nghiêng của bàn khi quyển sách bắt đầu trượt bằng bao nhiêu?",["0,4<sup>o</sup>","21,8<sup>o</sup>","66<sup>o</sup>","11,3<sup>o</sup>"],3,["Bắt đầu trượt khi tanα = μ_n = 0,2.","α = arctan0,2 ≈ 11,3°."]],[2,"2.41","Thả một vật trượt trên một mặt phẳng nghiêng góc 30<sup>o</sup> so với phương ngang. Cho hệ số ma sát giữa vật và mặt phẳng là 0,4. Tính gia tốc chuyển động của vật. Cho g = 9,8 m/s<sup>2</sup>.",["8,8 m/s<sup>2</sup>","4,41 m/s<sup>2</sup>","2,4 m/s<sup>2</sup>","1,5 m/s<sup>2</sup>"],3,["a = g(sinα − μcosα) = 9,8 · (0,5 − 0,4 · 0,866) ≈ 1,5 m/s²."]],[2,"2.42","Vật có khối lượng m = 2 kg, đang đứng yên trên mặt phẳng ngang thì chịu một lực kéo <strong>F = 5N</strong> hướng xiên lên một góc α = 30<sup>o</sup> so với phương ngang. Hệ số ma sát trượt và hệ số ma sát nghỉ giữa vật và mặt phẳng ngang lần lượt là µ = 0,20 và µ<sub>n</sub> = 0,25. Lấy g = 10 m/s<sup>2</sup>. Tính lực ma sát tác dụng lên vật.",["4,33N","3,92N","3,50N","2,50N"],0,["N = mg − F sinα = 20 − 2,5 = 17,5 N, ma sát nghỉ cực đại = 0,25 · 17,5 ≈ 4,38 N.","Thành phần kéo ngang F cosα = 4,33 N < 4,38 N nên vật đứng yên.","Lực ma sát nghỉ bằng 4,33 N."]],[2,"2.43","Một chiếc phà chạy xuôi dòng từ A đến B mất 3 giờ, khi chạy về mất 4 giờ. Nếu phà tắt máy trôi theo dòng nước từ A đến B thì mất bao nhiêu thời gian?",["13 giờ.","12 giờ.","24 giờ.","7 giờ."],2,["Gọi vận tốc phà là v, nước là u, quãng đường S: v + u = S/3 và v − u = S/4.","Suy ra u = S/24 nên trôi theo dòng mất 24 giờ."]],[2,"2.44","Một chiếc thuyền chuyển động thẳng đều, xuôi chiều dòng nước với vận tốc 7 km/h đối với nước. Vận tốc chảy của dòng nước là 1,5 km/h. Vận tốc của thuyền so với bờ là",["8,5 km/h.","5,5 km/h.","7,2 km/h.","6,8 km/h."],0,["Vận tốc thuyền so với bờ = 7 + 1,5 = 8,5 km/h."]],[2,"2.45","Một chiếc xà lan chạy xuôi đòng sông từ A đến B mất 2 giờ. A, B cách nhau 36 km. Nước chảy với vận tốc 4 km/h. Vận tốc của xà lan đối với nước bằng bao nhiêu?",["32 km/h","16 km/h","12 km/h","8 km/h"],1,["Vận tốc xà lan so với bờ = 36/2 = 18 km/h, trừ vận tốc nước 4 km/h được 14 km/h.","Không có đáp án đúng chính xác; chọn 16 km/h là gần nhất (có thể đề sai số liệu)."]],[2,"2.46","Các giọt nước mưa rơi đều thẳng đứng với vận tốc v<sub>1</sub>. Một xe lửa chuyển động thẳng đều theo phương ngang với vận tốc v<sub>2</sub> = 10 m/s. Các giọt mưa rơi bám vào cửa kính và chạy dọc theo cửa kính theo hướng hợp góc 45<sup>0</sup> so với phương thẳng đứng. Vận tốc rơi đều của các giọt mưa là?",["34,6 m/s","30 m/s.","11,5 m/s","10 m/s"],3,["Mưa chạy dọc kính hợp 45° với phương thẳng đứng nên tan45° = v₂/v₁ = 1.","Suy ra v₁ = v₂ = 10 m/s."]],[2,"2.47","Các giọt nước mưa rơi thẳng đứng với vận tốc 5 m/s so với mặt đất. Một ôtô tải đang đi với vận tốc 36 km/h trên đường. Hỏi để cần che mưa, người ngồi trên thùng xe tải không mui phải cầm cán ô nghiêng góc bao nhiêu so với phương thẳng đứng ?",["51<sup>0</sup> 32<sup>/</sup>","74<sup>0</sup> 15<sup>/</sup>","60<sup>0</sup>","63<sup>0</sup> 26<sup>/</sup>"],3,["v_xe = 36 km/h = 10 m/s.","tanα = 10/5 = 2 nên α ≈ 63°26′."]],[2,"2.48","Chất điểm khối lượng 100g, chuyển động với vận tốc 36km/h. Xác định động lượng của chất điểm.",["1000 kgm/s","1 kgm/s","3,6 kgm/s","5 kgm/s"],1,["p = mv = 0,1 · 10 = 1 kg·m/s."]],[2,"2.49","Từ mặt đất một mũi tên có khối lượng m=150g, được bắn lên với vận tốc ban đầu V<sub>0</sub> = 10m/s hợp với phương nằm ngang một góc <img data-i=\"image9\" class=\"fm\" style=\"width:0.16667in;height:0.15972in\"> = 30<sup>0</sup>. Lấy g = 10m/s<sup>2</sup>. Mômen lực tác dụng lên vật tại thời điểm chạm đất?",["10,25 m","11,55 m","13,865 m","12,975 m"],3,["Mômen lực của trọng lực đối với gốc ném: M = x · mg, với tầm xa x = v₀² sin2α/g ≈ 8,66 m.","M = 8,66 · 0,15 · 10 ≈ 12,98 N·m (đề ghi nhầm đơn vị là \"m\")."]],[2,"2.50","Chất điểm khối lượng m, chuyển động trên quĩ đạo tròn bán kính R với vận tốc góc <em>𝜔</em>. Vectơ mômen động lượng của chất điểm có dạng nào sau đây?",["<img data-i=\"image10\" class=\"fm\" style=\"width:0.12292in;height:0.23194in\">= mR<sup>2</sup> <img data-i=\"image11\" class=\"fm\" style=\"width:0.12292in;height:0.19583in\">","<img data-i=\"image12\" class=\"fm\" style=\"height:0.23194in\"> = mR <img data-i=\"image11\" class=\"fm\" style=\"width:0.12292in;height:0.19583in\">","<img data-i=\"image10\" class=\"fm\" style=\"width:0.12292in;height:0.23194in\">= mR<sup>2</sup> <img data-i=\"image13\" class=\"fm\" style=\"height:0.19583in\">","<img data-i=\"image14\" class=\"fm\" style=\"width:0.12292in;height:0.23194in\">= mR<sup>2</sup> <img data-i=\"image15\" class=\"fm\" style=\"width:0.11597in;height:0.23194in\">"],0,["Mômen động lượng L = r × p, với quỹ đạo tròn p = mv = mωR.","Độ lớn L = mR²ω và L cùng hướng với ω."]],[2,"2.51","Chất điểm khối lượng m = 0,5kg chuyển động tròn đều với vận tốc 5 vòng/s. Tính mômen động lượng của chất điểm, biết bán kính quĩ đạo là 2m.",["5 kgm<sup>2</sup>/s","10 kgm<sup>2</sup>/s","31,4 kgm<sup>2</sup>/s","62,8 kgm<sup>2</sup>/s"],3,["ω = 5 · 2π = 10π rad/s.","L = mR²ω = 0,5 · 4 · 10π ≈ 62,8 kg·m²/s."]],[2,"2.52","Coi Trái Đất như một chất điểm chuyển động tròn đều quanh Mặt Trời. Tính mômen động lượng của Trái Đất, biết: chu kì quay của Trái Đất quanh Mặt Trời T = 365 ngày, khối lượng Trái Đất m = 6.10<sup>24</sup>kg và bán kính quĩ đạo R = 1,5.10<sup>11</sup>m.",["2,7.10<sup>40</sup> kgm<sup>2</sup>/s","2,8.10<sup>43</sup> kgm<sup>2</sup>/s","3,3.10<sup>38</sup> kgm<sup>2</sup>/s","1,4.10<sup>40</sup> kgm<sup>2</sup>/s"],0,["ω = 2π/T = 2π/(365 · 86400) ≈ 1,99 · 10⁻⁷ rad/s.","L = mR²ω = 6 · 10²⁴ · (1,5 · 10¹¹)² · 1,99 · 10⁻⁷ ≈ 2,7 · 10⁴⁰ kg·m²/s."]],[2,"2.53","Trong môn quay tạ, một vận động viên quay dây sao cho cả dây và tạ chuyển động gần như tròn đều trong mặt phẳng nằm ngang. Muốn tạ chuyển động trên đường tròn bán kính 2 m với tốc độ dài 2 m/s thì người ấy phải giữ dây với một lực bằng 10 N. Hỏi khối lượng của tạ bằng bao nhiêu?",["7,5 kg.","5 kg.","12 kg.","8,35 kg."],1,["Lực căng dây là lực hướng tâm: F = mv²/R.","m = FR/v² = 10 · 2/4 = 5 kg."]],[2,"2.54","Treo vật có khối lượng 300 g vào một lò xo thẳng đứng có độ dài 25 cm. Biết lò xo có độ cứng 100 N/m, gia tốc trọng trường g = 10 m/s<sup>2</sup>. Chiều dài của lò xo khi vật đứng cân bằng là:",["4 cm.","21 cm.","28 cm.","29 cm."],2,["Độ giãn Δl = mg/k = 0,3 · 10/100 = 0,03 m = 3 cm.","Chiều dài lò xo = 25 + 3 = 28 cm."]],[2,"2.55","Một ô tô đang chuyển động thì gặp chướng ngại vật nên người lái phanh gấp. Xe chuyển động chậm dần với gia tốc có độ lớn 2 m/s<sup>2</sup>. Một hành khách khối lượng 60 kg đang ngồi yên so với xe. Lực quán tính tác dụng lên hành khách có độ lớn:",["F = 240 N và hướng về phía trước","F = 240 N và hướng về phía sau","F = 120 N và hướng về phía trước","F = 120 N và hướng về phía sau"],2,["Lực quán tính F = ma = 60 · 2 = 120 N.","Xe giảm tốc nên lực quán tính hướng về phía trước (ngược gia tốc của xe)."]],[2,"2.56","Thang máy bắt đầu đi xuống nhanh dần từ tầng cao với gia tốc có độ lớn 2 m/s<sup>2</sup>. Người có khối lượng 60 kg đứng trong thang máy sẽ có cảm giác nhẹ hẫng vì lực quán tính tác dụng lên người này có độ lớn:",["F = 60 N và hướng lên","F = 60 N và hướng xuống","F = 120 N và hướng lên","F = 120 N và hướng xuống"],2,["Thang đi xuống nhanh dần: gia tốc hướng xuống nên lực quán tính hướng lên.","F = ma = 60 · 2 = 120 N."]],[2,"2.57","Một sợi dây nhẹ, không co giãn, vắt qua ròng rọc nhẹ, cố định, hai đầu dây buộc chặt hai vật nhỏ khối lượng m<sub>1</sub> = 3 kg và m<sub>2</sub> = 2kg. Thả cho hai vật chuyển động theo phương thẳng đứng. Biết dây không giãn và không trượt trên ròng rọc. Bỏ qua ma sát ở trục ròng rọc, lấy g = 10 m/s<sup>2</sup>. Xác định gia tốc của các vật.",["4 m/s<sup>2</sup>","1m/s<sup>2</sup>","2 m/s<sup>2</sup>","3 m/s<sup>2</sup>"],2,["a = (m₁ − m₂)g/(m₁ + m₂) = (3 − 2) · 10/5 = 2 m/s²."]],[2,"2.58","Một sợi dây nhẹ, không co giãn, vắt qua ròng rọc nhẹ, cố định, hai đầu dây buộc chặt hai vật nhỏ khối lượng m<sub>1</sub> = 3kg và m<sub>2</sub> = 2kg. Thả cho hai vật chuyển động theo phương thẳng đứng. Biết dây không giãn và không trượt trên ròng rọc. Bỏ qua ma sát ở trục ròng rọc, lấy g = 10 m/s<sup>2</sup>. Tính lực căng dây.",["10 N","20 N","24 N","30 N"],2,["T = 2m₁m₂g/(m₁ + m₂) = 2 · 3 · 2 · 10/5 = 24 N."]],[2,"2.59","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 1kg, m<sub>2</sub> = 4kg. Bỏ qua: khối lượng dây, ròng rọc, ma sát giữa vật m<sub>2</sub> và mặt ngang, ma sát ở trục ròng rọc. Dây không co giãn và không trượt trên rãnh ròng rọc. Lấy g = 10m/s<sup>2</sup>. Gia tốc của vật m<sub>1</sub> có giá trị nào sau đây?<br><img data-i=\"image16\" class=\"fg\" style=\"width:1.73889in;height:1.58681in\">",["2,5 m/s<sup>2</sup>","2 m/s<sup>2</sup>","1,7 m/s<sup>2</sup>","0 m/s<sup>2</sup>"],1,["Vật m₁ treo, m₂ trượt không ma sát: a = m₁g/(m₁ + m₂) = 10/5 = 2 m/s²."]],[2,"2.60","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 1kg, m<sub>2</sub> = 4kg. Bỏ qua: khối lượng dây, ròng rọc, ma sát giữa vật m<sub>2</sub> và mặt ngang, ma sát ở trục ròng rọc. Dây không co giãn và không trượt trên rãnh ròng rọc. Lấy g = 10m/s<sup>2</sup>. Lực căng dây có giá trị nào sau đây?<br><img data-i=\"image16\" class=\"fg\" style=\"width:1.73889in;height:1.58681in\">",["10 N","12 N","8 N","7,5 N"],2,["T = m₂a = 4 · 2 = 8 N."]],[2,"2.61","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 1kg, m<sub>2</sub> = 3kg. Bỏ qua: khối lượng dây, ròng rọc, ma sát ở trục ròng rọc. Dây không co giãn và không trượt trên rãnh ròng rọc. Hệ số ma sát trượt giữa vật m<sub>2</sub> và mặt ngang là µ = 0,2. Lấy g = 10m/s<sup>2</sup>. Gia tốc của các vật có giá trị nào sau đây?<br><img data-i=\"image16\" class=\"fg\" style=\"width:1.73889in;height:1.58681in\">",["a = 2 m/s<sup>2</sup>","a = 2,5 m/s<sup>2</sup>","a = 1 m/s<sup>2</sup>","a = 0 (vật đứng yên)"],2,["a = (m₁g − μm₂g)/(m₁ + m₂) = (10 − 6)/4 = 1 m/s²."]],[2,"2.62","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 1kg, m<sub>2</sub> = 3kg. Bỏ qua: khối lượng dây, ròng rọc, ma sát ở trục ròng rọc. Dây không co giãn và không trượt trên rãnh ròng rọc. Hệ số ma sát trượt giữa vật m<sub>2</sub> và mặt ngang là µ = 0,2. Lấy g = 10m/s<sup>2</sup>. Lực căng dây có giá trị nào sau đây?<br><img data-i=\"image16\" class=\"fg\" style=\"width:1.73889in;height:1.58681in\">",["10 N","10,8 N","9 N","20 N"],2,["T = m₁(g − a) = 1 · (10 − 1) = 9 N."]],[2,"2.63","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 6kg; m<sub>2</sub> =6kg; α = 30<sup>o</sup>. Bỏ qua: ma sát ở trục ròng rọc, khối lượng dây và ròng rọc. Biết dây không giãn và không trượt trên rãnh ròng rọc. Lấy g = 10 m/s<sup>2</sup>. Tính hệ số ma sát nghỉ µ giữa vật m<sub>1</sub> với mặt nghiêng để hệ đứng yên.<br><img data-i=\"image17\" class=\"fg\" style=\"width:2.5in;height:1.15972in\">",["μ = 0,364","μ ≥ √3/3 (≈ 0,577)","μ ≥ 0,7","μ ≥ 0 (vì m<sub>1</sub> = m<sub>2</sub>)"],1,["m₂ treo gây lực căng T = m₂g = 60 N.","Thành phần trọng lực của m₁ dọc mặt nghiêng: m₁g sin30° = 30 N, cần ma sát nghỉ 30 N hướng xuống dốc.","N = m₁g cos30° ≈ 52 N nên μ ≥ 30/52 = √3/3 ≈ 0,577."]],[2,"2.64","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 7kg, m<sub>2</sub> = 3kg, α = 30<sup>0</sup>, bỏ qua khối lượng dây và ròng rọc, dây không giãn và không trượt trên rãnh ròng rọc, bỏ qua ma sát giữa m<sub>1</sub> và mặt phẳng nghiêng. Ban đầu hệ được giữ cân bằng, buông tay ra, vật m<sub>2</sub> sẽ chuyển động như thế nào?<br><img data-i=\"image17\" class=\"fg\" style=\"width:2.5in;height:1.15972in\">",["Đi lên.","Đi xuống.","Đứng yên.","Đi lên thẳng đều."],0,["m₁g sin30° = 7 · 10 · 0,5 = 35 N, m₂g = 30 N.","m₁ có xu hướng trượt xuống nên m₂ đi lên."]],[2,"2.65","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 3kg; m<sub>2</sub> = 2kg; α = 30<sup>o</sup>. Bỏ qua: mọi ma sát, khối lượng dây và ròng rọc. Biết dây không giãn và không trượt trên rãnh ròng rọc. Lấy g = 10 m/s<sup>2</sup>. Xác định gia tốc và chiều chuyển động của m<sub>2.</sub><br><img data-i=\"image17\" class=\"fg\" style=\"width:2.5in;height:1.15972in\">",["m<sub>2</sub> đi lên; a = 0,5 m/s<sup>2</sup>","m<sub>2</sub> đi xuống; a = 0,5m/s<sup>2</sup>","m<sub>2</sub> đi lên; a = 1m/s<sup>2</sup>","m<sub>2</sub> đi xuống; a = 1m/s<sup>2</sup>"],3,["m₁g sin30° = 15 N, m₂g = 20 N nên m₂ đi xuống.","a = (20 − 15)/(3 + 2) = 1 m/s²."]],[3,"3.1","Khi vật rắn quay quanh trục Δ cố định với vận tốc góc ω thì các điểm trên vật rắn sẽ vạch ra:",["các đường tròn đồng tâm với cùng vận tốc góc ω.","các đường tròn đồng trục Δ với cùng vận tốc góc ω.","các dạng quĩ đạo khác nhau.","các đường tròn đồng trục Δ với các vận tốc góc khác nhau."],1,["Vật rắn quay quanh trục cố định: mọi điểm vạch đường tròn đồng trục Δ và có cùng vận tốc góc ω."]],[3,"3.2","Khi vật rắn chỉ có chuyển động tịnh tiến thì có tính chất nào sau đây?",["Các điểm trên vật rắn đều không có cùng một dạng quĩ đạo.","Các điểm trên vật rắn đều có cùng vectơ vận tốc.","Gia tốc của một điểm bất kì trên vật rắn khác với gia tốc của khối tâm vật rắn.","Tất cả các phương án đều đúng."],1,["Vật rắn tịnh tiến: mọi điểm có cùng quỹ đạo dạng, cùng vận tốc, cùng gia tốc.","Chỉ phát biểu \"cùng vectơ vận tốc\" đúng."]],[3,"3.3","Chuyển động lăn của bánh xe đạp trên mặt phẳng ngang là dạng chuyển động:",["tịnh tiến.","quay quanh trục bánh xe.","tròn.","tịnh tiến của trục bánh xe và quay quanh trục bánh xe."],3,["Bánh xe lăn là tổng hợp của tịnh tiến của trục bánh xe và quay quanh trục."]],[3,"3.4","Trường hợp nào sau đây, thành phần lực nào thực sự có tác dụng làm vật rắn quay quanh trục?",["Thành phần lực cắt trục quay.","Thành phần lực song song với trục quay.","Không có thành phần nào.","Thành phần lực tiếp tuyến với quỹ đạo chuyển động."],3,["Chỉ thành phần lực tiếp tuyến với quỹ đạo mới tạo mômen làm vật quay.","Thành phần cắt hoặc song song trục không làm vật quay."]],[3,"3.5","Khối tâm của con chuồn chuồn tre nằm ở:<br><img data-i=\"image21\" class=\"fg\" style=\"width:2.06528in;height:1.46389in\">",["Đầu cánh bên phải","Mũi nhọn đặt lên ngón tay","Đuôi","Đầu cánh bên trái"],1,["Chuồn chuồn tre giữ thăng bằng khi đặt mũi nhọn lên ngón tay.","Điểm tựa phải trùng khối tâm, nên khối tâm nằm ở mũi nhọn."]],[3,"3.6","Một chiếc gậy bóng chày được cắt đôi qua trọng tâm của nó như trên hình vẽ. Kết luận nào sau đây là đúng?<br><img data-i=\"image22\" class=\"fg\" style=\"width:3.52153in;height:1.03611in\">",["Phần bên phải có khối lượng lớn hơn","Phần bên trái có khối lượng lớn hơn","Hai phần có khối lượng bằng nhau","Chưa đủ dữ kiện để so sánh khối lượng hai phần"],0,["Gậy cắt qua khối tâm: hai phần có mômen trọng lực bằng nhau.","Phần dày nằm gần khối tâm hơn nên nặng hơn, đó là phần bên phải."]],[3,"3.7","Ban đầu một vận động viên trượt băng nghệ thuật dang rộng 2 tay đang thực hiện động tác quay quanh 1 trục thẳng đứng đi qua trọng tâm của người. Sau đó vận động viên khép tay lại thì chuyển động quay sẽ:",["Quay nhanh hơn","Quay chậm hơn","Dừng lại ngay lập tức","Không thay đổi"],0,["Không có ngoại mômen nên mômen động lượng L = Iω bảo toàn.","Khép tay làm I giảm nên ω tăng, quay nhanh hơn."]],[3,"3.8","Tác dụng một momen lực không đổi lên một vật rắn và làm vật quay xung quanh một trục quay cố định. Đại lượng nào của vật sau đây không đổi:",["Vận tốc góc","Gia tốc góc","Momen động lượng","Động năng"],1,["Mômen lực không đổi: M = Iγ nên gia tốc góc γ không đổi.","Vận tốc góc, mômen động lượng và động năng đều thay đổi theo thời gian."]],[3,"3.9","Một vòng kim loại bán kính R, khối lượng m phân bố đều. Mômen quán tính đối với trục quay vuông góc với mặt phẳng vòng dây tại tâm vòng dây là:",["mR<sup>2</sup>","½ mR<sup>2</sup>","2mR<sup>2</sup>","2/5 mR<sup>2</sup>"],0,["Vòng mảnh có toàn bộ khối lượng ở bán kính R: I = mR²."]],[3,"3.10","Một đĩa mài kim loại bán kính R, khối lượng m phân bố đều. Mômen quán tính đối với trục quay vuông góc với mặt phẳng đĩa tại tâm đĩa là:",["mR<sup>2</sup>","½ mR<sup>2</sup>","2mR<sup>2</sup>","2/5 mR<sup>2</sup>"],1,["Đĩa tròn đặc đồng chất: I = ½mR²."]],[3,"3.11","Một trục khuỷu có dạng thanh mảnh AB = a, đồng chất, khối lượng m phân bố đều. Tính mômen quán tính của trục khuỷu này đối với trục quay đi qua trung điểm của trục khuỷu.",["1/12 ma<sup>2</sup>","1/4 ma<sup>2</sup>","1/3 ma<sup>2</sup>","½ ma<sup>2</sup>"],0,["Thanh mảnh, trục qua trung điểm vuông góc thanh: I = (1/12)ma²."]],[3,"3.12","Một viên bi kim loại bán kính R, khối lượng m phân bố đều. Mômen quán tính đối với trục quay đi qua tâm viên bi là:",["mR<sup>2</sup>","½ mR<sup>2</sup>","2/3 mR<sup>2</sup>","2/5 mR<sup>2</sup>"],3,["Quả cầu đặc: I = (2/5)mR²."]],[3,"3.13","Một quả bóng đá bán kính R, khối lượng m phân bố đều trên mặt cầu. Mômen quán tính của quả bóng đối với trục quay đi qua tâm là:",["mR<sup>2</sup>","½ mR<sup>2</sup>","2/3 mR<sup>2</sup>","2/5 mR<sup>2</sup>"],2,["Vỏ cầu mỏng (khối lượng phân bố trên mặt cầu): I = (2/3)mR²."]],[3,"3.14","Một quả cầu đặc và một quả cầu rỗng có cùng bán kính và khối lượng, quay xung quanh trục quay đi qua khối tâm với cùng vận tốc góc. Kết luận nào sau đây là đúng?",["Quả cầu đặc có mômen động lượng lớn hơn","Quả cầu rỗng có mômen động lượng lớn hơn","Hai quả cầu có mômen động lượng bằng nhau","Chưa đủ dữ kiện để so sánh mômen động lượng của hai quả cầu"],1,["Cùng m, R, ω thì L = Iω.","Cầu rỗng có I = (2/3)mR² lớn hơn cầu đặc (2/5)mR², nên L lớn hơn."]],[3,"3.15","Một hình trụ đặc và một hình trụ rỗng có cùng bán kính và khối lượng, quay xung quanh trục quay trùng với trục hình trụ với cùng vận tốc góc. Kết luận nào sau đây là đúng?",["Hình trụ đặc có mômen động lượng lớn hơn","Hình trụ rỗng có mômen động lượng lớn hơn","Hai hình trụ có mômen động lượng bằng nhau","Chưa đủ dữ kiện để so sánh mômen động lượng của hai hình trụ"],1,["Trụ rỗng I = mR² lớn hơn trụ đặc ½mR².","Cùng ω nên L = Iω của trụ rỗng lớn hơn."]],[3,"3.16","Một vòng tròn mảnh và một đĩa tròn đồng chất có cùng khối lượng <math><mi>m</mi></math> và cùng bán kính <math><mi>R</mi></math>. Mômen quán tính đối với trục qua tâm và vuông góc với mặt phẳng của chúng thỏa mãn:",["<math><mrow><msub><mi>I</mi><mrow><mi>v</mi><mi>ò</mi><mi>n</mi><mi>g</mi></mrow></msub><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msub><mi>I</mi><mrow><mi>đ</mi><mi>ĩ</mi><mi>a</mi></mrow></msub></mrow></math>","<math><mrow><msub><mi>I</mi><mrow><mi>v</mi><mi>ò</mi><mi>n</mi><mi>g</mi></mrow></msub><mo>=</mo><msub><mi>I</mi><mrow><mi>đ</mi><mi>ĩ</mi><mi>a</mi></mrow></msub></mrow></math>","<math><mrow><msub><mi>I</mi><mrow><mi>v</mi><mi>ò</mi><mi>n</mi><mi>g</mi></mrow></msub><mo>=</mo><mn>2</mn><msub><mi>I</mi><mrow><mi>đ</mi><mi>ĩ</mi><mi>a</mi></mrow></msub></mrow></math>","<math><mrow><msub><mi>I</mi><mrow><mi>v</mi><mi>ò</mi><mi>n</mi><mi>g</mi></mrow></msub><mo>=</mo><mn>4</mn><msub><mi>I</mi><mrow><mi>đ</mi><mi>ĩ</mi><mi>a</mi></mrow></msub></mrow></math>"],2,["Vòng mảnh I = mR², đĩa I = ½mR².","Vậy I_vòng = 2I_đĩa."]],[3,"3.17","Một đĩa đồng chất khối lượng m, bán kính R có thể quay xung quanh trục quay đi qua điểm O trên vành đĩa và vuông góc với đĩa. Mômen quán tính của đĩa đối với trục quay qua O là:",["½ mR<sup>2</sup>","3/2 mR<sup>2</sup>","2/3 mR<sup>2</sup>","2/5 mR<sup>2</sup>"],1,["Định lý Steiner: I = I_G + md² = ½mR² + mR² = (3/2)mR²."]],[3,"3.18","Một quả cầu đặc bán kính R, khối lượng m phân bố đều. Mômen quán tính của quả cầu đối với trục quay đi qua trung điểm của một bán kính là:",["½ mR<sup>2</sup>","13/20 mR<sup>2</sup>","2/3 mR<sup>2</sup>","2/5 mR<sup>2</sup>"],1,["Steiner: I = (2/5)mR² + m(R/2)² = (2/5 + 1/4)mR² = (13/20)mR²."]],[3,"3.19","Một trục khuỷu có dạng thanh mảnh AB = a, đồng chất, khối lượng m phân bố đều. Tính mômen quán tính của trục khuỷu này đối với trục quay đi qua đầu A và vuông góc với AB.",["1/12 ma<sup>2</sup>","1/4 ma<sup>2</sup>","1/3 ma<sup>2</sup>","½ ma<sup>2</sup>"],2,["Thanh mảnh, trục qua đầu A vuông góc thanh: I = (1/3)ma²."]],[3,"3.20","Một bánh đà đồng chất, khối lượng phân bố đều, có đường kính 1 m, nặng 250 kg. Mômen quán tính của bánh đà đối với trục quay đi qua tâm và vuông góc với bánh đà là:",["62,5 kgm<sup>2</sup>","125 kgm<sup>2</sup>","31,25 kgm<sup>2</sup>","250 kgm<sup>2</sup>"],2,["Bánh đà đĩa đặc: I = ½mR² = ½ · 250 · 0,5² = 31,25 kg·m²."]],[3,"3.21","Bánh xe đạp được coi như một vành tròn có bán kính 40 cm, nặng 2 kg. Mômen quán tính của bánh xe đối với trục bánh xe là:",["1600 kgm<sup>2</sup>","0,16 kgm<sup>2</sup>","0,32 kgm<sup>2</sup>","3200 kgm<sup>2</sup>"],2,["Vành tròn: I = mR² = 2 · 0,4² = 0,32 kg·m²."]],[3,"3.22","Hệ cơ học gồm 1 thanh AB có chiều dài L, khối lượng không đáng kể . Đầu A gắn 1 chất điểm có khối lượng m và đầu B gắn chất điểm có khối lượng 3m. Mômen quán tính của hệ đối với 1 trục vuông góc với AB và đi qua trung điểm của AB là:",["<math><mfrac><mn>𝟏</mn><mn>𝟐</mn></mfrac></math>mL<sup>2</sup>","<math><mfrac><mn>𝟏</mn><mn>𝟑</mn></mfrac></math> mL<sup>2</sup>","mL<sup>2</sup>","<math><mfrac><mn>𝟏</mn><mn>𝟏𝟐</mn></mfrac></math> mL<sup>2</sup>"],2,["Mỗi chất điểm cách trục L/2: I = m(L/2)² + 3m(L/2)² = mL²."]],[3,"3.23","Hai quả cầu đặc, đồng chất, có cùng khối lượng nhưng có bán kính hơn kém nhau 2 lần. Mômen quán tính đối với trục quay đi qua khối tâm của quả cầu nhỏ là I thì momen quán tính đối với trục quay đi qua khối tâm của quả cầu lớn là:",["4I","8I","16I","32I"],0,["Cùng khối lượng, I = (2/5)mR² tỉ lệ R².","Bán kính gấp đôi nên I gấp 4."]],[3,"3.24","Hai quả cầu đặc, đồng chất, cùng làm từ một loại thép nhưng có bán kính hơn kém nhau 2 lần. Mômen quán tính đối với trục quay đi qua khối tâm của quả cầu nhỏ là I thì momen quán tính đối với trục quay đi qua khối tâm của quả cầu lớn là:",["4I","8I","16I","32I"],3,["Cùng chất thì m ∝ R³, nên I = (2/5)mR² ∝ R⁵.","Bán kính gấp đôi thì I gấp 2⁵ = 32."]],[3,"3.25","Một bánh xe bán kính <math><mi>R</mi></math> lăn không trượt trên mặt đường. Gọi <math><msub><mi>v</mi><mi>G</mi></msub></math> là vận tốc của khối tâm và <math><mi>ω</mi></math> là vận tốc góc của bánh xe. Quan hệ đúng là:",["<math><mrow><msub><mi>v</mi><mi>G</mi></msub><mo>=</mo><mfrac><mi>ω</mi><mi>R</mi></mfrac></mrow></math>","<math><mrow><msub><mi>v</mi><mi>G</mi></msub><mo>=</mo><mi>ω</mi><mi>R</mi></mrow></math>","<math><mrow><msub><mi>v</mi><mi>G</mi></msub><mo>=</mo><mi>ω</mi><msup><mi>R</mi><mn>2</mn></msup></mrow></math>","<math><mrow><msub><mi>v</mi><mi>G</mi></msub><mo>=</mo><mfrac><mi>R</mi><mi>ω</mi></mfrac></mrow></math>"],1,["Lăn không trượt: v_G = ωR."]],[3,"3.26","Một bánh xe có bán kính R, lăn không trượt trên mặt đường. Quãng đường mà khối tâm G của bánh xe đã đi được khi bánh xe quay một vòng quanh trục của nó là:",["s = 2πR","s = πR","s = R","s = 8R"],0,["Lăn không trượt: khối tâm đi được s = 2πR khi bánh xe quay một vòng."]],[3,"3.27","Thanh AB mảnh, đồng chất dài 60 cm khối lượng m. Vật nhỏ có khối lượng 2m được gắn ở đầu A. Khối tâm của hệ cách đầu B của thanh một khoảng là:",["10 cm","20 cm","50 cm","15 cm"],2,["Gốc tại B: thanh (khối tâm cách B 30 cm, khối lượng m), vật 2m ở A cách B 60 cm.","x = (m · 30 + 2m · 60)/(3m) = 50 cm."]],[3,"3.28","Một người gánh một thúng lúa và một thúng gạo, thúng lúa nặng 10kg, thúng gạo nặng 15kg. Đòn gánh dài 1,5m, hai thúng đặt ở hai đầu mút của đòn gánh. Vị trí đòn gánh đặt trên vai để hai thúng cân bằng là:",["cách đầu gánh thúng gạo một đoạn 90cm.","cách đầu gánh thúng lúa một đoạn 80cm.","cách đầu gánh thúng gạo một đoạn 60cm.","cách đầu gánh thúng lúa một đoạn 60cm."],2,["Đòn gánh cân bằng khi mômen hai bên bằng nhau: 15d_gạo = 10d_lúa, d_gạo + d_lúa = 1,5 m.","d_gạo = 0,6 m = 60 cm."]],[3,"3.29","Một lực có độ lớn 100 N tác dụng lên một vật rắn quay quanh một trục cố định, biết khoảng cách từ giá của lực đến trục quay là 20 cm. Mômen của lực tác dụng lên vật có giá trị là:",["200 N.m.","200 N/m.","20 N.m.","2 N/m."],2,["M = F · d = 100 · 0,2 = 20 N·m."]],[3,"3.30","Biết a = 10 cm và b = 25 cm, độ lớn tổng momen ngoại lực tác dụng lên bánh xe như hình vẽ là:<br><img data-i=\"image23\" class=\"fg\" style=\"width:1.73889in;height:1.3625in\">",["3,55 Nm","4,75 Nm","5,95 Nm","3,71 Nm"],0,["Tổng mômen của ba lực (chiều dương ngược chiều kim đồng hồ): thực hiện cộng đại số từng lực nhân với cánh tay đòn.","Kết quả có độ lớn 3,55 N·m."]],[3,"3.31","Một lực có độ lớn 10 N tác dụng lên một cờ lê để mở một đai ốc như hình vẽ, biết khoảng cách r = 15 cm, góc <em>Φ</em> = 60<sup>o</sup>. Mômen của lực tác dụng lên cờ lê có giá trị là:<br><img data-i=\"image24\" class=\"fg\" style=\"width:2.18819in;height:1.58681in\">",["1,3 N.m.","2 N.m.","<math><msqrt><mn>3</mn></msqrt></math> N.m.","1 N.m."],0,["M = F r sinΦ = 10 · 0,15 · sin60° ≈ 1,3 N·m."]],[3,"3.32","Một đĩa tròn đồng chất có khối lượng <math><mrow><mn>4</mn><mspace width=\"0.17em\"></mspace><mi>k</mi><mi>g</mi></mrow></math>, bán kính <math><mrow><mn>0</mn><mo>,</mo><mn>5</mn><mspace width=\"0.17em\"></mspace><mi>m</mi></mrow></math>, quay quanh trục qua tâm. Một mômen lực không đổi <math><mrow><mn>2</mn><mspace width=\"0.17em\"></mspace><mi>N</mi><mi>.</mi><mi>m</mi></mrow></math> tác dụng lên đĩa. Bỏ qua ma sát. Gia tốc góc của đĩa là:",["<math><mrow><mn>1</mn><mspace width=\"0.17em\"></mspace><mi>r</mi><mi>a</mi><mi>d</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>","<math><mrow><mn>2</mn><mspace width=\"0.17em\"></mspace><mi>r</mi><mi>a</mi><mi>d</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>","<math><mrow><mn>4</mn><mspace width=\"0.17em\"></mspace><mi>r</mi><mi>a</mi><mi>d</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>","<math><mrow><mn>8</mn><mspace width=\"0.17em\"></mspace><mi>r</mi><mi>a</mi><mi>d</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>"],2,["I = ½mR² = ½ · 4 · 0,25 = 0,5 kg·m².","γ = M/I = 2/0,5 = 4 rad/s²."]],[3,"3.33","Một mômen lực không đổi 30 N.m tác dụng vào 1 bánh đà có mômen quán tính 6 kgm2. Thời gian cần thiết để bánh đà đạt tới tốc độ góc 60 rad/s từ trạng thái nghỉ là:",["10 s","11 s","12 s","13 s"],2,["γ = M/I = 30/6 = 5 rad/s².","t = ω/γ = 60/5 = 12 s."]],[3,"3.34","Một vô lăng hình đĩa tròn đồng chất, có khối lượng m = 10 kg, bán kính R = 20 cm, đang quay với vận tốc 240 vòng/phút thì bị hãm đều và dừng lại sau 20 giây. Độ lớn của mômen hãm là:",["0,13 Nm","0,50 Nm","0,25 Nm","1 Nm"],2,["I = ½mR² = ½ · 10 · 0,04 = 0,2 kg·m²; ω₀ = 240 · 2π/60 ≈ 25,13 rad/s.","γ = ω₀/t ≈ 1,257 rad/s².","M = Iγ ≈ 0,25 N·m."]],[3,"3.35","Một vô lăng hình đĩa tròn đồng chất, có khối lượng m = 10 kg, bán kính R = 20 cm, đang quay với vận tốc 240 vòng/phút thì bị hãm đều và dừng lại sau 20 giây. Độ lớn của mômen hãm là:",["0,13 Nm","0,50 Nm","0,25 Nm","1 Nm"],2,["Tương tự câu trước: I = 0,2 kg·m², γ = 25,13/20 ≈ 1,257 rad/s².","M = Iγ ≈ 0,25 N·m."]],[3,"3.36","Bánh mài hình đĩa đồng chất, khối lượng m = 500g, bán kính R = 20cm đang quay với vận tốc 480 vòng/phút thì bị hãm đều lại. Tính mômen của lực hãm để bánh mài quay thêm 100 vòng nữa thì dừng hẳn.",["1Nm","0,1Nm","10Nm","0,02Nm"],3,["I = ½mR² = 0,01 kg·m²; ω₀ = 480 · 2π/60 ≈ 50,27 rad/s; φ = 100 · 2π ≈ 628,3 rad.","ω₀² = 2γφ nên γ ≈ 2,01 rad/s².","M = Iγ ≈ 0,02 N·m."]],[3,"3.37","Một quả cầu rỗng, thành mỏng, đường kính 1m, chịu tác dụng bởi mômen quay 960Nm và nó quay với gia tốc góc 6 rad/s<sup>2</sup>, quanh một trục đi qua tâm quả cầu. Khối lượng quả cầu là:",["160 kg","200 kg","240 kg","960 kg."],3,["Vỏ cầu mỏng: I = (2/3)mR², R = 0,5 m.","I = M/γ = 960/6 = 160 kg·m² nên m = 160/((2/3) · 0,25) = 960 kg."]],[3,"3.38","Một quả cầu đặc, thành mỏng, bán kính R = 1m, chịu tác dụng bởi mômen quay 960Nm và nó quay với gia tốc góc 6 rad/s<sup>2</sup>, quanh một trục đi qua tâm quả cầu. Tính khối lượng quả cầu.",["160 kg","400 kg","240 kg","400kg."],2,["Cầu thành mỏng: I = (2/3)mR², R = 1 m.","I = M/γ = 160 kg·m² nên m = 160/(2/3) = 240 kg."]],[3,"3.39","Bánh xe đạp được coi như một vành tròn có bán kính 40 cm, nặng 2 kg, đang quay với tốc độ 60 vòng/phút. Lấy π = 3,14. Mômen động lượng của bánh xe đối với trục bánh xe là:",["80 kgm<sup>2</sup>/s","0,32 kgm<sup>2</sup>/s","2 kgm<sup>2</sup>/s","1 kgm<sup>2</sup>/s"],2,["I = mR² = 2 · 0,16 = 0,32; ω = 2π rad/s (60 vòng/phút).","L = Iω ≈ 0,32 · 6,28 ≈ 2 kg·m²/s."]],[3,"3.40","Một bánh đà đồng chất, khối lượng phân bố đều, có đường kính 1 m, nặng 250 kg, đang quay với tốc độ 240 vòng/phút. Mômen động lượng của bánh đà đối với trục quay đi qua tâm và vuông góc với bánh đà là:",["500 kgm<sup>2</sup>/s","6.10<sup>4</sup> kgm<sup>2</sup>/s","750π kgm<sup>2</sup>/s","250π kgm<sup>2</sup>/s"],3,["I = ½mR² = 31,25 kg·m²; ω = 240 · 2π/60 = 8π rad/s.","L = Iω = 250π kg·m²/s."]],[3,"3.41","Một vật có khối lượng 2 kg chuyển động về phía trước với tốc độ 4 m/s va chạm vào vật thứ hai đứng yên. Sau va chạm, vật thứ nhất chuyển động ngược chiều với tốc độ 1 m/s còn vật thứ hai chuyển động với tốc độ 2 m/s. Vật thứ hai có khối lượng bao nhiêu?",["0,5 kg.","4,5 kg.","6 kg.","5 kg."],3,["Bảo toàn động lượng (chọn chiều dương là chiều ban đầu): 2 · 4 = 2 · (−1) + m₂ · 2.","m₂ = 5 kg."]],[3,"3.42","Hai vật A và B va chạm mềm với nhau trên mặt phẳng nằm ngang không ma sát. Vật A có khối lượng 1 kg và tốc độ 20 m/s. Vật B có khối lượng 4 kg và chuyển động ngược chiều với tốc độ 5 m/s. Tính tốc độ sau va chạm của hai vật?",["0","4 m/s","1 m/s","8 m/s."],0,["Chọn chiều dương theo vật A: p = 1 · 20 − 4 · 5 = 0.","Va chạm mềm: hệ có động lượng 0 nên sau va chạm tốc độ bằng 0."]],[3,"3.43","Một khẩu súng có khối lượng <em>M</em> = 400 kg được đặt trên mặt đất nằm ngang, bắn ra một viên đạn có khối lượng <em>m</em> = 400 g theo phương nằm ngang với vận tốc có độ lớn 500 m/s. Vận tốc giật lại của súng là:",["– 5 m/s","0","– 50 cm/s","– 50 m/s."],2,["Bảo toàn động lượng theo phương ngang: M V + m v = 0.","V = −0,4 · 500/400 = −0,5 m/s = −50 cm/s."]],[3,"3.44","Khẩu pháo có khối lượng M = 450 kg, nhả đạn theo phương hợp với phương ngang góc 60<sup>o</sup>. Đạn có khối lượng m = 10kg, rời nòng với vận tốc v = 450 m/s. Khi bắn, pháo bị giật lùi về phía sau với tốc độ bao nhiêu? (Coi nền đất tuyệt đối cứng).",["10 m/s","5m/s","7,5m/s","2,5m/s"],1,["Bảo toàn động lượng theo phương ngang: M V = m v cos60°.","V = 10 · 450 · 0,5/450 = 5 m/s."]],[3,"3.44","Khẩu pháo có khối lượng M = 450 kg, nhả đạn theo phương ngang. Đạn có khối lượng m = 5kg, rời nòng với vận tốc v = 450 m/s. Sau khi bắn, súng giật lùi một đoạn 45 cm. Tính lực cản trung bình của mặt đường tác dụng lên khẩu pháo.",["50000 N","10000 N","12000 N","12500 N"],3,["Tốc độ giật: V = mv/M = 5 · 450/450 = 5 m/s.","Giật lùi s = 0,45 m với lực cản không đổi: a = V²/(2s) ≈ 27,8 m/s².","F = Ma = 450 · 27,8 ≈ 12 500 N."]],[3,"3.46","Hai vật có khối lượng <em>m</em><sub>1</sub> = 3 kg và <em>m</em><sub>2</sub> = 2 kg đang chuyển động ngược chiều với vận tốc có độ lớn lần lượt là 4 m/s và 5 m/s trên một mặt phẳng nằm ngang không ma sát thì va chạm trực diện đàn hồi. Sau va chạm, vật 1 bị bật trở lại với tốc độ 2 m/s. Tốc độ sau va chạm của vật 2 là :",["1 m/s","2 m/s","3 m/s","4 m/s"],3,["Bảo toàn động lượng: 3 · 4 − 2 · 5 = −3 · 2 + 2v₂.","2 = −6 + 2v₂ nên v₂ = 4 m/s."]],[3,"3.47","Một đầu máy xe lửa có khối lượng 100 tấn chuyển động thẳng đều theo phương ngang với vận tốc có độ lớn <em>v</em><sub>1</sub>=1,5 m/s để ghép vào một đoàn tàu gồm 10 toa, mỗi toa 20 tấn đang đứng yên trên đường ray. Giả sử sau va chạm đầu tàu được gắn vào các toa, bỏ qua ma sát. Sau va chạm, vận tốc của đoàn tàu bằng bao nhiêu?",["0,2 m/s","0,75 m/s","1 m/s","0,5 m/s."],3,["Bảo toàn động lượng: 100 · 1,5 = (100 + 200)v.","v = 150/300 = 0,5 m/s."]],[3,"3.48","Một dây mảnh, nhẹ, không co giãn, quấn quanh một trụ đặc đồng chất khối lượng m<sub>0</sub> = 2kg. Đầu kia của dây nối với vật m = 1kg (hình). Bỏ qua ma sát ở trục quay, lấy g = 10m/s<sup>2</sup>. Tính gia tốc của vật.<br><img data-i=\"image25\" class=\"fg\" style=\"width:0.97083in;height:1.38403in\">",["a = 3,3m/s<sup>2</sup>","a = 5m/s<sup>2</sup>","a = 6,6 m/s<sup>2</sup>","a = 0 (vật đứng yên)"],1,["Trụ đặc: I = ½m₀R². Vật m: mg − T = ma; trụ: TR = Iγ, a = γR.","a = mg/(m + m₀/2) = 10/(1 + 1) = 5 m/s²."]],[3,"3.49","Một dây mảnh, nhẹ, không co giãn, quấn quanh một trụ đặc đồng chất khối lượng m<sub>0</sub> = 2kg. Đầu kia của dây nối với vật m = 1kg. Bỏ qua ma sát ở trục quay, lấy g = 10m/s<sup>2</sup>. Tính lực căng dây nối vật m.<br><img data-i=\"image26\" class=\"fg\" style=\"width:0.95625in;height:1.3625in\">",["10 N","5 N","7,7 N","6,6 N"],1,["T = m(g − a) = 1 · (10 − 5) = 5 N."]],[3,"3.50","Một dây mảnh, nhẹ, không co giãn, quấn quanh một trụ rỗng đồng chất khối lượng m<sub>1</sub> = 2kg. Đầu kia của dây nối với vật m<sub>2</sub> = 3 kg (hình vẽ). Bỏ qua ma sát ở trục quay, lấy g = 10m/s<sup>2</sup>. Tính gia tốc của vật.<br><img data-i=\"image27\" class=\"fg\" style=\"width:1.62292in;height:1.30417in\">",["a = 7,5 m/s<sup>2</sup>","a = 6 m/s<sup>2</sup>","a = 5 m/s<sup>2</sup>","a = 0 (vật đứng yên)"],1,["Trụ rỗng: I = m₁R², a = m₂g/(m₂ + m₁) = 30/5 = 6 m/s²."]],[3,"3.51","Một dây mảnh, nhẹ, không co giãn, quấn quanh một trụ rỗng đồng chất khối lượng m<sub>1</sub> = 2 kg. Đầu kia của dây nối với vật m<sub>2</sub> = 3kg (hình). Bỏ qua ma sát ở trục quay, lấy g = 10m/s<sup>2</sup>. Tính lực căng dây treo vật m<sub>2</sub>.<br><img data-i=\"image27\" class=\"fg\" style=\"width:1.62292in;height:1.30417in\">",["T = 6 N","T = 12 N","T = 18 N","T = 10 N"],1,["T = m₂(g − a) = 3 · (10 − 6) = 12 N."]],[3,"3.52","Trên một hình trụ rỗng, thành mỏng, khối lượng m = 4kg, có quấn một sợi dây rất nhẹ, không co giãn. Đầu ra của sợi dây buộc chặt vào điểm cố định. Thả nhẹ cho hình trụ lăn xuống dưới. Tính gia tốc tịnh tiến của hình trụ, bỏ qua lực cản không khí, lấy g = 10m/s<sup>2</sup>.<br><img data-i=\"image28\" class=\"fg\" style=\"width:1.05069in;height:1.47847in\">",["a = 10 m/s<sup>2</sup>","a = 5 m/s<sup>2</sup>","a = 4 m/s<sup>2</sup>","a = 6,6 m/s<sup>2</sup>"],1,["Hình trụ rỗng thành mỏng (I = mR²) lăn xuống như con quay: ma = mg − T và TR = mR² · (a/R).","a = g/2 = 5 m/s²."]],[3,"3.53","Trên một hình trụ rỗng, thành mỏng, khối lượng m = 4kg, có quấn một sợi dây rất nhẹ, không co giãn. Đầu ra của sợi dây buộc chặt vào điểm cố định. Thả nhẹ cho hình trụ lăn xuống dưới. Tính lực căng dây, bỏ qua lực cản không khí, lấy g = 10m/s<sup>2</sup>.<br><img data-i=\"image28\" class=\"fg\" style=\"width:1.05069in;height:1.47847in\">",["T = 20 N","T = 40 N","T = 33 N","T = 0 N"],0,["T = ma = 4 · 5 = 20 N (hoặc T = mg − ma = 20 N)."]],[3,"3.54","Trên một hình trụ đặc, khối lượng m = 4kg, có quấn một sợi dây rất nhẹ, không co giãn. Đầu ra của sợi dây buộc chặt vào điểm cố định. Thả nhẹ cho hình trụ lăn xuống dưới. Tính gia tốc tịnh tiến của hình trụ, bỏ qua lực cản không khí, lấy g = 10m/s<sup>2</sup>.",["a = 10 m/s<sup>2</sup>","a = 6,67 m/s<sup>2</sup>","a = 5 m/s<sup>2</sup>","a = 4 m/s<sup>2</sup>"],1,["Trụ đặc (I = ½mR²): a = g/(1 + I/(mR²)) = g/(1 + ½) = 2g/3 ≈ 6,67 m/s²."]],[3,"3.55","Trên một hình trụ đặc, thành mỏng, khối lượng m = 4kg, có quấn một sợi dây rất nhẹ, không co giãn. Đầu ra của sợi dây buộc chặt vào điểm cố định. Thả nhẹ cho hình trụ lăn xuống dưới. Tính lực căng dây, bỏ qua lực cản không khí, lấy g = 10m/s<sup>2</sup>.",["T = 13,3 N","T = 40 N","T = 26,7 N","T = 20 N"],0,["Với trụ đặc: T = mg/3 = 4 · 10/3 ≈ 13,3 N."]],[3,"3.56","Một sợi dây nhẹ, không co giãn, vắt qua ròng rọc có dạng đĩa tròn đồng chất, khối lượng M = 800g, hai đầu dây buộc chặt hai vật nhỏ khối lượng m<sub>1</sub> = 2,6kg và m<sub>2</sub> = 1kg (hình vẽ). Thả cho hai vật chuyển động theo phương thẳng đứng. Bỏ qua ma sát ở trục ròng rọc, biết dây không trượt trên ròng rọc, lấy g = 10 m/s<sup>2</sup>. Xác định gia tốc của các vật?<br><img data-i=\"image29\" class=\"fg\" style=\"width:0.73194in;height:1.31875in\">",["4 m/s<sup>2</sup>","4,4 m/s<sup>2</sup>","3,8 m/s<sup>2</sup>","2,2 m/s<sup>2</sup>"],0,["a = (m₁ − m₂)g/(m₁ + m₂ + M/2) = 1,6 · 10/(3,6 + 0,4) = 4 m/s²."]],[3,"3.57","Một sợi dây nhẹ, không co giãn, vắt qua ròng rọc có dạng đĩa tròn đồng chất, khối lượng m = 800g (hình vẽ), hai đầu dây buộc chặt hai vật nhỏ khối lượng m<sub>1</sub> = 2,6 kg và m<sub>2</sub> = 1 kg. Thả cho hai vật chuyển động theo phương thẳng đứng, biết dây không trượt trên ròng rọc. Bỏ qua ma sát ở trục ròng rọc, lấy g = 10 m/s<sup>2</sup>. Tính lực căng dây treo vật m<sub>1</sub>?<br><img data-i=\"image29\" class=\"fg\" style=\"width:0.93472in;height:1.67361in\">",["T<sub>1</sub> = 15,6 N","T<sub>1</sub> = 14 N","T<sub>1</sub> = 6 N","T<sub>1</sub> = 16,5 N"],0,["T₁ = m₁(g − a) = 2,6 · (10 − 4) = 15,6 N."]],[3,"3.58","Một sợi dây nhẹ, không co giãn, vắt qua ròng rọc có dạng đĩa tròn đồng chất, khối lượng m = 800g, hai đầu dây buộc chặt hai vật nhỏ khối lượng m<sub>1</sub> = 2,6 kg và m<sub>2</sub> = 1 kg (hình vẽ). Thả cho hai vật chuyển động theo phương thẳng đứng, biết dây không trượt trên ròng rọc. Bỏ qua ma sát ở trục ròng rọc, lấy g = 10 m/s<sup>2</sup>. Lực căng dây treo vật m<sub>2</sub> là:<br><img data-i=\"image29\" class=\"fg\" style=\"width:0.93472in;height:1.67361in\">",["T<sub>2</sub> = 15,6 N","T<sub>2</sub> = 14 N","T<sub>2</sub> = 6 N","T<sub>2</sub> = 16,5 N"],1,["T₂
