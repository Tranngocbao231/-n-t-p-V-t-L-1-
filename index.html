 = m₂(g + a) = 1 · (10 + 4) = 14 N."]],[3,"3.59","Một sợi dây nhẹ, không co giãn, vắt qua ròng rọc có dạng đĩa tròn đồng chất, khối lượng m = 600g (hình vẽ), hai đầu dây buộc chặt hai vật nhỏ khối lượng m<sub>1</sub> = 2,5 kg và m<sub>2</sub> = 1 kg. Thả cho hai vật chuyển động theo phương thẳng đứng, biết dây không trượt trên ròng rọc. Bỏ qua ma sát ở trục ròng rọc, lấy g = 10 m/s<sup>2</sup>. Độ lệch lực căng giữa hai bên ròng rọc là?<br><img data-i=\"image29\" class=\"fg\" style=\"width:0.78264in;height:1.42014in\">",["1,62 N","1,18 N","2,4 N","0,8 N"],1,["a = (m₁ − m₂)g/(m₁ + m₂ + M/2) = 15/3,8 ≈ 3,95 m/s².","T₁ = 2,5 · (10 − 3,95) ≈ 15,13 N; T₂ = 1 · (10 + 3,95) ≈ 13,95 N.","Độ lệch T₁ − T₂ ≈ 1,18 N."]],[3,"3.60","Một hình trụ đặc, đồng chất, bán kính R lăn không trượt trên mặt đường nằm ngang dưới tác dụng của một lực F nằm ngang như trên hình vẽ. Gia tốc khối tâm của hình trụ là:<br><img data-i=\"image30\" class=\"fg\" style=\"width:1.84028in;height:1.28958in\">",["<img data-i=\"image31\" class=\"fg\" style=\"\">","<img data-i=\"image32\" class=\"fg\" style=\"\">","<img data-i=\"image33\" class=\"fg\" style=\"\">","<img data-i=\"image34\" class=\"fg\" style=\"\">"],0,["Lăn không trượt, lực F ở đỉnh, ma sát f ở điểm tiếp xúc: ma = F + f và (F − f)R = Iα = ½mR² · a/R.","Suy ra F − f = ½ma; cộng hai phương trình được a = 4F/(3m)."]],[3,"3.61","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 3kg; m<sub>2</sub> = 2kg; α = 30<sup>o</sup>. Ròng rọc là một đĩa tròn có khối lượng m = 1kg. Bỏ qua ma sát giữa m<sub>1</sub> và mặt sàn. Biết dây không giãn, khối lượng không đáng kể và không trượt trên rãnh ròng rọc. Lấy g = 10 m/s<sup>2</sup>. Xác định gia tốc và chiều chuyển động của m<sub>2.</sub><br><img data-i=\"image17\" class=\"fg\" style=\"width:2.5in;height:1.15972in\">",["m<sub>2</sub> đi lên; a = 0,9 m/s<sup>2</sup>","m<sub>2</sub> đi xuống; a = 0,9m/s<sup>2</sup>","m<sub>2</sub> đi lên; a = 1m/s<sup>2</sup>","m<sub>2</sub> đi xuống; a = 1m/s<sup>2</sup>"],1,["Mặt nghiêng không ma sát: m₂g − m₁g sin30° = 20 − 15 = 5 N.","Tổng khối lượng hiệu dụng: m₁ + m₂ + m/2 = 5,5 kg.","a = 5/5,5 ≈ 0,9 m/s², m₂ đi xuống."]],[3,"3.62","Cho cơ hệ như hình vẽ. Biết m<sub>1</sub> = 3kg; m<sub>2</sub> = 2kg; α = 30<sup>o</sup>. Ròng rọc là một đĩa tròn có khối lượng m = 1kg. Bỏ qua ma sát giữa m<sub>1</sub> và mặt sàn. Biết dây không giãn, khối lượng không đáng kể và không trượt trên rãnh ròng rọc. Lấy g = 10 m/s<sup>2</sup>. Lực căng dây treo m<sub>2</sub> là:<br><img data-i=\"image17\" class=\"fg\" style=\"width:2.5in;height:1.15972in\">",["13,6 N","18,2 N","15 N","20 N"],1,["T₂ = m₂(g − a) = 2 · (10 − 0,909) ≈ 18,2 N."]],[3,"3.63","Một chiếc bàn xoay đang quay đều với tốc độ góc 5 vòng/phút. Người phục vụ đặt nhẹ nhàng một đĩa đồ ăn lên một điểm cách tâm bàn 40 cm. Biết khối lượng đĩa đồ ăn là 1 kg và momen quán tính của bàn đối với trục quay qua tâm là 1,2 Nm<sup>2</sup>. Tốc độ góc của bàn ngay sau khi người phục vụ đặt đĩa đồ ăn lên mặt bàn là:",["4,41 vòng/phút","5 vòng/phút","37,5 vòng/phút","3,75 vòng/phút"],0,["Hệ bàn + đĩa không có ngoại mômen nên L bảo toàn: Iω₀ = (I + mr²)ω.","mr² = 1 · 0,4² = 0,16; ω = 5 · 1,2/1,36 ≈ 4,41 vòng/phút."]],[4,"4.1","Trong va chạm giữa hai quả cầu (coi hệ là kín), đại lượng nào của hệ được bảo toàn?",["Động năng","Động lượng","Cơ năng","Vận tốc"],1,["Hệ kín (không ngoại lực) thì tổng động lượng được bảo toàn trong mọi va chạm.","Động năng chỉ bảo toàn trong va chạm đàn hồi."]],[4,"4.2","Chọn câu trả lời đúng: Động năng của quả cầu đặc chuyển động quay",["Tỷ lệ nghịch với momen quán tính","Tỷ lệ thuận với bình phương khối lượng","Tỷ lệ thuận với bình phương vận tốc góc","Tỷ lệ nghịch với bán kính"],2,["Động năng quay W = ½Iω², tỉ lệ thuận với bình phương vận tốc góc."]],[4,"4.3","Chọn câu trả lời đúng: Một vật được thả rơi tự do, trong quá trình rơi:",["Động năng của vật không thay đổi.","Thế năng của vật không thay đổi","Tổng động năng và thế năng của vật không thay đổi.","Tổng động năng và thế năng của vật thay đổi."],2,["Rơi tự do chỉ chịu trọng lực (lực thế) nên cơ năng, tức tổng động năng và thế năng, không đổi.","Động năng tăng, thế năng giảm."]],[4,"4.4","Chọn câu trả lời đúng: Khi vật chịu tác dụng của lực thế:",["Cơ năng của vật được bảo toàn.","Thế năng của vật được bảo toàn.","Động năng của vật được bảo toàn.","Công được bảo toàn."],0,["Chỉ có lực thế tác dụng thì cơ năng của vật được bảo toàn."]],[4,"4.5","Chọn câu trả lời đúng: Công của trọng lực",["Không phụ thuộc vào quỹ đạo chuyển động.","Phụ thuộc vào quỹ đạo chuyển động.","Không phụ thuộc vào vị trí đầu của quỹ đạo chuyển động.","Không phụ thuộc vào vị trí cuối của quỹ đạo chuyển động."],0,["Trọng lực là lực thế: công của nó chỉ phụ thuộc vị trí đầu và cuối, không phụ thuộc quỹ đạo."]],[4,"4.6","Xét một vật chuyển động thẳng biến đổi đều theo phương nằm ngang. Đại lượng nào sau đây không đổi?",["Động năng.","Động lượng.","Thế năng.","Vận tốc."],2,["Chuyển động ngang: độ cao không đổi nên thế năng trọng trường không đổi.","Vận tốc, động lượng, động năng đều biến đổi."]],[4,"4.7","Phát biểu nào sau đây <strong>sai?</strong> Thế năng hấp dẫn và thế năng đàn hồi",["cùng là một dạng năng lượng.","có dạng biểu thức khác nhau.","đều phụ thuộc vào điểm đầu và điểm cuối.","đều là đại lượng vô hướng, có thể dương, âm hoặc bằng không."],2,["Thế năng chỉ phụ thuộc vị trí của vật (và mốc chọn), nên \"phụ thuộc điểm đầu và điểm cuối\" là tính chất của công, không phải của thế năng.","Vậy C sai."]],[4,"4.8","Phát biểu nào sau đây là <strong>sai</strong> khi nói về thế năng trọng trường?",["Luôn có giá trị dương.","Tỉ lệ với khối lượng của vật.","Hơn kém nhau một hằng số khác nhau đối với 2 mốc thế năng khác nhau.","Có giá trị tuỳ thuộc vào mặt phẳng chọn làm mốc thế năng."],0,["Thế năng trọng trường phụ thuộc mốc chọn nên có thể dương, âm hoặc bằng 0.","Vậy \"luôn dương\" là sai."]],[4,"4.9","Trong quá trình rơi tự do, đại lượng nào sau đây của vật không đổi:",["Động năng","Thế năng","Động lượng","Cơ năng"],3,["Rơi tự do chỉ chịu trọng lực nên cơ năng không đổi."]],[4,"4.10","Chọn câu trả lời đúng: Khi vật chịu tác dụng của lực không phải là lực thế:",["Cơ năng của vật được bảo toàn.","Động năng của vật được bảo toàn.","Thế năng của vật được bảo toàn.","Năng lượng toàn phần của vật được bảo toàn."],3,["Khi có lực không phải lực thế (như ma sát), cơ năng thay đổi nhưng năng lượng toàn phần vẫn bảo toàn."]],[4,"4.11","Chọn câu trả lời đúng: Khi một vật chuyển động dưới tác dụng của lực thì",["Động lượng là đại lượng đặc trưng cho chuyển động về mặt động học.","Động lượng là đại lượng đặc trưng cho chuyển động về mặt động lực học.","Xung lượng của lực là đại lượng đặc trưng cho tác dụng của lực.","vận tốc là đại lượng đặc trưng cho chuyển động của vật về mặt động lực học."],1,["Động lượng p = mv là đại lượng đặc trưng cho chuyển động về mặt động lực học."]],[4,"4.12","Phát biểu nào sau đây là <em><strong>đúng</strong></em>? Đối với chất điểm, độ biến thiên thế năng bằng về độ lớn nhưng trái dấu với.",["độ biến thiên năng lượng toàn phần.","độ biến thiên cơ năng.","công toàn phần.","công thực hiện bởi các lực thế."],3,["Công của lực thế: A = −ΔWt.","Độ biến thiên thế năng bằng về độ lớn và trái dấu với công của các lực thế."]],[4,"4.14","Trong va chạm đàn hồi, xuyên tâm giữa hai quả cầu giống hệt nhau về kích thước và khối lượng, nếu lúc đầu có một quả cầu đứng yên thì ngay sau va chạm:",["sẽ có một quả cầu đứng yên.","hai quả cầu chuyển động ngược chiều.","hai quả cầu chuyển động cùng chiều.","hai quả cầu chuyển động theo hai hướng vuông góc nhau."],0,["Va chạm đàn hồi xuyên tâm giữa hai quả cầu giống hệt, một quả đứng yên: hai quả cầu trao đổi vận tốc.","Quả cầu tới dừng lại, quả cầu kia chuyển động."]],[4,"4.15","Trong va chạm đàn hồi, không xuyên tâm giữa hai quả cầu giống hệt nhau về kích thước và khối lượng, nếu lúc đầu có một quả cầu đứng yên thì ngay sau va chạm:",["sẽ có một quả cầu đứng yên.","hai quả cầu chuyển động ngược chiều.","hai quả cầu chuyển động cùng chiều.","hai quả cầu chuyển động theo hai hướng khác nhau."],3,["Va chạm đàn hồi không xuyên tâm giữa hai quả giống hệt: hai quả cầu chuyển động theo hai hướng vuông góc nhau (khác nhau)."]],[4,"4.16","Chọn câu trả lời đúng: Một vật rắn quay xung quanh một trục cố định thì đạo hàm theo thời gian của mômen động lượng bằng",["Hợp lực tác dụng lên vật.","Động năng của vật.","Mô men của các lực tác dụng lên vật.","Mô men quán tính của vật."],2,["Phương trình chuyển động quay: dL/dt = M.","Đạo hàm của mômen động lượng bằng mômen của các lực tác dụng."]],[4,"4.17","Chọn phát biểu <strong>sai?</strong> Khi một vật từ độ cao z, với cùng vận tốc đầu, bay xuống đất theo những con đường khác nhau thì",["độ lớn vận tốc chạm đất bằng nhau.","thời gian rơi bằng nhau.","công của trọng lực bằng nhau.","gia tốc rơi bằng nhau."],1,["Cùng độ cao và vận tốc đầu thì độ lớn vận tốc chạm đất, công của trọng lực và gia tốc như nhau.","Thời gian rơi thì phụ thuộc đường đi nên không bằng nhau."]],[4,"4.18","Một người mang một kiện hàng từ tầng một lên tầng ba theo hai cầu thang có hình dạng và chiều dài khác nhau nhưng cùng độ chênh cao. Công của trọng lực tác dụng lên kiện hàng:",["lớn hơn khi đi theo cầu thang dài hơn.","nhỏ hơn khi đi theo cầu thang dài hơn.","bằng nhau trong hai trường hợp.","phụ thuộc vào thời gian người đó di chuyển."],2,["Trọng lực là lực thế, công chỉ phụ thuộc độ chênh cao.","Hai cầu thang cùng độ chênh cao nên công bằng nhau."]],[4,"4.19","Một quả cầu khối lượng 16 kg đang lăn không trượt với vận tốc tịnh tiến của khối tâm là v = 9km/h. Động lượng của quả cầu là:",["144 kgm/s","40 kgm/s","50 kgm/s","100 kgm/s"],1,["v = 9 km/h = 2,5 m/s.","p = mv = 16 · 2,5 = 40 kg·m/s."]],[4,"4.20","Động năng của một vật nhỏ có khối lượng 2 kg, chuyển động với vận tốc v = 4 m/s là bao nhiêu?",["32 J","4 J","8 J","16 J"],3,["W = ½mv² = ½ · 2 · 16 = 16 J."]],[4,"4.21","Động năng của một vật nhỏ có khối lượng 16 kg, chuyển động với vận tốc v = 9km/h là:",["648 J","50 J","72 J","100 J"],1,["v = 2,5 m/s: W = ½ · 16 · 2,5² = 50 J."]],[4,"4.22","Vật rắn khối lượng 20kg, tịnh tiến với vận tốc 36km/h thì động năng là bao nhiêu?",["12960 J","720 J","1000 J","200 J"],2,["v = 10 m/s: W = ½mv² = ½ · 20 · 100 = 1000 J."]],[4,"4.23","Quả cầu đặc, đồng chất, khối lượng 20kg, lăn không trượt trên mặt đường, vận tốc của khối tâm là v = 10m/s. Động năng của quả cầu là:",["1 kJ","400 J","600 J","1400J"],3,["Cầu đặc lăn không trượt: W = (7/10)mv² = 0,7 · 20 · 100 = 1400 J."]],[4,"4.24","Một cái đĩa đồng chất, khối lượng 4 kg, đang lăn không trượt với vận tốc 2 m/s. Động năng của đĩa là:",["6 J","12 J","16 J","8 J"],1,["Đĩa lăn không trượt: W = (3/4)mv² = 0,75 · 4 · 4 = 12 J."]],[4,"4.25","Một cái đĩa đồng chất, khối lượng 4 kg, đang lăn không trượt trên mặt ngang. Động năng của đĩa là 12J. Vận tốc tịnh tiến của khối tâm đĩa là:",["2,45 m/s","2 m/s","1,73 m/s","8 m/s"],1,["W = (3/4)mv² nên v² = 12/(0,75 · 4) = 4.","v = 2 m/s."]],[4,"4.26","Một cái đĩa tròn đồng chất đang lăn không trượt thì động năng quay chiếm bao nhiêu phần trăm động năng toàn phần của đĩa?",["25%","33%","55%","75%"],1,["Đĩa lăn: W_tt = ½mv², W_quay = ¼mv², W = ¾mv².","Phần quay = (¼)/(¾) = 1/3 ≈ 33%."]],[4,"4.27","Một cái đĩa tròn đồng chất đang lăn không trượt thì động năng tịnh tiến chiếm bao nhiêu phần trăm động năng toàn phần của đĩa?",["47%","50%","67%","77%"],2,["Phần tịnh tiến = (½)/(¾) = 2/3 ≈ 67%."]],[4,"4.28","Một cái vòng sắt, khối lượng 10 kg, đang lăn không trượt trên sàn ngang. Vận tốc của khối tâm là 2 m/s. Cần phải tốn một công bao nhiêu để làm cho nó dừng lại:",["10 J","20 J","30 J","40 J"],3,["Vòng lăn không trượt: W = mv² = 10 · 4 = 40 J.","Công cần để làm vật dừng bằng động năng, tức 40 J."]],[4,"4.29","Một cái vòng sắt, khối lượng 2 kg, đang lăn không trượt trên sàn ngang. Để làm cho nó dừng lại, cần phải tốn một công là 40 J. Vận tốc tịnh tiến của khối tâm vòng là:",["2,45 m/s","4,47 m/s","1,73 m/s","6,32 m/s"],1,["W = mv² nên v² = 40/2 = 20.","v ≈ 4,47 m/s."]],[4,"4.30","Một cái ống hình trụ rỗng, thành mỏng đang lăn không trượt thì động năng tịnh tiến chiếm bao nhiêu phần trăm động năng toàn phần của nó?",["77%","25%","50%","67%"],2,["Trụ rỗng thành mỏng: W_tt = ½mv², W_quay = ½mv² (vì I = mR²).","Tịnh tiến chiếm 50%."]],[4,"4.31","Một bánh xe khối lượng 10 kg phân bố chủ yếu ở vành bánh xe, bán kính 50cm. Bánh xe quay quanh trục của nó với vận tốc 180 vòng/phút. Để hãm bánh xe dừng lại trong 10 giây, thì công suất trung bình của lực hãm là bao nhiêu? Lấy π<sup>2</sup> = 10.",["– 22 W","– 45 W","– 90 W","– 135 W"],1,["I = mR² = 10 · 0,25 = 2,5 kg·m²; ω = 180 · 2π/60 = 6π rad/s.","W = ½Iω² = ½ · 2,5 · 36π² = 450 J.","Công suất trung bình của lực hãm: P = −W/t = −450/10 = −45 W."]],[4,"4.32","Bánh đà có dạng hình trụ đặc đồng chất có khối lượng là 75 kg, bán kính 40 cm, quay với vận tốc 300 vòng/phút xung quanh trục quay đi qua khối tâm. Momen động lượng của bánh đà là:",["188,4 kgm<sup>2</sup>/s","376,8 kgm<sup>2</sup>/s","9000 kgm<sup>2</sup>/s","4500 kgm<sup>2</sup>/s"],0,["I = ½mR² = ½ · 75 · 0,16 = 6 kg·m²; ω = 300 · 2π/60 = 10π rad/s.","L = Iω = 6 · 31,4 ≈ 188,4 kg·m²/s."]],[4,"4.33","Bánh mài của máy mài hình đĩa, khối lượng 1kg, bán kính R = 20cm đang quay với vận tốc 480 vòng/phút thì bị hãm dừng lại bởi lực có mômen không đổi. Lấy π<sup>2</sup> = 10. Tính công của lực hãm.",["– 5,12 J","– 4,12 J","– 23,04 J","– 25,6 J"],3,["I = ½mR² = 0,02 kg·m²; ω = 16π rad/s.","Công hãm = −½Iω² = −½ · 0,02 · 256π² = −25,6 J (π² = 10)."]],[4,"4.34","Bánh đà có dạng hình trụ đặc đồng chất, dùng để dự trữ năng lượng cho động cơ đốt trong. Bánh đà có khối lượng là 50 kg, bán kính 40cm, quay với vận tốc 300 vòng/phút. Tính phần cơ năng dự trữ ở bánh đà. (π<sup>2</sup> = 10)",["2000 J","1000 J","500 J","4000 J"],0,["I = ½mR² = 4 kg·m²; ω = 10π rad/s.","W = ½Iω² = ½ · 4 · 100π² = 2000 J."]],[4,"4.35","Thanh đồng chất dài 60cm, khối lượng 4kg, quay đều với vận tốc 5vòng/s quanh trục cố định đi qua một đầu thanh và vuông góc với thanh. Động năng quay của thanh gần đúng với giá trị nào sau đây?",["120 J","480 J","60 J","240 J"],3,["I = (1/3)mL² = (1/3) · 4 · 0,36 = 0,48 kg·m²; ω = 5 · 2π = 10π rad/s.","W = ½Iω² = ½ · 0,48 · 986,96 ≈ 237 J ≈ 240 J."]],[4,"4.36","Một cái đĩa và một quả cầu đặc, đồng chất, bán kính khác nhau, nhưng cùng khối lượng m và cùng lăn không trượt trên đường với cùng vận tốc tịnh tiến v. Động năng E của vật nào lớn hơn?",["E<sub>đĩa</sub> = E<sub>qcầu</sub>","E<sub>đĩa</sub> &lt; E<sub>qcầu</sub>","E<sub>đĩa</sub> &gt; E<sub>qcầu</sub>","Chưa khẳng định được."],2,["Đĩa lăn: W = ¾mv²; cầu đặc: W = 0,7mv².","Vậy E_đĩa > E_cầu."]],[4,"4.37","Một cái vòng, một cái đĩa và một quả cầu đặc, đồng chất, bán kính khác nhau, nhưng cùng khối lượng m và cùng lăn không trượt trên đường với cùng vận tốc tịnh tiến v. Động năng E của vật nào lớn hơn?",["Evòng = Eđĩa = Eqcầu","Evòng &lt; Eđĩa &lt; Eqcầu","Evòng &gt; Eđĩa &gt; Eqcầu","Evòng &gt; Eqcầu &gt; Eđĩa"],2,["Vòng: W = mv²; đĩa: 0,75mv²; cầu đặc: 0,7mv².","Do đó E_vòng > E_đĩa > E_cầu."]],[4,"4.38","Một toa xe có khối lượng là 1 tấn (không kể bánh xe). Đang chuyển động với vận tốc 72 km/h. Toa xe có 6 bánh xe (coi như hình trụ đặc), khối lượng mỗi bánh là 20kg. Tính động năng toàn phần của toa xe.",["200 kJ","204 kJ","260 kJ","236 kJ"],3,["v = 20 m/s. Tịnh tiến toàn bộ (1000 + 6 · 20 = 1120 kg): ½ · 1120 · 400 = 224 000 J.","Quay: mỗi bánh ¼mv² = 2000 J, 6 bánh = 12 000 J.","Tổng = 236 kJ."]],[4,"4.39","Tính động năng toàn phần của một toa xe chuyển động với vận tốc 36 km/h. Toa xe gồm 4 bánh giống nhau, mỗi bánh có khối lượng 10kg coi như hình trụ đặc. Khối lượng của toa xe không kể 4 bánh xe là 1 tấn.",["53 kJ","50 kJ","52 kJ","51,5 kJ"],0,["v = 10 m/s. Tịnh tiến (1040 kg): ½ · 1040 · 100 = 52 000 J.","Quay: mỗi bánh ¼ · 10 · 100 = 250 J, 4 bánh = 1000 J.","Tổng = 53 kJ."]],[4,"4.40","Một viên bi khối lượng m đặt trên mặt bàn có độ cao h so với mặt đất. Gọi g là gia tốc trọng trường. Thế năng của viên bi so với mặt bàn là:",["mgh","½ mgh","0","- mgh"],2,["Chọn mặt bàn làm mốc thế năng thì thế năng của viên bi đang nằm trên bàn bằng 0."]],[4,"4.41","Thả vật nhỏ khối lượng m = 200g, trượt không ma sát theo máng nghiêng góc α = 30<sup>o</sup> so với phương ngang. Tính độ biến thiên động năng của vật khi nó trượt xuống được một đoạn s = 2 m. Lấy g = 10m/s<sup>2</sup>.",["200 J","0 J","2 J","4J"],2,["ΔW_đ = công của thành phần trọng lực dọc dốc = mg s sinα.","= 0,2 · 10 · 2 · 0,5 = 2 J."]],[4,"4.42","Một chất điểm khối lượng <em>m</em> rơi tự do từ độ cao <em>h</em> so với mặt đất, công của trọng lực thực hiện lên vật trong chuyển động này bằng bao nhiêu?",["<em>mgh</em>.","–<em>mgh</em>.","<em>mh</em>.","0."],0,["Rơi từ độ cao h: công của trọng lực A = mgh."]],[4,"4.43","Tính công của lực ma sát đã thực hiện, khi thả viên gạch có khối lượng m = 500g trượt đều xuống dốc dài 10m, nghiêng 30<sup>o</sup> so với phương ngang. Cho g = 10 m/s<sup>2</sup>",["– 50 J","– 43,3 J","– 25J","0 J"],2,["Trượt đều nên động năng không đổi: A_ms + A_P = 0.","Độ cao hạ h = 10 · sin30° = 5 m, A_P = mgh = 0,5 · 10 · 5 = 25 J.","Vậy A_ms = −25 J."]],[4,"4.44","Một thác nước cao 30m đổ xuống phía dưới 10<sup>4</sup>kg nước trong mỗi giây. Lấy g = 10m/s<sup>2</sup>, công suất thực hiện bởi thác nước bằng bao nhiêu?",["2000kW.","3000kW.","4000kW.","5000kW."],1,["Công mỗi giây: A = mgh = 10⁴ · 10 · 30 = 3 · 10⁶ J.","Công suất = 3 · 10⁶ W = 3000 kW."]],[4,"4.45","Trong công viên một xe trượt máng monorail có khối lượng m = 80kg chạy trên quỹ đạo như hình vẽ, biết z<sub>A</sub> = 20m; z<sub>B</sub> = 10m; z<sub>C</sub> = 15m; z<sub>D</sub> = 5m; z<sub>E</sub> = 18m; g = 9,8m/s<sup>2</sup>. Độ biến thiên thế năng trọng trường của xe khi xe di chuyển từ A đến B là bao nhiêu?<br><img data-i=\"image35\" class=\"fg\" style=\"width:1.68819in;height:1.12292in\">",["7840J.","8000J.","- 7840J.","-4000J."],2,["ΔWt = mg(z_B − z_A) = 80 · 9,8 · (10 − 20) = −7840 J."]],[4,"4.46","Trong công viên một xe trượt máng monorail có khối lượng m = 80kg chạy trên quỹ đạo như hình vẽ, biết z<sub>A</sub> = 20m; z<sub>B</sub> = 10m; z<sub>C</sub> = 15m; z<sub>D</sub> = 5m; z<sub>E</sub> = 18m; g = 9,8m/s<sup>2</sup>. Độ biến thiên thế năng trọng trường của xe khi xe di chuyển từ B đến C là:<br><img data-i=\"image35\" class=\"fg\" style=\"width:1.68819in;height:1.12292in\">",["-4000J.","- 3920J","3920J","-7840J"],2,["ΔWt = mg(z_C − z_B) = 80 · 9,8 · (15 − 10) = 3920 J."]],[4,"4.47","Trong công viên một xe trượt máng monorail có khối lượng m = 80kg chạy trên quỹ đạo như hình vẽ, biết z<sub>A</sub> = 20m; z<sub>B</sub> = 10m; z<sub>C</sub> = 15m; z<sub>D</sub> = 5m; z<sub>E</sub> = 18m; g = 9,8m/s<sup>2</sup>. Độ biến thiên thế năng trọng trường của xe khi xe di chuyển từ A đến E là:<br><img data-i=\"image35\" class=\"fg\" style=\"width:1.68819in;height:1.12292in\">",["- 1568J.","1586J.","- 3136J.","1760J"],0,["ΔWt = mg(z_E − z_A) = 80 · 9,8 · (18 − 20) = −1568 J."]],[4,"4.48","Một cần cẩu nâng một contenơ khối lượng 3000kg từ mặt đất lên độ cao 2m (tính theo sự di chuyển của trọng tâm contenơ), sau đó đổi hướng và hạ xuống sàn một ô tô tải ở độ cao cách mặt đất 1,2m. Lấy g = 9,8m/s<sup>2</sup>, chọn mốc thế năng ở mặt đất. Độ biến thiên thế năng khi nó hạ từ độ cao 2m xuống sàn ô tô là:",["48000J.","- 47000J","- 23520J","32530J"],2,["ΔWt = mg(1,2 − 2) = 3000 · 9,8 · (−0,8) = −23 520 J."]],[4,"4.49","Một buồng cáp treo chở người có khối lượng tổng cộng 800kg đi từ vị trí xuất phát cách mặt đất 10m tới một trạm dừng trên núi ở độ cao 550m sau đó lại tiếp tục tới một trạm khác ở độ cao 1300m. Công do trọng lực thực hiện khi buồng cáp treo di chuyển từ vị trí xuất phát tới trạm dừng thứ nhất là bao nhiêu? Cho g = 10 m/s<sup>2</sup>.",["- 432. 10<sup>4</sup>J","- 8,64. 10<sup>6</sup>J","6. 10<sup>6</sup>J","-6. 10<sup>6</sup>J"],0,["A_P = −mgΔh = −800 · 10 · (550 − 10) = −4,32 · 10⁶ J."]],[4,"4.50","Một buồng cáp treo chở người có khối lượng tổng cộng 800kg đi từ vị trí xuất phát cách mặt đất 10m tới một trạm dừng trên núi ở độ cao 550m sau đó lại tiếp tục tới một trạm khác ở độ cao 1300m. Công do trọng lực thực hiện khi buồng cáp treo di chuyển từ trạm dừng thứ nhất đến trạm dừng thứ hai là bao nhiêu? Cho g = 10 m/s<sup>2</sup>.",["4,64. 10<sup>6</sup>J","– 4,64. 10<sup>6</sup>J","- 6. 10<sup>6</sup>J","6. 10<sup>6</sup>J"],2,["A_P = −mgΔh = −800 · 10 · (1300 − 550) = −6 · 10⁶ J."]],[4,"4.51","Một vật có khối lượng m = 30kg di chuyển từ nơi có độ cao z<sub>A</sub> = 200m đến nơi có độ cao z<sub>B</sub> = 140m, cho g = 9,8m/s<sup>2</sup>. Độ giảm thế năng trọng trường của vật khi di chuyển từ A đến B",["24,82 KJ","17,64 KJ","15,3 KJ","30,6 KJ"],1,["Độ giảm thế năng = mg(z_A − z_B) = 30 · 9,8 · 60 = 17 640 J ≈ 17,64 kJ."]],[4,"4.52","Một tảng đá khối lượng 50 kg đang nằm trên sườn núi tại vị trí M có độ cao 300 m so với mặt đường thì bị lăn xuống đáy vực tại vị trí N có độ sâu 30 m. Lấy g = 10 m/s<sup>2</sup>. khi chọn gốc thế năng là mặt đường. Thế năng của tảng đá tại các vị trí M và N lần lượt là",["15 kJ ;-15 kJ.","150 kJ ; -15 kJ.","1500 kJ ; 15 kJ.","150 kJ ; -150 kJ."],1,["Mốc là mặt đường: Wt(M) = 50 · 10 · 300 = 150 kJ.","Wt(N) = 50 · 10 · (−30) = −15 kJ."]],[4,"4.53","Một tảng đá khối lượng 50 kg đang nằm trên sườn núi tại vị trí M có độ cao 300 m so với mặt đường thì bị lăn xuống đáy vực tại vị trí N có độ sâu 30 m. Lấy g = 10 m/s<sup>2</sup>. Khi chọn gốc thế năng là đáy vực. Thế năng của tảng đá tại các vị trí M và N lần lượt là:",["165 kJ ; 0 kJ.","150 kJ ; 0 kJ.","1500 kJ ; 15 kJ.","1650 kJ ; 0 kJ."],0,["Mốc là đáy vực: Wt(M) = 50 · 10 · 330 = 165 kJ, Wt(N) = 0."]],[4,"4.54","Cho cơ hệ như hình vẽ, dây nhẹ không dãn, ròng rọc nhẹ không ma sát, m<sub>1</sub> trượt không ma sát trên mặt phẳng ngang, m<sub>2</sub> có trọng lượng 80N. Khi thế năng của hệ thay đổi một lượng 64J thì m<sub>­1</sub> đã đi được một đoạn bằng bao nhiêu?<br><img data-i=\"image36\" class=\"fg\" style=\"width:1.65972in;height:1.54375in\">",["8m.","4m","0,8m","không tính được vì thiếu dữ kiện."],2,["Thế năng hệ giảm khi m₂ hạ xuống: |ΔWt| = m₂g · s = 80 · s.","s = 64/80 = 0,8 m."]],[4,"4.55","Một thanh mảnh OA đồng chất, khối lượng M , chiều dài L , có thể quay xung quanh trục quay đi qua đầu O. Chọn gốc thế năng ở O. Thế năng của thanh khi thanh ở vị trí thẳng đứng là:<br><img data-i=\"image37\" class=\"fg\" style=\"width:2.39861in;height:1.57986in\">",["<math><mrow><mo mathvariant=\"bold\">−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></math>MgL","MgL","<math><mfrac><mn>1</mn><mn>2</mn></mfrac></math>MgL","<math><mrow><mo>−</mo><mspace width=\"0.17em\"></mspace><mi>M</mi><mi>g</mi><mi>L</mi></mrow></math>"],0,["Chọn gốc ở O, thanh thẳng đứng treo xuống: khối tâm cách O một đoạn L/2 phía dưới.","Thế năng = −MgL/2."]],[4,"4.56","Một thanh mảnh OA đồng chất, khối lượng M , chiều dài L , có thể quay xung quanh trục quay đi qua đầu O. Chọn gốc thế năng ở A khi A ở điểm thấp nhất trong quá trình chuyển động. Thế năng của thanh khi thanh ở vị trí thẳng đứng là:<br><img data-i=\"image37\" class=\"fg\" style=\"width:2.39861in;height:1.57986in\">",["<math><mrow><mo mathvariant=\"bold\">−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></math>MgL","MgL","<math><mfrac><mn>1</mn><mn>2</mn></mfrac></math>MgL","<math><mrow><mo>−</mo><mspace width=\"0.17em\"></mspace><mi>M</mi><mi>g</mi><mi>L</mi></mrow></math>"],2,["Gốc ở A khi A thấp nhất; khối tâm thanh cao hơn A một đoạn L/2.","Thế năng = MgL/2."]],[4,"4.57","Từ mặt đất một vật được bắn lên với vận tốc ban đầu V<sub>0</sub>= 20m/s hợp với phương nằm ngang một góc 30<sup>0</sup>. Lấy g = 10m/s<sup>2</sup>. Hãy xác định vận tốc của vật tại thời điểm chạm đất.",["20 m/s","15 m/s","25 m/s","30 m/s"],0,["Bỏ qua sức cản, cơ năng bảo toàn, cùng độ cao (mặt đất) nên độ lớn vận tốc chạm đất bằng vận tốc ném: 20 m/s."]],[4,"4.58","Một máy bay bay theo phương ngang ở độ cao 10 km với vận tốc 720 km/h, thả một quả bom. Cho g =10 m/s<sup>2</sup>. Vận tốc quả bom khi tới mục tiêu tại mặt đất là:",["200 m/s","450 m/s","245 m/s","490 m/s"],3,["v₀ = 200 m/s, h = 10 000 m: v² = v₀² + 2gh = 40 000 + 200 000.","v = √240 000 ≈ 490 m/s."]],[4,"4.59","Một hình trụ rỗng khối lượng 1,5kg, bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, tâm hình trụ ở độ cao h = 4m so với mặt phẳng ngang ở chân dốc. Hãy tìm động năng của hình trụ khi nó lăn hết dốc. Lấy g = 10m/s<sup>2</sup>.",["60 J","52 J","40 J","15"],0,["Trụ rỗng lăn: cơ năng bảo toàn nên động năng cuối bằng mgh.","W = 1,5 · 10 · 4 = 60 J."]],[4,"4.60","Một hình trụ đặc, đồng chất bán kính R = 5 cm bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, hình trụ ở độ cao h = 4,85 m so với mặt phẳng ngang ở chân dốc. Hãy tìm vận tốc của khối tâm khi nó lăn hết dốc. Lấy g = 10 m/s<sup>2</sup>.",["4 m/s","6,32 m/s","8,04 m/s","9,8 m/s"],2,["Trụ đặc: mgh = ½mv² + ½ · ½mR² · (v/R)² = ¾mv².","v = √(4gh/3) = √(4 · 10 · 4,85/3) ≈ 8,04 m/s."]],[4,"4.61","Một hình trụ đặc, đồng chất bán kính R = 4 cm bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, tâm hình trụ ở độ cao h = 2,74m so với mặt phẳng ngang ở chân dốc. Hãy tìm vận tốc góc của hình trụ khi nó lăn hết dốc. Lấy g = 10m/s<sup>2</sup>.",["150 rad/s","6 rad/s","184 rad/s","50 rad/s"],0,["v = √(4gh/3) = √(4 · 10 · 2,74/3) ≈ 6,04 m/s.","ω = v/R = 6,04/0,04 ≈ 151 rad/s ≈ 150 rad/s."]],[4,"4.62","Một hình trụ rỗng, đồng chất bán kính R = 5 cm bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, hình trụ ở độ cao h = 4,85 m so với mặt phẳng ngang ở chân dốc. Hãy tìm vận tốc của khối tâm khi nó lăn hết dốc. Lấy g = 10 m/s<sup>2</sup>.",["4 m/s","6,96 m/s","8,94 m/s","9,8 m/s"],1,["Trụ rỗng: mgh = mv², nên v = √(gh) = √(10 · 4,85) ≈ 6,96 m/s."]],[4,"4.63","Một hình trụ rỗng, đồng chất bán kính R = 4 cm bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, tâm hình trụ ở độ cao h = 4,85 m so với mặt phẳng ngang ở chân dốc. Hãy tìm vận tốc góc của hình trụ khi nó lăn hết dốc. Lấy g = 10m/s<sup>2</sup>.",["174 rad/s","696 rad/s","184 rad/s","50 rad/s"],0,["v = 6,96 m/s; ω = v/R = 6,96/0,04 ≈ 174 rad/s."]],[4,"4.64","Một quả cầu rỗng, đồng chất bán kính R = 5 cm bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, quả cầu ở độ cao h = 4,85 m so với mặt phẳng ngang ở chân dốc. Hãy tìm vận tốc của khối tâm khi nó lăn hết dốc. Lấy g = 10 m/s<sup>2</sup>.",["9,8 m/s","6,96 m/s","8,32 m/s","7,62 m/s"],3,["Vỏ cầu rỗng: mgh = ½mv²(1 + 2/3) nên v = √(6gh/5) = √(58,2) ≈ 7,62 m/s."]],[4,"4.65","Một quả cầu rỗng, đồng chất bán kính R = 4 cm bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, tâm quả cầu ở độ cao h = 4,85 m so với mặt phẳng ngang ở chân dốc. Hãy tìm vận tốc góc của quả cầu khi nó lăn hết dốc. Lấy g = 10m/s<sup>2</sup>.",["174 rad/s","696 rad/s","184 rad/s","190 rad/s"],3,["ω = v/R = 7,62/0,04 ≈ 190 rad/s."]],[4,"4.66","Một quả cầu đặc, đồng chất bán kính R = 5 cm bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, quả cầu ở độ cao h = 4,85 m so với mặt phẳng ngang ở chân dốc. Hãy tìm vận tốc của khối tâm khi nó lăn hết dốc. Lấy g = 10 m/s<sup>2</sup>.",["7,62 m/s","6,32 m/s","8,32 m/s","9,8 m/s"],2,["Cầu đặc: mgh = ½mv²(1 + 2/5) nên v = √(10gh/7) = √(69,3) ≈ 8,32 m/s."]],[4,"4.67","Một quả cầu đặc, đồng chất bán kính R = 4 cm bắt đầu lăn không trượt trên mặt phẳng nghiêng xuống dốc. Lúc đầu, tâm quả cầu ở độ cao h = 4,85 m so với mặt phẳng ngang ở chân dốc. Hãy tìm vận tốc góc của quả cầu khi nó lăn hết dốc. Lấy g = 10m/s<sup>2</sup>.",["174 rad/s","696 rad/s","208 rad/s","190 rad/s"],2,["ω = v/R = 8,32/0,04 ≈ 208 rad/s."]],[4,"4.68","Tình huống thiết kế máng vận chuyển an toàn.  Một nhóm sinh viên cần thiết kế bề mặt cho một máng vận chuyển hàng dài <math><mrow><mn>10</mn><mspace width=\"0.17em\"></mspace><mi>m</mi></mrow></math>, nghiêng góc <math><msup><mn>30</mn><mo>∘</mo></msup></math> so với phương ngang. Một kiện hàng được đặt đứng yên ở đầu trên của máng rồi thả nhẹ. Yêu cầu thiết kế:\n<ul>\n<li>kiện hàng phải <strong>tự trượt xuống được</strong>;</li>\n<li>tốc độ khi tới cuối máng phải nằm trong khoảng từ <math><mrow><mn>4</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><mi>s</mi></mrow></math> đến <math><mrow><mn>6</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><mi>s</mi></mrow></math> để không gây hư hỏng;</li>\n<li>coi hệ số ma sát nghỉ và hệ số ma sát trượt giữa kiện hàng và mặt máng bằng nhau, tức là <math><mrow><msub><mi>μ</mi><mi>s</mi></msub><mo>=</mo><msub><mi>μ</mi><mi>k</mi></msub><mo>=</mo><mi>μ</mi></mrow></math>.</li>\n</ul>\nLấy <math><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>. Nhóm có thể lựa chọn loại bề mặt có hệ số ma sát nào phù hợp nhất trong bốn loại sau:",["<math><mrow><mi>μ</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>20</mn></mrow></math>","<math><mrow><mi>μ</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>30</mn></mrow></math>","<math><mrow><mi>μ</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>40</mn></mrow></math>","<math><mrow><mi>μ</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>60</mn></mrow></math>"],2,["Gia tốc khi trượt a = g(sin30° − μcos30°) = 10(0,5 − 0,866μ).","v² = 2aL = 20a nên v từ 4 đến 6 m/s cho a từ 0,8 đến 1,8 m/s².","Suy ra μ từ khoảng 0,37 đến 0,485, nên chọn μ = 0,40."]],[4,"4.69","Một quả cầu đặc được thả lăn không trượt từ đỉnh một mặt phẳng nghiêng có độ cao h, góc nghiêng α. Thời gian vật đến chân mặt phẳng nghiêng là:",["<math><msqrt><mfrac><mrow><mn>14</mn><mi>h</mi></mrow><mrow><mn>5</mn><mi>g</mi><msup><mo>sin</mo><mn>2</mn></msup><mi>α</mi></mrow></mfrac></msqrt></math>","<math><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mrow><mi>g</mi><msup><mo>sin</mo><mn>2</mn></msup></mrow></mfrac></msqrt></math>","<math><msqrt><mfrac><mrow><mn>3</mn><mi>h</mi></mrow><mrow><mi>g</mi><msup><mo>sin</mo><mn>2</mn></msup></mrow></mfrac></msqrt></math>","<math><msqrt><mfrac><mrow><mn>2</mn><mi>h</mi></mrow><mi>g</mi></mfrac></msqrt></math>"],0,["Cầu đặc lăn: a = (5/7)g sinα, quãng đường L = h/sinα.","t = √(2L/a) = √(14h/(5g sin²α))."]],[4,"4.70","Một thanh mảnh OA đồng chất, chiều dài L = 30 cm, có thể quay xung quanh trục quay đi qua đầu O. Bỏ qua ma sát ở trục quay. Thả nhẹ nhàng thanh từ vị trí nằm ngang. Lấy <math><mrow><mi>g</mi><mo>=</mo><mn>10</mn><mspace width=\"0.17em\"></mspace><mi>m</mi><mi>/</mi><msup><mi>s</mi><mn>2</mn></msup></mrow></math>. Vận tốc của điểm A khi nó ở vị trí thấp nhất là:<br><img data-i=\"image37\" class=\"fg\" style=\"width:2.39861in;height:1.57986in\">",["3 m/s","<math><mrow><mn>10</mn><msqrt><mn>3</mn></msqrt></mrow></math> m/s","10 m/s","<math><msqrt><mn>6</mn></msqrt></math> m/s<br><br />"],0,["Cơ năng bảo toàn: ½Iω² = MgL/2 với I = ML²/3.","ω² = 3g/L nên v_A = ωL = √(3gL) = √(3 · 10 · 0,3) = 3 m/s."]],[5,"5.1","Nén đẳng nhiệt một khối khí lý tưởng trong một bình kín, thì",["Áp suất của khối khí giảm.","Áp suất của khối khí tăng.","Số mol của khối khí giảm.","Thể tích của khối khí tăng."],1,["Đẳng nhiệt: pV = const.","Nén thì thể tích giảm nên áp suất tăng."]],[5,"5.2","Khi nung nóng đẳng tích một khối khí lý tưởng không đổi, thì",["Nhiệt độ của khối khí giảm","Áp suất của khối khí giảm","Áp suất của khối khí tăng","Số mol của khối khí tăng"],2,["Đẳng tích: p/T = const.","Nung nóng thì T tăng nên áp suất tăng."]],[5,"5.3","Khi dãn đẳng áp một khối khí lý tưởng không đổi, thì",["Thể tích của khối khí giảm.","Số mol của khối khí tăng.","Nhiệt độ của khối khí giảm.","Nhiệt độ của khối khí tăng."],3,["Đẳng áp: V/T = const.","Giãn nở (V tăng) thì nhiệt độ tăng."]],[5,"5.4","Khi dãn đoạn nhiệt một khối khí lý tưởng không đổi, thì",["Áp suất của hệ giảm.","Thể tích của hệ giảm.","Số mol của hệ tăng","Nhiệt độ của hệ tăng."],0,["Giãn đoạn nhiệt: khí sinh công, không nhận nhiệt nên nhiệt độ giảm.","pV^γ = const với V tăng nên áp suất giảm."]],[5,"5.5","Chọn đáp án <em><strong>đúng</strong></em>. Trong quá trình biến đổi đoạn nhiệt một khối khí lý tưởng không đổi, nếu nhiệt độ của khối khí giảm thì",["Số mol của khối khí giảm.","Thể tích của khối khí tăng.","thể tích của khối khí giảm.","số mol của khối khí tăng."],1,["Đoạn nhiệt: TV^(γ−1) = const.","T giảm thì V phải tăng."]],[5,"5.6","Tính chất nào sau đây <em><strong>không phải</strong></em> là của phân tử?",["Các phân tử có lúc đứng yên, có lúc chuyển động.","Các phân tử luôn chuyển động không ngừng.","Các phân tử chuyển động càng nhanh khi nhiệt độ của vật càng cao.","Các phân tử va chạm vào thành bình, gây áp suất lên thành bình."],0,["Các phân tử luôn chuyển động hỗn loạn không ngừng, không có lúc đứng yên."]],[5,"5.7","Nhận xét nào sau đây <em><strong>không đúng</strong></em> đối với khí lí tưởng?",["Thể tích của các phân tử khí có thể bỏ qua.","Các phân tử khí chỉ tương tác với nhau khi va chạm.","Các phân tử chuyển động càng nhanh khi nhiệt độ càng cao.","Khối lượng của các phân tử khí có thể bỏ qua."],3,["Mô hình khí lý tưởng: bỏ qua kích thước phân tử, bỏ qua tương tác (trừ lúc va chạm).","Khối lượng phân tử không thể bỏ qua."]],[5,"5.8","Trong quá trình biến đổi của khối khí lý tưởng từ trạng thái 1 sang trạng thái 2, đại lượng nào sau đây không phụ thuộc cách biến đổi",["Công.","Nhiệt.","Độ biến thiên nội năng.","Công và nhiệt."],2,["Độ biến thiên nội năng chỉ phụ thuộc trạng thái đầu và cuối (hàm trạng thái).","Công và nhiệt phụ thuộc quá trình."]],[5,"5.9","Đặc điểm chung của công và nhiệt trong một quá trình nhiệt động là",["cùng phụ thuộc vào quá trình biến đổi.","luôn cùng dấu trong mỗi quá trình biến đổi.","luôn nhận giá trị dương trong các quá trình biến đổi.","chỉ khác không khi có sự biến đổi thể tích."],0,["Công và nhiệt không phải hàm trạng thái, đều phụ thuộc vào quá trình biến đổi."]],[5,"5.10","Chọn phát biểu <em><strong>sai</strong></em>. Một hệ khí lý tưởng",["có khả năng trao đổi công và nhiệt với môi trường.","không trao đổi công trong quá trình đẳng tích","có nội năng không đổi nếu hệ cô lập.","không trao đổi nhiệt trong quá trình đẳng nhiệt."],3,["Trong quá trình đẳng nhiệt, ΔU = 0 nhưng hệ vẫn trao đổi nhiệt: Q = A.","Vậy \"không trao đổi nhiệt\" là sai."]],[5,"5.11","Chọn phát biểu <strong>sai</strong>. Nội năng của khí lý tưởng",["phụ thuộc nhiệt độ của hệ.","không phụ thuộc thể tích.","không phụ thuộc áp suất.","không phụ thuộc nhiệt độ."],3,["Nội năng khí lý tưởng U = (i/2)nRT chỉ phụ thuộc nhiệt độ.","Vậy \"không phụ thuộc nhiệt độ\" là sai."]],[5,"5.12","Chọn phát biểu <em><strong>đúng.</strong></em> Độ biến thiên nội năng của hệ trong quá trình nhiệt động",["phụ thuộc đường dẫn của quá trình đó.","không phụ thuộc vào trạng thái đầu và cuối của hệ.","bằng không khi hệ cô lập với môi trường.","bằng tổng của nhiệt lượng và công mà hệ trao đổi trong quá trình đó."],3,["Nguyên lý I: ΔU = Q + A (tổng nhiệt và công hệ trao đổi, theo quy ước dấu).","(Câu có thể gây tranh luận vì phương án C cũng đúng cho hệ cô lập; đáp án chọn D là nguyên lý I.)"]],[5,"5.13","Chọn phát biểu <em><strong>đúng</strong></em> khi nói về nội năng?",["Nội năng của chất khí lí t­ưởng không phụ thuộc vào nhiệt độ.","Nội năng của vật là năng lượng chỉ hình thành trong quá trình vật biến đổi trạng thái.","Nội năng của vật là năng lượng không chuyển hóa thành các dạng năng l­ượng khác.","Nội năng của vật là tổng động năng và thế năng của các phân tử cấu tạo nên vật."],3,["Nội năng của vật là tổng động năng và thế năng của các phân tử cấu tạo nên vật."]],[5,"5.14","Chọn phát biểu <strong>đúng</strong>.",["Trong quá trình đẳng tích, công và nhiệt lượng luôn bằng nhau.","Công và nhiệt lượng là một dạng của năng lượng.","Công và nhiệt lượng là hàm của trạng thái.","Hệ trao đổi công với môi trường khi thể tích của hệ thay đổi."],3,["Hệ chỉ trao đổi công khi thể tích thay đổi (A = ∫p dV).","Công và nhiệt không phải hàm trạng thái."]],[5,"5.15","Chọn phát biểu <em><strong>sai</strong></em>.",["Nhiệt không thể tự động truyền từ vật lạnh hơn sang vật nóng hơn.","Hệ chỉ trao đổi công với môi trường khi thể tích của hệ thay đổi.","Trong một chu trình, nội năng của khí lý tưởng bằng không.","Trong quá trình đẳng nhiệt, công sinh ra bằng nhiệt nhận vào."],2,["Trong một chu trình, độ biến thiên nội năng bằng 0 (nội năng trở về giá trị ban đầu), không phải nội năng bằng 0.","Vậy C sai."]],[5,"5.16","Câu nào <em><strong>không đúng</strong></em> khi nói về nội năng?",["Nội năng của chất khí lí t­ưởng không phụ thuộc vào nhiệt độ.","Nội năng của một vật có thể tăng hoặc giảm.","Nội năng có thể chuyển hóa thành dạng năng l­ượng khác.","Nội năng của vật là tổng động năng và thế năng của các phân tử cấu tạo nên vật."],0,["Nội năng của khí lý tưởng phụ thuộc nhiệt độ.","Phát biểu \"không phụ thuộc nhiệt độ\" là sai."]],[5,"5.17","Một hệ khí lý tưởng không đổi, biến đổi đẳng tích đến trạng thái có áp suất lớn hơn. Chọn đáp án <em><strong>đúng</strong></em> khi nói về công và nhiệt lượng mà hệ trao đổi với môi trường trong quá trình trên",["Hệ nhận nhiệt, nhận công.","Hệ nhận nhiệt, sinh công.","Hệ toả nhiệt, sinh công.","Hệ nhận nhiệt, không trao đổi công."],3,["Đẳng tích: A = 0. Áp suất tăng nên nhiệt độ tăng, ΔU > 0.","Theo Q = ΔU, hệ nhận nhiệt và không trao đổi công."]],[5,"5.18","Phát biểu nào sau đây <em><strong>đúng</strong></em>?",["Nhiệt lượng không tự truyền từ một vật lạnh sang vật nóng hơn.","Nhiệt lượng là nội năng của vật và luôn tồn tại trong vật.","Nhiệt lượng có thể tự truyền từ một vật nóng sang vật lạnh hơn và ngược lại.","Nhiệt lượng luôn không đổi trong quá trình hệ biến đổi trạng thái."],0,["Nhiệt không tự truyền từ vật lạnh sang vật nóng hơn (nguyên lý II)."]],[5,"5.19","Chọn câu <em><strong>đúng</strong></em>.",["Trong quá trình biến đổi trạng thái, cơ năng không thể tự chuyển hoá thành nội năng.","Trong quá trình biến đổi trạng thái, quá trình truyền nhiệt là quá trình thuận nghịch.","Động cơ nhiệt chỉ có thể chuyển hoá một phần nhiệt lượng nhận được thành công.","Động cơ nhiệt có thể chuyển hoá hoàn toàn nhiệt lượng nhận được thành công."],2,["Động cơ nhiệt chỉ chuyển một phần nhiệt nhận được thành công, phần còn lại tỏa cho nguồn lạnh."]],[5,"5.20","Chu trình Carnot là một chu trình gồm hai cặp quá trình thuận nghịch nào sau đây xen kẽ nhau?",["đẳng tích và đẳng nhiệt.","đẳng tích và đoạn nhiệt.","đẳng nhiệt và đẳng áp.","đoạn nhiệt và đẳng nhiệt."],3,["Chu trình Carnot gồm hai quá trình đẳng nhiệt và hai quá trình đoạn nhiệt xen kẽ."]],[5,"5.21","Chọn phát biểu <em><strong>sai</strong></em>:",["Quá trình đẳng tích là quá trình thay đổi trạng thái của hệ nhưng thể tích cuả hệ không đổi","Quá trình đẳng nhiệt là quá trình thay đổi trạng thái của hệ nhưng nhiệt độ của hệ không đổi","Quá trình đẳng áp là quá trình thay đổi trạng thái của hệ nhưng áp suất của hệ không đổi","Quá trình đoạn nhiệt là quá trình thay đổi trạng thái của hệ nhưng nhiệt lượng của hệ không đổi"],3,["Quá trình đoạn nhiệt là quá trình hệ không trao đổi nhiệt với môi trường (Q = 0).","\"Nhiệt lượng của hệ không đổi\" là cách diễn đạt sai."]],[5,"5.22","Cho đồ thị phác hoạ chu trình biến đổi 2312 của khối khí trên hệ trục toạ độ OPV. Đồ thị thể hiện của biến đổi của các quá trình:<br><img data-i=\"image38\" class=\"fg\" style=\"width:1.3625in;height:0.92778in\">",["Giãn nở đẳng áp, hơ nóng đẳng tích rồi nén đoạn nhiệt về trạng thái ban đầu","Giãn nở đẳng áp, làm lạnh đẳng tích và nén đoạn nhiệt về trạng thái ban đầu","Giãn nở đẳng nhiệt, nén đẳng áp và hơ nóng đẳng tích đến trạng thái ban đầu","Giãn nở đoạn nhiệt, nén đẳng áp và hơ nóng đẳng tích đến trạng thái ban đầu"],1,["Chu trình 2→3→1→2: 2→3 giãn đẳng áp (V tăng, p không đổi), 3→1 làm lạnh đẳng tích (p giảm, V không đổi), 1→2 nén đoạn nhiệt (đường Q = 0)."]],[5,"5.23","Cho đồ thị phác hoạ chu trình biến đổi 3123 của khối khí trên hệ trục toạ độ OPV. Đồ thị thể hiện của biến đổi của các quá trình:<br><img data-i=\"image39\" class=\"fg\" style=\"width:1.40556in;height:0.97083in\">",["Giãn nở đẳng áp, hơ nóng đẳng tích rồi nén đoạn nhiệt về trạng thái ban đầu","Giãn nở đẳng áp, làm lạnh đẳng tích rồi nén đoạn nhiệt về trạng thái ban đầu","Giãn nở đẳng nhiệt, nén đẳng áp và hơ nóng đẳng tích đến trạng thái ban đầu","Giãn nở đoạn nhiệt, nén đẳng áp và hơ nóng đẳng tích đến trạng thái ban đầu"],2,["Chu trình 3→1→2→3: 3→1 giãn đẳng nhiệt (đường T = const), 1→2 nén đẳng áp, 2→3 hơ nóng đẳng tích (p tăng, V không đổi)."]],[5,"5.24","Cho đồ thị phác hoạ chu trình biến đổi 1231 của khối khí trên hệ trục toạ độ OPV. Đồ thị thể hiện của biến đổi của các quá trình:<br><img data-i=\"image38\" class=\"fg\" style=\"width:1.3625in;height:0.92778in\">",["Nén đoạn nhiệt, giãn nở đẳng áp và làm lạnh đẳng tích về trạng thái ban đầu","Nén đẳng áp, làm lạnh đẳng tích rồi nén đoạn nhiệt về trạng thái ban đầu","Giãn nở đẳng nhiệt, nén đẳng áp và hơ nóng đẳng tích đến trạng thái ban đầu","Nén đoạn nhiệt, nén đẳng áp và hơ nóng đẳng tích đến trạng thái ban đầu"],0,["Chu trình 1→2→3→1: 1→2 nén đoạn nhiệt, 2→3 giãn đẳng áp, 3→1 làm lạnh đẳng tích."]],[5,"5.25","Cho đồ thị phác hoạ chu trình biến đổi 1231 của khối khí trên hệ trục toạ độ OPV. Đồ thị thể hiện của biến đổi của các quá trình:<br><img data-i=\"image39\" class=\"fg\" style=\"width:1.40556in;height:0.97083in\">",["Nén đoạn nhiệt, giãn nở đẳng áp và làm lạnh đẳng tích về trạng thái ban đầu","Nén đẳng áp, làm lạnh đẳng tích rồi nén đoạn nhiệt về trạng thái ban đầu","Nén đẳng áp, hơ nóng đẳng tích và giãn nở đẳng nhiệt đến trạng thái ban đầu","Nén đoạn nhiệt, nén đẳng áp và hơ nóng đẳng tích đến trạng thái ban đầu"],2,["Chu trình 1→2→3→1: 1→2 nén đẳng áp, 2→3 hơ nóng đẳng tích, 3→1 giãn đẳng nhiệt."]],[5,"5.26","Một khối khí lí tưởng không đổi được giữ ở nhiệt độ không đổi. Ban đầu hệ có thể tích 1 m<sup>3</sup> và áp suất 1 atm. Nếu áp suất giảm còn 0,5 atm thì thể tích khối khí là",["4 m<sup>3</sup>.","2 m<sup>3</sup>.","1 m<sup>3</sup>.","0,5 m<sup>3</sup>."],1,["Đẳng nhiệt: p₁V₁ = p₂V₂ nên V₂ = 1 · 1/0,5 = 2 m³."]],[5,"5.27","Một khối khí lý tưởng không đổi, biến đổi đẳng nhiệt từ trạng thái 1 có thể tích 25 lít và áp suất 1,5 atm sang trạng thái 2 có thể tích 50 lít. Áp suất của hệ khí ở trạng thái 2 là",["2,5.10<sup>5</sup> Pa.","7,5975.10<sup>4</sup> Pa.","2,5013.10<sup>4</sup> Pa.","5,065.10<sup>4</sup> Pa."],1,["p₂ = p₁V₁/V₂ = 1,5 · 25/50 = 0,75 atm.","= 0,75 · 1,013 · 10⁵ ≈ 7,6 · 10⁴ Pa."]],[5,"5.28","Một khối khí lí tưởng không đổi ở nhiệt độ không đổi 27<sup>o</sup>C, thể tích 80 lít, áp suất 2 atm. Nếu thể tích giảm còn 40 lít thì áp suất của khối khí là",["2,026.10<sup>5</sup> Pa.","2,026.10<sup>4</sup> Pa.","4,052.10<sup>4</sup> Pa.","4,052.10<sup>5</sup> Pa."],3,["p₂ = p₁V₁/V₂ = 2 · 80/40 = 4 atm.","= 4 · 1,013 · 10⁵ ≈ 4,05 · 10⁵ Pa."]],[5,"5.29","Một khối khí lí tưởng không đổi ở nhiệt độ không đổi. Nếu tăng thể tích của hệ lên 6 lần thì áp suất của hệ sẽ",["giảm 6 lần.","tăng 6 lần.","giảm 3 lần.","tăng 3 lần."],0,["pV = const nên thể tích tăng 6 lần thì áp suất giảm 6 lần."]],[5,"5.30","Một khối khí lý tưởng không đổi, biến đổi đẳng tích từ trạng thái 1 có nhiệt độ 127 <sup>o</sup>C và áp suất 1 atm sang trạng thái 2 có áp suất 3 atm. Nhiệt độ của hệ ở trạng thái 2 là",["927 <sup>o</sup>C.","381 <sup>o</sup>C.","309 <sup>o</sup>C.","103 <sup>o</sup>C."],0,["Đẳng tích: T₂ = T₁ · p₂/p₁ = 400 · 3 = 1200 K.","Tức 927 °C."]],[5,"5.31","Một khối khí lý tưởng không đổi, biến đổi đẳng tích từ trạng thái 1 có nhiệt độ 227 <sup>o</sup>C và áp suất 2 atm sang trạng thái 2 có nhiệt độ 477 <sup>o</sup>C. Áp suất của hệ ở trạng thái 2 là",["10<sup>5</sup> Pa.","3.10<sup>4</sup> Pa.","10<sup>4</sup> Pa.","3,039.10<sup>5</sup> Pa."],3,["Đẳng tích: p₂ = p₁ · T₂/T₁ = 2 · 750/500 = 3 atm.","= 3,039 · 10⁵ Pa."]],[5,"5.32","Một khối khí lý tưởng được chứa trong bình kín. Nếu áp suất khí trong bình tăng gấp ba thì nhiệt độ của khối khí sẽ",["giảm 9 lần.","tăng 9 lần.","tăng 3 lần.","giảm 3 lần."],2,["Đẳng tích: p tỉ lệ T nên p tăng 3 lần thì T tăng 3 lần."]],[5,"5.33","Một khối khí lý tưởng được chứa trong bình kín, có nhiệt độ 107 <sup>o</sup>C và áp suất 3 atm. Để áp suất trong bình còn 1,5 atm thì cần phải giảm nhiệt độ xuống đến",["-53,5 <sup>o</sup>C","83 <sup>o</sup>C.","-83 <sup>o</sup>C.","53,5 <sup>o</sup>C."],2,["Đẳng tích: T₂ = T₁ · p₂/p₁ = 380 · 1,5/3 = 190 K.","Tức −83 °C."]],[5,"5.34","Một khối khí lý tưởng không đổi, biến đổi đẳng áp từ trạng thái 1 có nhiệt độ 227 <sup>o</sup>C và thể tích 10 lít sang trạng thái 2 có thể tích 25 lít. Nhiệt độ của hệ ở trạng thái 2 là",["1250 <sup>o</sup>C.","977 <sup>o</sup>C.","567 <sup>o</sup>C.","725 <sup>o</sup>C."],1,["Đẳng áp: T₂ = T₁ · V₂/V₁ = 500 · 25/10 = 1250 K.","Tức 977 °C."]],[5,"5.35","Một khối khí lý tưởng không đổi, biến đổi đẳng áp từ trạng thái 1 có nhiệt độ 327 <sup>o</sup>C và thể tích 12 lít sang trạng thái 2 có nhiệt độ 127 <sup>o</sup>C. Thể tích của hệ ở trạng thái 2 là",["8 lít","5 lít","10 lít","18 lít"],0,["Đẳng áp: V₂ = V₁ · T₂/T₁ = 12 · 400/600 = 8 lít."]],[5,"5.36","Một khối khí lý tưởng không đổi được giữ trong bình có áp suất không đổi. Nếu thể tích của khối khí tăng 6 lần thì nhiệt độ của khối khí sẽ",["giảm 6 lần.","tăng 6 lần.","giảm 3 lần.","tăng 3 lần."],1,["Đẳng áp: V tỉ lệ T nên V tăng 6 lần thì T tăng 6 lần."]],[5,"5.37","Một khối khí lý tưởng không đổi ở điều kiện có nhiệt độ 127 <sup>o</sup>C và thể tích 25 lít. Nếu áp suất được giữ không đổi và thể tích giảm xuống còn 10 lít thì nhiệt độ của khối khí xấp xỉ là",["247 K.","120 K.","160 K.","50,8 K."],2,["Đẳng áp: T₂ = T₁ · V₂/V₁ = 400 · 10/25 = 160 K."]],[5,"5.38","0,25 mol khí lý tưởng ở trạng thái 1 có áp suất 1 atm, thể tích 17,4 lít được nén đẳng áp đến trạng thái 2 có thể tích 5,51 lít. Nhiệt độ của hệ ở cuối quá trình đẳng áp là",["783, 04 K","387, 04 K","268,7K","738, 04 K"],2,["T₁ = pV/(nR) = 101 325 · 0,0174/(0,25 · 8,31) ≈ 848,7 K.","Đẳng áp: T₂ = T₁ · 5,51/17,4 ≈ 268,7 K."]],[5,"5.39","Một khối khí O<sub>2</sub> không đổi được coi là khí lý tưởng, biến đổi đoạn nhiệt từ trạng thái 1 có áp suất 1,5 atm và thể tích 10 lít sang trạng thái 2 có áp suất 3 atm. Thể tích của hệ ở trạng thái 2 là",["5 lít","10,30 lít","8,14 lít","6,1 lít"],3,["Đoạn nhiệt O₂ lưỡng nguyên tử: γ = 1,4, p₁V₁^γ = p₂V₂^γ.","V₂ = 10 · (1,5/3)^(1/1,4) ≈ 6,1 lít."]],[5,"5.40","Một khối khí N<sub>2</sub> không đổi được coi là khí lý tưởng, biến đổi đoạn nhiệt từ trạng thái 1 có nhiệt độ 27 <sup>o</sup>C và thể tích 15 lít sang trạng thái 2 có thể tích 20 lít. Nhiệt độ của hệ ở trạng thái 2 là",["87,6 K.","24,1 K.","302,3 K.","267,4 K."],3,["N₂: γ = 1,4. Đoạn nhiệt: T₂ = T₁(V₁/V₂)^(γ−1) = 300 · (15/20)^0,4 ≈ 267,4 K."]],[5,"5.41","Một khối khí N<sub>2</sub> không đổi được coi là khí lý tưởng, biến đổi đoạn nhiệt từ trạng thái 1 có nhiệt độ 127 <sup>o</sup>C và thể tích 10 lít sang trạng thái 2 có nhiệt độ 227 <sup>o</sup>C. Thể tích của hệ ở trạng thái 2 là",["5,72 lít.","2,86 lít.","3,14 lít","1,62 lít."],0,["TV^(γ−1) = const, γ = 1,4: V₂ = V₁(T₁/T₂)^(1/0,4) = 10 · (400/500)^2,5 ≈ 5,72 lít."]],[5,"5.42","Một khối khí lý tưởng lưỡng nguyên tử không đổi, thực hiện một quá trình biến đổi đoạn nhiệt. Nếu thể tích giảm 2 lần thì áp suất của khối khí sẽ",["tăng 2 lần.","giảm 2,64 lần.","tăng 2,64 lần.","giảm 1,32 lần."],2,["Lưỡng nguyên tử γ = 1,4: p₂/p₁ = (V₁/V₂)^1,4 = 2^1,4 ≈ 2,64.","Áp suất tăng 2,64 lần."]],[5,"5.43","Một khối khí lý tưởng đơn nguyên tử không đổi, thực hiện một quá trình biến đổi đoạn nhiệt. Nếu áp suất tăng 2 lần thì thể tích của khối khí sẽ",["không đổi.","giảm 1,64 lần.","tăng 1,64 lần.","giảm 1,52 lần."],3,["Đơn nguyên tử γ = 5/3: V₂/V₁ = (p₁/p₂)^(1/γ) = 2^(−0,6) ≈ 0,66.","Thể tích giảm khoảng 1,52 lần."]],[5,"5.44","Một khối khí lý tưởng lưỡng nguyên tử không đổi, thực hiện một quá trình biến đổi đoạn nhiệt. Nếu thể tích tăng 2 lần thì nhiệt độ của khối khí sẽ",["tăng 1,32 lần.","giảm 1,64 lần.","giảm 1,32 lần.","không đổi."],2,["γ = 1,4: T₂/T₁ = (V₁/V₂)^0,4 = 2^(−0,4) ≈ 0,758.","Nhiệt độ giảm khoảng 1,32 lần."]],[5,"5.45","Một khối khí lý tưởng đa nguyên tử không đổi, thực hiện một quá trình biến đổi đoạn nhiệt. Nếu nhiệt độ giảm 2 lần thì thể tích của khối khí sẽ",["tăng 5,66 lần.","giảm 5,66 lần.","giảm 8 lần.","tăng 8 lần."],3,["Đa nguyên tử γ = 4/3: TV^(1/3) = const.","T giảm 2 lần thì V tăng 2³ = 8 lần."]],[5,"5.46","Một hệ khí lý tưởng lưỡng nguyên tử, ở trạng thái 1 có áp suất 1,5 atm, thể tích 80 lít, được nén đoạn nhiệt đến trạng thái 2 có thể tích 40 lít. Áp suất của hệ ở trạng thái 2 bằng",["3,69 atm","3,96 atm","9,36 atm","9,63 atm"],1,["γ = 1,4: p₂ = p₁(V₁/V₂)^γ = 1,5 · 2^1,4 ≈ 3,96 atm."]],[5,"5.47","Một khối khí N<sub>2</sub> không đổi được coi là khí lý tưởng, biến đổi đoạn nhiệt từ trạng thái 1 có áp suất 3 atm và thể tích 5 lít sang trạng thái 2 có thể tích 15 lít. Áp suất của hệ ở trạng thái 2 là",["0,32 atm.","0,64 atm.","1 atm.","3 atm."],1,["N₂: γ = 1,4. p₂ = p₁(V₁/V₂)^γ = 3 · (1/3)^1,4 ≈ 0,64 atm."]],[5,"5.48","Một chất khí lý tưởng ở trạng thái ban đầu áp suất P<sub>0</sub>, được dãn đẳng nhiệt tới thể tích V<sub>2</sub>=3V<sub>1</sub>. Sau đó khí được nén đoạn nhiệt trở về thể tích ban đầu, áp suất sau khi nén là P<sub>3</sub> = 3<sup>1/3</sup>P<sub>0</sub>. Xác định bậc tự do i?",["3","5","6","8"],2,["Giãn đẳng nhiệt đến 3V₁: p₂ = P₀/3. Nén đoạn nhiệt về V₁: P₃ = p₂ · 3^γ = P₀ · 3^(γ−1).","Cho bằng 3^(1/3)P₀ nên γ − 1 = 1/3, γ = 4/3.","γ = (i + 2)/i = 4/3 nên i = 6."]],[5,"5.49","Một khối khí lí tưởng không đổi ở trạng thái xác định. Nếu cả áp suất và thể tích của khối khí lí tưởng tăng 4 lần thì nhiệt độ tuyệt đối của khối khí sẽ",["tăng 16 lần.","giảm 16 lần.","tăng 4 lần.","giảm 4 lần."],0,["pV/T = const nên T tỉ lệ pV.","p và V cùng tăng 4 lần thì T tăng 16 lần."]],[5,"5.50","Một khối khí lí tưởng không đổi ở trạng thái xác định. Nếu nhiệt độ tuyệt đối tăng gấp ba, áp suất giảm một nửa thì thể tích khối khí",["giảm 2 lần.","tăng 3 lần.","giảm 6 lần.","tăng 6 lần."],3,["V tỉ lệ T/p nên V tăng 3/(1/2) = 6 lần."]],[5,"5.51","Một khối khí lí tưởng không đổi ở trạng thái xác định. Nếu đồng thời tăng nhiệt độ tuyệt đối và thể tích lên 5 lần thì áp suất của khối khí sẽ:",["tăng 16 lần.","không đổi","giảm 4 lần.","tăng 4 lần."],1,["p tỉ lệ T/V = 5/5 = 1 nên áp suất không đổi."]],[5,"5.52","Một khối khí lý tưởng không đổi, ban đầu ở trạng thái có nhiệt độ 127<sup>o</sup>C, thể tích 16 lít và áp suất 1 atm. Khối khí được biến đổi đến trạng thái có thể tích 10 lít và áp suất 2 atm. Nhiệt độ lúc này của khối khí là",["500<sup>o</sup>C.","127<sup>o</sup>C.","27<sup>o</sup>C.","227<sup>o</sup>C."],3,["pV/T = const nên T₂ = T₁ · (p₂V₂)/(p₁V₁) = 400 · (2 · 10)/(1 · 16) = 500 K.","Tức 227 °C."]],[5,"5.53","Một hệ gồm 2 mol khí lý tưởng ở trạng thái có thể tích 35 lít và áp suất 3 atm. Nhiệt độ của khối khí là",["366,98<sup>o</sup>C.","631,4<sup>o</sup>C.","424,4<sup>o</sup>C.","271,4<sup>o</sup>C."],0,["T = pV/(nR) = 3 · 101 325 · 0,035/(2 · 8,31) ≈ 640 K.","Tức khoảng 367 °C."]],[5,"5.54","4 gam khí H<sub>2</sub> chứa trong bình kín có thể tích 2 lít ở nhiệt độ 27 <sup>o</sup>C. Áp suất khí trong bình là",["10<sup>5</sup> Pa.","2,2.10<sup>5</sup> Pa.","2,5.10<sup>6</sup> Pa","3.10<sup>5</sup> Pa"],2,["n = 4/2 = 2 mol; T = 300 K.","p = nRT/V = 2 · 8,31 · 300/0,002 ≈ 2,5 · 10⁶ Pa."]],[5,"5.55","Ở điều kiện chuẩn: áp suất 1 atm và nhiệt độ 0<sup>o</sup>C, một mol khí bất kì luôn có thể tích là:",["22,4 m<sup>3</sup>.","22,4 lít","1 m<sup>3</sup>.","1 lít"],1,["Ở điều kiện chuẩn (1 atm, 0 °C), 1 mol khí lý tưởng chiếm 22,4 lít."]],[5,"5.56","Một khối khí lý tưởng đang ở nhiệt độ 27<sup>o</sup>C thì thực hiện quá trình biến đổi trạng thái đến khi nhiệt độ tăng thêm 20<sup>o</sup>C, áp suất tăng 1,5 lần, lúc này thể tích của khối khí bằng 16 lít. Thể tích ban đầu của khối khí bằng",["24,0 lít","22,5 lít","30,0 lít","15,0 lít"],1,["Ban đầu T₁ = 300 K, cuối T₂ = 320 K, p₂ = 1,5p₁, V₂ = 16 lít.","V₁ = V₂ · (p₂/p₁) · (T₁/T₂) = 16 · 1,5 · 300/320 = 22,5 lít."]],[5,"5.57","Một bình khí He được coi là lý tưởng, có áp suất 150 bar, thể tích 20 lít và ở nhiệt độ phòng 27<sup>o</sup>C. Biết khối lượng mol của He là 4 g/mol, 1 bar = 10<sup>5</sup> Pa. Khối lượng khí He chứa trong bình là:",["5,35 kg","481,3 kg","5,35 g","481,3 g"],3,["n = pV/(RT) = 150 · 10⁵ · 0,02/(8,31 · 300) ≈ 120,3 mol.","m = n · 4 g/mol ≈ 481,3 g."]],[5,"5.58","Một bình khí He được coi là lý tưởng, có áp suất 150 bar, thể tích 40 lít và ở nhiệt độ phòng 27<sup>o</sup>C. Biết khối lượng mol của He là 4 g/mol, 1 bar = 10<sup>5</sup> Pa. Để giảm áp suất trong bình xuống 75 bar thì phải xả bớt bao nhiêu gam khí He ra ngoài? Coi nhiệt độ không đổi trong suốt quá trình xả.",["642 g","106,96 g","481,3 g","321 g"],2,["Ban đầu n = 240,7 mol; áp suất còn một nửa (nhiệt độ không đổi) nên n còn một nửa.","Xả 120,3 mol = 481,3 g He."]],[5,"5.59","Tiến hành bơm khí H<sub>2</sub> vào một bình kín, có thể tích 15 lít. Vỏ bình chỉ có thể chịu được áp suất tối đa là 100 bar. Biết khối lượng mol của H<sub>2</sub> là 2 g/mol, 1 bar = 10<sup>5</sup> Pa. Giả sử nhiệt độ khí trong bình ở nhiệt độ phòng 27<sup>o</sup>C. Khối lượng khí H<sub>2</sub> tối đa có thể chứa trong bình là:",["1337 kg","1337 g","120,34 kg","120,34 g"],3,["n = pV/(RT) = 100 · 10⁵ · 0,015/(8,31 · 300) ≈ 60,17 mol.","m = n · 2 g/mol ≈ 120,34 g."]],[5,"5.60","Bậc tự do của phân tử khí CO<sub>2</sub> là:",["<em>i</em> = 6","<em>i</em> = 3","<em>i</em> = 5","<em>i</em> = 7"],0,["Theo cách tính của đề (các câu có CO₂), CO₂ có i = 6.","Đây là phân tử ba nguyên tử, coi có 6 bậc tự do trong mô hình của đề."]],[5,"5.61","Hệ số đoạn nhiệt của chất khí đơn nguyên tử bằng",["<math><mfrac><mn>4</mn><mn>3</mn></mfrac></math>.","<math><mfrac><mn>5</mn><mn>3</mn></mfrac></math>.","1,4","<math><mfrac><mn>6</mn><mn>3</mn></mfrac></math>."],1,["Đơn nguyên tử: i = 3 nên γ = (i + 2)/i = 5/3."]],[5,"5.62","Nhiệt dung mol đẳng áp của chất khí lưỡng nguyên tử xấp xỉ bằng",["33,26 J/Mol.K.","29,10 J/Mol.K","20,79 J/Mol.K.","24,95 J/Mol.K"],1,["Lưỡng nguyên tử: C_p = (i + 2)/2 · R = (7/2) · 8,31 ≈ 29,10 J/mol·K."]],[5,"5.63","Nhiệt dung mol đẳng tích của chất khí đơn nguyên tử xấp xỉ bằng",["24,95 J/Mol.K.","29,10 J/Mol.K","20,79 J/Mol.K.","12,47 J/Mol.K"],3,["Đơn nguyên tử: C_v = (3/2)R = 1,5 · 8,31 ≈ 12,47 J/mol·K."]],[5,"5.64","Một hệ nhiệt động trải qua một chu trình ngược chiều kim đồng hồ. Trong mỗi chu trình, nhiệt lượng mà hệ trao đổi với môi trường có giá trị tuyệt đối là 5100 J. Công mà hệ sinh ra trong chu trình đó bằng:",["3500 J","-5100 J","5100 J","-3500 J"],1,["Chu trình ngược chiều kim đồng hồ là chu trình ngược (làm lạnh): hệ nhận công, A_sinh < 0.","ΔU = 0 nên A = −Q, độ lớn 5100 J, tức −5100 J."]],[5,"5.65","Một hệ nhiệt động trải qua một chu trình ngược chiều kim đồng hồ. Nhiệt lượng mà hệ trao đổi với môi trường có giá trị tuyệt đối là 5200 J. Công mà hệ sinh ra trong chu trình có giá trị:",["-5200 J","5200 J","0 J","-2500 J"],0,["Tương tự câu trước: chu trình ngược nên công hệ sinh ra âm.","A = −5200 J."]],[5,"5.66","Một hệ nhiệt động trải qua một chu trình biến đổi cùng chiều kim đồng hồ. Trong mỗi chu trình, nhiệt lượng mà hệ trao đổi với môi trường có giá trị tuyệt đối là 4200 J. Công mà hệ sinh ra trong chu trình đó bằng bao nhiêu?",["2400 J.","4200 J.","– 4200 J.","– 2400 J"],1,["Chu trình thuận (cùng chiều kim đồng hồ): ΔU = 0 nên công hệ sinh ra A = Q.","Nhiệt trao đổi có trị tuyệt đối 4200 J nên A = 4200 J."]],[5,"5.67","Một hệ khí lý tưởng nhận từ môi trường nhiệt lượng 4900 J, làm tăng nội năng của hệ lên 2300 J. Công mà hệ sinh ra trong quá trình này là:",["7200 J.","2600 J.","-5600 J","-3700 J"],1,["Nguyên lý I: Q = ΔU + A.","A = 4900 − 2300 = 2600 J."]],[5,"5.68","Một hệ khí lý tưởng trải qua quá trình biến đổi đoạn nhiệt, làm nội năng của hệ tăng 4200 J. Công mà hệ sinh ra trong quá trình này là:",["4200 J.","2400 J.","-2400 J","-4200 J"],3,["Đoạn nhiệt: Q = 0 nên A = −ΔU.","A = −4200 J (hệ nhận công 4200 J)."]],[5,"5.69","Một hệ nhiệt động trải qua một chu trình biến đổi cùng chiều kim đồng hồ. Trong mỗi chu trình, nhiệt lượng mà hệ trao đổi với môi trường có giá trị tuyệt đối là 4200 J. Công mà hệ sinh ra trong chu trình đó bằng bao nhiêu?",["2400 J.","4200 J.","- 4200 J.","- 2400 J."],1,["Chu trình thuận: ΔU = 0 nên A = Q = 4200 J."]],[5,"5.70","Một hệ nhiệt động trải qua một chu trình biến đổi cùng chiều kim đồng hồ. Trong mỗi chu trình, công thực hiện bởi hệ trong chu trình đó bằng 3200 J thì nhiệt lượng mà hệ nhận vào là:",["7400 J.","3200 J.","- 3200 J.","- 7400 J."],1,["Chu trình thuận: ΔU = 0 nên Q = A.","Nhiệt hệ nhận vào bằng công sinh ra, 3200 J."]],[5,"5.71","Một hệ khí lý tưởng nhận từ môi trường nhiệt lượng 900 J, làm tăng nội năng của hệ lên 300 J. Công mà hệ sinh ra trong quá trình này là:",["1200 J.","600 J.","-600 J.","-1200 J."],1,["A = Q − ΔU = 900 − 300 = 600 J."]],[5,"5.72","Một hệ khí lý tưởng làm tăng nội năng của hệ lên 500 J và thực hiện công lên môi trường là 800 J thì trong quá trình này hệ nhận từ môi trường nhiệt lượng là:",["300 J.","1300 J.","-300 J.","-1300 J."],1,["Q = ΔU + A = 500 + 800 = 1300 J."]],[5,"5.73","Một hệ khí lý tưởng được biến đổi đẳng áp tại áp suất 2 atm, làm thể tích của hệ giảm đi 3 lít. Công mà hệ sinh ra với môi trường trong quá trình này là:",["-607,8 J","-600 J","607,8 J","600 J"],0,["Đẳng áp: A = pΔV = 2 · 101 325 · (−0,003) ≈ −607,8 J."]],[5,"5.74","Một hệ khí lý tưởng được biến đổi đẳng áp tại áp suất 3 atm, làm thể tích của hệ giảm đi 2 lít. Công mà hệ nhận vào trong quá trình này là:",["– 607,8 J.","– 400 J.","400 J.","607,8 J."],3,["Hệ sinh công A = pΔV = 3 · 101 325 · (−0,002) ≈ −607,95 J.","Công hệ nhận vào = +607,8 J."]],[5,"5.75","Một lượng khí N<sub>2</sub> được biến đổi đẳng tích tại thể tích 12 lít, làm cho áp suất của hệ tăng 2 atm. Nhiệt lượng mà hệ trao đổi với môi trường trong quá trình này là",["-3200 J","6078 J","3200 J","-6078 J"],1,["Đẳng tích: Q = ΔU = (i/2)VΔp, N₂ lưỡng nguyên tử i = 5.","Q = 2,5 · 0,012 · 2 · 101 325 ≈ 6078 J."]],[5,"5.76","Một hệ khí lý tưởng được biến đổi đẳng áp tại áp suất 4 atm, làm thể tích của hệ tăng thêm 4.10<sup>-3</sup> m<sup>3</sup>. Công mà hệ sinh ra trong quá trình này là",["810,4 J.","-810,4 J.","1620,8 J.","-1620,8 J."],2,["Đẳng áp: A = pΔV = 4 · 101 325 · 4 · 10⁻³ ≈ 1620,8 J."]],[5,"5.77","Một khối khí CH<sub>4</sub> được biến đổi đẳng áp tại áp suất 4 atm, làm thể tích của hệ tăng thêm 2.10<sup>-3</sup> m<sup>3</sup>. Nhiệt mà hệ nhận vào trong quá trình này là:",["3241,6 J.","810,4 J.","– 810,4 J.","– 3241,6 J."],0,["CH₄ đa nguyên tử i = 6. Đẳng áp: Q = ((i + 2)/2)pΔV = 4pΔV.","Q = 4 · 4 · 101 325 · 2 · 10⁻³ ≈ 3241,6 J."]],[5,"5.78","0,25 mol khí lý tưởng ở trạng thái 1 có áp suất 1 atm, thể tích 17,4 lít được nén đẳng áp đến trạng thái 2 có thể tích 5,51 lít. Công mà hệ sinh ra trong quá trình 12 là:",["3472 J","-5672 J","-1204,46 J","4321 J"],2,["Đẳng áp: A = pΔV = 101 325 · (5,51 − 17,4) · 10⁻³ ≈ −1204,5 J."]],[5,"5.79","2 mol khí lý tưởng lưỡng nguyên tử, ở trạng thái 1 có nhiệt độ 300 K, được nung nóng đẳng tích đến trạng thái 2 có nhiệt độ 600 K. Nhiệt lượng mà hệ nhận vào trong quá trình 12 là:",["21465,7 J","12465 J","-21465,3 J","-12465 J"],1,["Đẳng tích lưỡng nguyên tử: Q = nC_vΔT = 2 · 2,5 · 8,31 · 300.","Q ≈ 12 465 J."]],[5,"5.80","Một khối khí CO<sub>2</sub> được coi là khí lý tưởng, biến đổi đẳng áp tại áp suất 3 atm, làm thể tích của hệ giảm đi 2 lít. Nhiệt mà hệ nhận vào trong quá trình này là:",["– 607,8 J.","– 2431,2 J.","2431,2 J.","607,8 J."],1,["CO₂ theo đề i = 6. Đẳng áp: Q = 4pΔV = 4 · 3 · 101 325 · (−0,002) ≈ −2431,2 J."]],[5,"5.81","Có 1 mol khí lý tưởng đơn nguyên tử, ở trạng thái 1 có nhiệt độ 300 K, được nén đoạn nhiệt đến trạng thái 2 có nhiệt độ 600 K. Công mà hệ sinh ra trong quá trình này là:",["6,236 kJ.","– 6,232 kJ.","– 3,74 kJ.","3,74 kJ."],2,["Đoạn nhiệt: A = −ΔU = −nC_vΔT = −1 · 1,5 · 8,31 · 300 ≈ −3740 J.","Nén nên hệ nhận công, công sinh ra âm."]],[5,"5.82","Có 1 mol khí lý tưởng đơn nguyên tử, ở trạng thái 1 có nhiệt độ 300 K, được biến đổi đẳng áp đến trạng thái 2 có nhiệt độ 600 K. Công mà hệ sinh ra trong quá trình này là:",["-1247 J.","1247 J.","-2494 J.","2494 J."],3,["Đẳng áp: A = nRΔT = 1 · 8,31 · 300 ≈ 2494 J."]],[5,"5.83","Hệ gồm 12 gam khí CO<sub>2</sub> thực hiện quá trình biến đổi đẳng áp để nhiệt độ của hệ tăng thêm 50 <sup>o</sup>C. Nhiệt lượng hệ nhận vào bằng bao nhiêu?",["545,3J.","-545,7 J","-453,3 J","453,3 J"],3,["n = 12/44 ≈ 0,2727 mol, CO₂ có i = 6.","Đẳng áp: Q = n((i + 2)/2)RΔT = 0,2727 · 4 · 8,31 · 50 ≈ 453,3 J."]],[5,"5.84","Có 2 mol khí lý tưởng lưỡng nguyên tử, ở trạng thái 1 có nhiệt độ 300 K, được nung nóng đẳng tích đến trạng thái 2 có nhiệt độ 500 K. Nhiệt lượng mà hệ nhận vào trong quá trình này bằng",["12472 J.","8310 J.","– 12472 J.","– 8310 J."],1,["Đẳng tích lưỡng nguyên tử: Q = nC_vΔT = 2 · 2,5 · 8,31 · 200 = 8310 J."]],[5,"5.85","Có 2 mol khí lý tưởng đơn nguyên tử, ở trạng thái 1 có nhiệt độ 350 K, được làm lạnh đẳng tích đến trạng thái 2 có nhiệt độ 300 K. Nhiệt lượng mà hệ nhận vào trong quá trình này là",["623,6 J.","-623,25 J.","-1246,5 J.","1246,5 J."],2,["Đơn nguyên tử: Q = nC_vΔT = 2 · 1,5 · 8,31 · (−50) ≈ −1246,5 J."]],[5,"5.86","Có 2 mol khí lý tưởng đơn nguyên tử, ở trạng thái 1 có nhiệt độ 300 K, được biến đổi đoạn nhiệt đến trạng thái 2 có nhiệt độ 600 K. Công mà hệ sinh ra trong quá trình này là",["7,48 kJ.","-7,48 kJ.","-12,47 kJ.","12,47 kJ."],1,["Đoạn nhiệt: A = −ΔU = −n(3/2)RΔT = −2 · 1,5 · 8,31 · 300 ≈ −7479 J ≈ −7,48 kJ."]],[5,"5.87","Một hệ khí lý tưởng đơn nguyên tử thực hiện một quá trình biến đổi từ trạng thái có áp suất 1 atm và thể tích 8 lít đến trạng thái có áp suất 3 atm và thể tích 2 lít. Độ biến thiên nội năng của hệ bằng",["– 303,9 J.","500 J.","– 500 J.","303,9 J."],0,["ΔU = (3/2)(p₂V₂ − p₁V₁) = 1,5 · 101 325 · (3 · 2 − 1 · 8) · 10⁻³.","ΔU ≈ −303,9 J."]],[5,"5.88","Một hệ khí lý tưởng đa nguyên tử thực hiện một quá trình biến đổi đẳng áp từ trạng thái có áp suất 2 atm và thể tích 3 lít đến trạng thái có thể tích 10 lít. Độ biến thiên nội năng của hệ bằng",["4255 J.","-4255 J.","-3500 J.","3500 J."],0,["Đa nguyên tử i = 6, đẳng áp: ΔU = (i/2)pΔV = 3 · 2 · 101 325 · 7 · 10⁻³.","ΔU ≈ 4255 J."]],[5,"5.89","Nung nóng 160 gam khí O<sub>2</sub> từ nhiệt độ 50 <sup>o</sup>C đến 70 <sup>o</sup>C trong điều kiện đẳng tích. Độ biến thiên nội năng của hệ là",["1050 J","1039 J","2078 J","1027 J"],2,["n = 160/32 = 5 mol, O₂ i = 5, ΔT = 20 K.","ΔU = n(5/2)RΔT = 5 · 2,5 · 8,31 · 20 ≈ 2078 J."]],[5,"5.90","Có 44 gam khí CO<sub>2</sub> được coi là khí lý tưởng được nung nóng trong điều kiện đẳng tích từ nhiệt độ 30 <sup>o</sup>C đến 60 <sup>o</sup>C. Độ biến thiên nội năng của hệ là",["374 J.","389,5 J.","747,9 J.","623,3 J."],2,["n = 1 mol CO₂ (i = 6), ΔT = 30 K.","ΔU = n(6/2)RΔT = 3 · 8,31 · 30 ≈ 747,9 J."]],[5,"5.91","Có 2 mol khí đa nguyên tử được coi là khí lý tưởng thực hiện quá trình biến đổi đoạn nhiệt từ trạng thái có nhiệt độ 300 K đến trạng thái có nhiệt độ 320 K. Độ biến thiên nội năng của hệ là",["498,9 J.","831 J.","997,2 J.","1164,1 J."],2,["Đa nguyên tử i = 6: ΔU = nC_vΔT = 2 · 3 · 8,31 · 20 ≈ 997,2 J.","(Đoạn nhiệt nhưng ΔU vẫn tính theo nhiệt độ.)"]],[5,"5.92","Một căn phòng chứa 2000 mol không khí, được làm lạnh từ 28 <sup>o</sup>C xuống 15 <sup>o</sup>C tại áp suất không đổi là 1 atm. Coi không khí là khí lý tưởng với <img data-i=\"image40\" class=\"fg\" style=\"\">. Độ biến thiên nội năng của lượng khí là",["4,5.10<sup>4</sup> J","-5,4.10<sup>4</sup> J","-4,5.10<sup>5</sup> J","-5,4.10<sup>5</sup> J"],3,["Không khí lưỡng nguyên tử (γ = 1,4) nên C_v = 2,5R.","ΔU = nC_vΔT = 2000 · 2,5 · 8,31 · (−13) ≈ −5,4 · 10⁵ J."]],[5,"5.93","2 mol khí lý tưởng lưỡng nguyên tử, ở trạng thái 1 có nhiệt độ 300 K, được nung nóng đẳng tích đến trạng thái 2 có nhiệt độ 600 K. Sau đó, hệ được dãn đoạn nhiệt đến trạng thái 3 rồi được nén đẳng áp về trạng thái ban đầu. Công mà hệ sinh ra trong quá trình đẳng áp 31 là:",["- 3191 J","1175,42 J","9455,31 J","- 6155,34 J"],0,["Trạng thái 3 trên đường đoạn nhiệt từ 2 (T₂ = 600 K, V₂ = V₁) và p₃ = p₁.","V₃ = V₁ · 2^(1/1,4) ≈ 1,64V₁ nên T₃ ≈ 492 K.","A₃₁ = nR(T₁ − T₃) = 2 · 8,31 · (300 − 492) ≈ −3191 J."]],[5,"5.94","2 mol khí lý tưởng lưỡng nguyên tử, ở trạng thái 1 có nhiệt độ 300 K, được nung nóng đẳng tích đến trạng thái 2 có nhiệt độ 600 K. Sau đó, hệ được dãn đoạn nhiệt đến trạng thái  17,4 lít được nén đẳng áp đến trạng thái 2 có thể tích 5,51 lít. Sau đó, hệ được nung nóng đẳng tích đến trạng thái 3 có nhiệt độ bằng nhiệt độ ban đầu. Cuối cùng, hệ được biến đổi đẳng nhiệt về trạng thái ban đầu. Nhiệt lượng mà hệ nhận vào từ nguồn nóng trong một chu trình là:",["5037,9 J","2026,8 J","4215,6 J","3011 J"],0,["Nhiệt nhận từ nguồn nóng gồm các quá trình nhận nhiệt: Q₂₃ ≈ 3011 J và Q₃₁ (đẳng nhiệt giãn) ≈ 2026,8 J.","Tổng ≈ 5037,9 J."]],[5,"5.103","0,5 mol khí lý tưởng lưỡng nguyên tử ở trạng thái 1 có áp suất 1 atm, nhiệt độ 180,4 K. Đầu tiên, hệ khí được hơ nóng đẳng tích đến trạng thái 2 có áp suất 3 atm. Sau đó, hệ được biến đổi đẳng nhiệt đến trạng thái 3 có áp suất bằng áp suất ban đầu. Cuối cùng, hệ được biến đổi đẳng áp về trạng thái ban đầu. Nhiệt lượng mà hệ nhận vào trong quá trình biến đổi đẳng nhiệt 23 là:",["5247J","2470,4 J","-2470,4 J","-5247 J"],1,["V₁ = nRT/p ≈ 7,40 lít. Đẳng tích 1→2: T₂ = 3 · 180,4 = 541,2 K.","Đẳng nhiệt 2→3 giãn gấp 3 lần thể tích: Q = nRT ln3 = 0,5 · 8,31 · 541,2 · 1,0986 ≈ 2470,4 J."]],[5,"5.104","0,5 mol khí lý tưởng lưỡng nguyên tử ở trạng thái 1 có áp suất 1 atm, nhiệt độ 180,4 K. Đầu tiên, hệ khí được hơ nóng đẳng tích đến trạng thái 2 có áp suất 3 atm. Sau đó, hệ được biến đổi đẳng nhiệt đến trạng thái 3 có áp suất bằng áp suất ban đầu. Cuối cùng, hệ được biến đổi đẳng áp về trạng thái ban đầu. Nhiệt lượng mà hệ nhận vào trong quá trình biến đổi đẳng tích 12 bằng bao nhiêu?",["-3747,8 J","2550,09 J","-2550,09 J","3747,8 J"],3,["Đẳng tích 1→2: Q = nC_vΔT = 0,5 · 2,5 · 8,31 · (541,2 − 180,4) ≈ 3747,8 J."]],[5,"5.105","0,5 mol khí lý tưởng lưỡng nguyên tử ở trạng thái 1 có áp suất 1 atm, nhiệt độ 180,4 K. Đầu tiên, hệ khí được hơ nóng đẳng tích đến trạng thái 2 có áp suất 3 atm. Sau đó, hệ được biến đổi đẳng nhiệt đến trạng thái 3 có áp suất bằng áp suất ban đầu. Cuối cùng, hệ được biến đổi đẳng áp về trạng thái ban đầu. Nhiệt lượng mà hệ nhận vào trong quá trình biến đổi đẳng áp 31 bằng bao nhiêu?",["5250,09 J","2550,09 J","-2550,09 J","-5247 J"],3,["Đẳng áp 3→1 làm lạnh từ 541,2 K về 180,4 K: Q = nC_pΔT = 0,5 · 3,5 · 8,31 · (−360,8) ≈ −5247 J."]],[5,"5.106","0,5 mol khí lý tưởng lưỡng nguyên tử ở trạng thái 1 có áp suất 1 atm, nhiệt độ 180,4 K. Đầu tiên, hệ khí được hơ nóng đẳng tích đến trạng thái 2 có áp suất 3 atm. Sau đó, hệ được biến đổi đẳng nhiệt đến trạng thái 3 có áp suất bằng áp suất ban đầu. Cuối cùng, hệ được biến đổi đẳng áp về trạng thái ban đầu. Nhiệt lượng mà hệ nhận vào từ nguồn nóng trong một chu trình là:",["3747 J","4719 J","2470 J","6218 J"],3,["Nhiệt nhận từ nguồn nóng: Q₁₂ + Q₂₃ = 3747,8 + 2470,4 ≈ 6218 J."]],[5,"5.107","Một động cơ nhiệt có tác nhân là khí CO<sub>2</sub> được xem như khí lí tưởng, khối khí này biến đổi theo chu trình hình chữ nhật <em>abcda</em>. Nhiệt độ cao nhất của chất khí trong chu trình là 800 K. Áp suất và thể tích của chất khí trong mỗi trạng thái là <em>p<sub>a</sub> = p<sub>d</sub></em> = 3,00.10<sup>5</sup> Pa, <em>p<sub>b</sub> = p<sub>c</sub></em> = 6,00.10<sup>5</sup> Pa; <em>V<sub>a</sub> = V<sub>b</sub></em> = 0,02 m<sup>3</sup>, <em>V<sub>c</sub> = V<sub>d</sub></em> = 0,08 m<sup>3</sup>. Công thực hiện bởi động cơ trong mỗi chu trình là:",["144 kJ.","72 kJ.","36 kJ.","18 kJ."],3,["Công trong chu trình hình chữ nhật = diện tích hình chữ nhật.","A = Δp · ΔV = (6 − 3) · 10⁵ · (0,08 − 0,02) = 18 000 J = 18 kJ."]],[5,"5.108","Một động cơ nhiệt có chất công tác là khí CO<sub>2</sub> được xem như khí lí tưởng, khối khí này biến đổi theo chu trình hình chữ nhật <em>abcda</em>. Nhiệt độ cao nhất của chất khí trong chu trình là 800 K. Áp suất và thể tích của chất khí trong mỗi trạng thái là <em>p<sub>a</sub> = p<sub>d</sub></em> = 3,00.10<sup>5</sup> Pa, <em>p<sub>b</sub> = p<sub>c</sub></em> = 6,00.10<sup>5</sup> Pa; <em>V<sub>a</sub> = V<sub>b</sub></em> = 0,02 m<sup>3</sup>, <em>V<sub>c</sub> = V<sub>d</sub></em> = 0,08 m<sup>3</sup>. Tổng nhiệt lượng mà khối khí nhận từ nguồn nóng trong mỗi chu trình là",["162 kJ.","144 kJ.","18 kJ.","126 kJ."],0,["CO₂ i = 6. Nhận nhiệt ở a→b (đẳng tích) và b→c (đẳng áp).","Q_ab = 3 · 0,02 · 3 · 10⁵ = 18 kJ; Q_bc = 4 · 6 · 10⁵ · 0,06 = 144 kJ.","Tổng = 162 kJ."]],[5,"5.109","Một động cơ nhiệt có tác nhân là khí CO<sub>2</sub> được xem như khí lí tưởng, khối khí này biến đổi theo chu trình hình chữ nhật <em>abcda</em>. Nhiệt độ cao nhất của chất khí trong chu trình là 800 K. Áp suất và thể tích của chất khí trong mỗi trạng thái là <em>p<sub>a</sub> = p<sub>d</sub></em> = 3,00.10<sup>5</sup> Pa, <em>p<sub>b</sub> = p<sub>c</sub></em> = 6,00.10<sup>5</sup> Pa; <em>V<sub>a</sub> = V<sub>b</sub></em> = 0,02 m<sup>3</sup>, <em>V<sub>c</sub> = V<sub>d</sub></em> = 0,08 m<sup>3</sup>. Tổng nhiệt lượng mà khối khí truyền cho nguồn lạnh trong mỗi chu trình là",["144 kJ.","-72 kJ.","0 kJ.","-18 kJ."],0,["Tỏa nhiệt ở c→d (đẳng tích) và d→a (đẳng áp).","|Q_cd| = 3 · 0,08 · 3 · 10⁵ = 72 kJ; |Q_da| = 4 · 3 · 10⁵ · 0,06 = 72 kJ.","Tổng truyền cho nguồn lạnh = 144 kJ (kiểm tra: 162 − 144 = 18 kJ là công)."]],[5,"5.110","Một động cơ nhiệt có tác nhân là 2 mol khí lý tưởng đơn nguyên tử ban đầu ở trạng thái 1 có nhiệt độ 300 K. Khối khí bị nén đẳng nhiệt đến trạng thái 2, sau đó được giãn đẳng áp đến trạng thái 3 có nhiệt độ gấp 2 lần nhiệt độ ban đầu, cuối cùng làm lạnh đẳng tích về trạng thái ban đầu. Nhiệt lượng mà khối khí nhận từ nguồn nóng trong chu trình trên là:",["12465 J.","7483,5 J.","10941,6 J.","3458,1 J."],0,["2→3 là giãn đẳng áp, T từ 300 K đến 600 K: Q₂₃ = nC_pΔT = 2 · 2,5 · 8,31 · 300 ≈ 12 465 J.","Đây là nhiệt nhận từ nguồn nóng (các quá trình khác tỏa nhiệt)."]],[5,"5.111","Một động cơ nhiệt có tác nhân là 2 mol khí lý tưởng đơn nguyên tử ban đầu ở trạng thái 1 có nhiệt độ 300 K. Khối khí bị nén đẳng nhiệt đến trạng thái 2, sau đó được giãn đẳng áp đến trạng thái 3 có nhiệt độ gấp 2 lần nhiệt độ ban đầu, cuối cùng làm lạnh đẳng tích về trạng thái ban đầu. Tổng nhiệt lượng mà khối khí truyền cho nguồn lạnh trong chu trình trên là:",["10935J.","-12472,5 J.","-7483,5 J.","3458,1 J."],0,["Tỏa nhiệt ở 3→1 (đẳng tích): |Q| = 2 · 1,5 · 8,31 · 300 ≈ 7479 J.","Tỏa ở 1→2 (nén đẳng nhiệt): |Q| = nRT ln2 ≈ 3456 J.","Tổng ≈ 10 935 J."]],[5,"5.112","Một chất khí lý tưởng ở trạng thái ban đầu áp suất P<sub>0</sub>, được dãn đẳng nhiệt tới thể tích V<sub>2</sub>=3V<sub>1</sub>. Sau đó khí được nén đoạn nhiệt trở về thể tích ban đầu, áp suất sau khi nén là P<sub>3</sub> = 3<sup>1/3</sup>P<sub>0</sub>. Xác định bậc tự do i?",["3","5","6","8"],2,["Giãn đẳng nhiệt đến 3V₁: p₂ = P₀/3. Nén đoạn nhiệt về V₁: P₃ = p₂ · 3^γ = P₀3^(γ−1).","Cho bằng 3^(1/3)P₀ nên γ = 4/3, tức i = 6."]],[5,"5.113","Một động cơ nhiệt có hiệu suất 20%. Trong mỗi chu trình làm việc, động cơ thực hiện một công là 150 J. Tác nhân hoạt động trong động cơ đã truyền cho nguồn lạnh một nhiệt lượng là",["343 J.","412 J.","600 J.","309 J."],2,["Hiệu suất η = A/Q₁ nên Q₁ = 150/0,2 = 750 J.","Q₂ = Q₁ − A = 600 J."]],[5,"5.114","Một động cơ Diesel, mỗi chu trình thực hiện công cơ học là 2200 J và nhận nhiệt lượng 6500 J từ nguồn nóng thì nhiệt lượng truyền cho nguồn lạnh trong mỗi chu trình là:",["-8700 J.","4300 J.","-870 J.","3400 J."],1,["Q₂ = Q₁ − A = 6500 − 2200 = 4300 J."]],[5,"5.115","Một động cơ nhiệt thực hiện một công 400 J khi nhận từ nguồn nóng một nhiệt lượng là 1 kJ. Hiệu suất của động cơ nhiệt là",["35%.","25%.","45%.","40%."],3,["η = A/Q₁ = 400/1000 = 40%."]],[5,"5.116","Một động cơ nhiệt, trong một chu trình nhận từ nguồn nóng một nhiệt lượng 1200 J và truyền cho nguồn lạnh một nhiệt lượng 900 J. Công mà động cơ thực hiện trong mỗi chu trình là",["900 J.","600 J.","300 J.","1200 J."],2,["A = Q₁ − Q₂ = 1200 − 900 = 300 J."]],[5,"5.117","Một động cơ nhiệt có công suất là 20 kW và hiệu suất nhiệt của nó là 20%. Nhiệt lượng mà động cơ nhiệt truyền cho nguồn lạnh trong một giây là:",["-80 J.","80 kJ.","800 J.","-8 kJ."],1,["Công suất 20 kW tức công 20 kJ mỗi giây, η = 0,2.","Q₁ = 20/0,2 = 100 kJ; Q₂ = 100 − 20 = 80 kJ."]],[5,"5.118","Hiệu suất của một động cơ nhiệt là 40%, khi tỏa một nhiệt lượng 480J cho nguồn lạnh, động cơ nhiệt nhận một nhiệt lượng là",["2 kJ.","800 J.","-800 J.","-480 J."],1,["Q₂ = (1 − η)Q₁ nên Q₁ = 480/0,6 = 800 J."]],[5,"5.119","Một động cơ nhiệt, trong mỗi chu trình hoạt động sẽ thực hiện một công 900 J khi nhận từ nguồn nóng một nhiệt lượng là 3,0 kJ. Hiệu suất của động cơ nhiệt là",["35%.","25%.","40%.","30%."],3,["η = A/Q₁ = 900/3000 = 30%."]],[5,"5.120","Một động cơ nhiệt, trong mỗi chu trình hoạt động sẽ nhận từ nguồn nóng nhiệt lượng 3,6.10<sup>4</sup> J và đồng thời truyền cho nguồn lạnh 2,9.10<sup>4</sup> J. Hiệu suất của động cơ đó là:",["80,56%.","19,44%.","47,1%.","52,9%."],1,["η = 1 − Q₂/Q₁ = 1 − 2,9/3,6 ≈ 19,44%."]],[5,"5.121","Một động cơ nhiệt, trong mỗi chu trình hoạt động sẽ thực hiện một công 600 J và đồng thời truyền cho nguồn lạnh một nhiệt lượng là 1200 J. Hiệu suất của động cơ nhiệt là",["66,7%.","25,0%.","50,0%.","33,3%."],3,["Q₁ = A + Q₂ = 600 + 1200 = 1800 J.","η = 600/1800 ≈ 33,3%."]],[5,"5.122","Một động cơ nhiệt có hiệu suất 30%. Trong mỗi chu trình làm việc, động cơ thực hiện một công là 204 J, khi đó nhận từ nguồn nóng một nhiệt lượng là",["476 J.","680 J.","612 J.","1420 J."],1,["Q₁ = A/η = 204/0,3 = 680 J."]],[5,"5.123","Một động cơ nhiệt mỗi giây nhận từ nguồn nóng nhiệt lượng 3,6.10<sup>4</sup> J và đồng thời truyền cho nguồn lạnh 3,2.10<sup>4</sup> J. Hiệu suất của động cơ đó là:",["88,9%.","11,1%.","47,1%.","52,9%."],1,["η = 1 − Q₂/Q₁ = 1 − 3,2/3,6 ≈ 11,1%."]],[5,"5.124","Đối với một động cơ Carnot nếu đồng thời tăng nhiệt độ tuyệt đối của nguồn nóng và nguồn lạnh lên hai lần thì hiệu suất động cơ sẽ",["tăng hai lần.","giảm hai lần.","tăng hoặc giảm.","không thay đổi."],3,["Carnot: η = 1 − T₂/T₁.","Tăng cả hai nhiệt độ lên 2 lần thì tỉ số T₂/T₁ không đổi nên hiệu suất không đổi."]],[5,"5.125","Một động cơ Carnot làm việc với hai nguồn nhiệt gồm nguồn nóng có nhiệt độ tuyệt đối <em>T</em><sub>1</sub> và nguồn lạnh có nhiệt độ tuyệt đối <em>T</em><sub>2</sub>. Biết <em>T</em><sub>1</sub> = 1,7<em>T</em><sub>2</sub>, hiệu suất của động cơ này bằng:",["62,5%.","41,2%.","37,5%.","23,1%."],1,["η = 1 − T₂/T₁ = 1 − 1/1,7 ≈ 41,2%."]],[5,"5.126","Một động cơ Carnot làm việc ở hai nguồn nhiệt, biết nhiệt độ tuyệt đối của nguồn nóng gấp 6 lần nhiệt độ tuyệt đối của nguồn lạnh. Hiệu suất của động cơ Carnot này bằng:",["52,4%.","43,6%.","83,3%.","16,7%."],2,["η = 1 − 1/6 ≈ 83,3%."]],[5,"5.127","Một động cơ Carnot làm việc với hai nguồn nhiệt gồm nguồn nóng có nhiệt độ t<sub>1</sub> và nguồn lạnh có nhiệt độ t<sub>2</sub>. Biết <em>t</em><sub>1</sub> = 5<em>t</em><sub>2</sub> = 100<sup>o</sup>C, hiệu suất của động cơ này bằng:",["78,6%.","80,0%.","21,4%.","20%."],2,["t₁ = 100 °C = 373 K; t₂ = 100/5 = 20 °C = 293 K.","η = 1 − 293/373 ≈ 21,4%."]],[5,"5.128","Một động cơ Carnot làm việc giữa hai nguồn nhiệt có nhiệt độ 150<sup>o</sup>C và 27<sup>o</sup>C. Hiệu suất của động cơ này bằng:",["18%.","82%.","29,1%.","70,9%."],2,["T₁ = 423 K, T₂ = 300 K.","η = 1 − 300/423 ≈ 29,1%."]],[5,"5.129","Một động cơ Carnot khi hoạt động với nguồn nóng có nhiệt độ 540 K thì hiệu suất là 35%. Nếu tăng nhiệt độ nguồn nóng lên đến 580 K mà vẫn giữ nguyên nhiệt độ nguồn lạnh thì hiệu suất động cơ này là",["98,1%.","41,9%.","39,5%.","60,5%."],2,["T₂ = T₁(1 − η) = 540 · 0,65 = 351 K.","η' = 1 − 351/580 ≈ 39,5%."]],[5,"5.130","Một động cơ Carnot có hiệu suất 25% và nhiệt độ của nguồn lạnh là 320 K. Nếu tăng nhiệt độ nguồn nóng lên 1,5 lần nhưng vẫn giữ nguyên nhiệt độ nguồn lạnh thì hiệu suất của động cơ này xấp xỉ bằng",["50%.","62,5%.","44,9%.","30%."],0,["T₁ = T₂/(1 − η) = 320/0,75 ≈ 426,7 K; nguồn nóng mới = 1,5 · 426,7 = 640 K.","η' = 1 − 320/640 = 50%."]]];
