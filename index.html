const items=D.map(([ch,n,q,o,a,e],k)=>({id:ch+'-'+k,ch,n,q,o,a,e}));
const ROM=["","I","II","III","IV","V"];
const NOSHUF=/Hình [A-D]|tất cả|cả [A-D]\b|các (đáp án|phương án)|đều (đúng|sai)|không có (đáp án|phương án)/i;
const L='ABCD';
const store={get(){try{return JSON.parse(localStorage.getItem('vl1-wrong')||'[]')}catch(e){return[]}},set(v){try{localStorage.setItem('vl1-wrong',JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const prep=it=>{const idx=[0,1,2,3],ord=it.o.some(t=>NOSHUF.test(t))?idx:shuffle(idx);return{...it,opts:ord.map(i=>it.o[i]),ans:ord.indexOf(it.a)}};
const app=document.getElementById('app');
new MutationObserver(()=>app.querySelectorAll('img[data-i]:not([src])').forEach(m=>{m.src=IM[m.dataset.i]})).observe(app,{childList:true,subtree:true});
let cfg={ch:'all',count:20,order:'random'},S=null;
const chips=(key,arr)=>arr.map(([v,t])=>`<button class="chip" data-k="${key}" data-v="${v}" aria-pressed="${String(cfg[key])===String(v)}">${t}</button>`).join('');
function home(){
  S=null;const w=store.get().length;
  app.innerHTML=`<h1>Ôn tập trắc nghiệm</h1><p class="lead">Ngân hàng 370 câu hỏi, mỗi câu 4 đáp án và chỉ 1 đáp án đúng. Chọn xong là biết đúng sai và có lời giải thích ngay.</p>
  <div class="card"><h2>Phạm vi</h2><div class="chips">${chips('ch',[['all','Tất cả (370)'],[1,'Chương I (43)'],[2,'Chương II (65)'],[3,'Chương III (63)'],[4,'Chương IV (69)'],[5,'Chương V (130)']])}</div>
  <h2>Số câu</h2><div class="chips">${chips('count',[[10,'10'],[20,'20'],[40,'40'],[50,'50'],[0,'Tất cả']])}</div>
  <h2>Thứ tự câu hỏi</h2><div class="chips">${chips('order',[['random','Ngẫu nhiên'],['seq','Theo đề']])}</div>
  <button class="cta" id="go">Bắt đầu làm bài</button>
  ${w?`<button class="cta alt" id="rw">Ôn lại các câu đã sai (${w})</button>`:''}</div>
  <p class="note">Lưu ý: file đề gốc không kèm đáp án. Đáp án do Claude tự giải, nên có thể còn vài câu chưa chuẩn, nhất là các câu đề có số liệu hoặc hình vẽ chưa rõ. Nếu kết quả lệch với thầy cô, hãy ưu tiên theo thầy cô.</p>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const k=b.dataset.k;cfg[k]=k==='order'?b.dataset.v:(b.dataset.v==='all'?'all':+b.dataset.v);home()});
  document.getElementById('go').onclick=()=>{let p=items.filter(i=>cfg.ch==='all'||i.ch===cfg.ch);if(cfg.order==='random')p=shuffle(p);if(cfg.count)p=p.slice(0,cfg.count);begin(p)};
  const r=document.getElementById('rw');if(r)r.onclick=()=>{const s=new Set(store.get());begin(shuffle(items.filter(i=>s.has(i.id))))};
}
function begin(list){S={list:list.map(prep),i:0,score:0,wrong:[],done:false};quiz()}
function quiz(){
  const q=S.list[S.i],n=S.list.length;S.done=false;
  app.innerHTML=`<div class="bar"><i style="width:${S.i/n*100}%"></i></div>
  <div class="meta"><span>Câu ${S.i+1}/${n}</span><span>Đúng: ${S.score}</span></div>
  <div class="card"><span class="tag">Chương ${ROM[q.ch]} · Câu ${q.n}</span><p class="q">${q.q}</p>
  <div class="opts">${q.opts.map((t,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b><span>${t}</span></button>`).join('')}</div>
  <div class="fb" aria-live="polite"></div></div>
  <div class="nav"><button class="ghost" id="quit">Thoát</button><span class="hint">Phím 1–4 hoặc A–D để chọn, Enter để qua câu</span><button class="cta" id="nx" hidden>${S.i+1===n?'Xem kết quả':'Câu tiếp theo'}</button></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  document.getElementById('nx').onclick=next;
  document.getElementById('quit').onclick=()=>{if(confirm('Thoát bài làm hiện tại?'))home()};
}
function pick(i){
  if(!S||S.done)return;S.done=true;
  const q=S.list[S.i],ok=i===q.ans,bs=app.querySelectorAll('.opt'),fb=app.querySelector('.fb');
  bs.forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
  const w=new Set(store.get());
  if(ok){S.score++;w.delete(q.id);fb.className='fb ok';fb.textContent='Chính xác!'}
  else{S.wrong.push({q,i});w.add(q.id);fb.className='fb bad';fb.textContent='Chưa đúng. Đáp án đúng là '+L[q.ans]+'.'}
  store.set([...w]);
  const nx=document.getElementById('nx');nx.hidden=false;nx.focus({preventScroll:true});explain(q,i,ok);
}
function next(){if(!S.done)return;S.i++;S.i<S.list.length?(quiz(),window.scrollTo(0,0)):result()}
function result(){
  const n=S.list.length,p=S.score/n*10,msg=p>=8.5?'Rất vững, giữ phong độ nhé!':p>=6.5?'Khá tốt, ôn thêm các câu sai là chắc tay.':'Cần ôn thêm. Làm lại các câu sai để nhớ lâu hơn.';
  app.innerHTML=`<div class="card"><h2>Kết quả</h2><div class="score">${p.toFixed(1).replace('.',',')}<span style="font-size:22px;color:var(--mute)"> /10</span></div>
  <p>Đúng ${S.score}/${n} câu. ${msg}</p>
  <button class="cta" id="again">Làm bài mới</button>${S.wrong.length?`<button class="cta alt" id="rd">Làm lại ${S.wrong.length} câu sai</button>`:''}</div>
  ${S.wrong.length?`<div class="card"><h2>Các câu làm sai</h2>${S.wrong.map(({q,i})=>`<div class="rv"><p><b>Câu ${q.n}.</b> ${q.q}</p><p class="y">Bạn chọn ${L[i]}. ${q.opts[i]}</p><p class="c">Đáp án ${L[q.ans]}. ${q.opts[q.ans]}</p></div>`).join('')}</div>`:''}`;
  document.getElementById('again').onclick=home;
  const rd=document.getElementById('rd');if(rd)rd.onclick=()=>begin(shuffle(S.wrong.map(x=>items.find(t=>t.id===x.q.id))));
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!S||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase(),i='1234'.indexOf(k)>=0&&k?'1234'.indexOf(k):'abcd'.indexOf(k);
  if(S.list&&document.querySelector('.opts')&&k.length===1&&i>=0){pick(i)}
  else if((k==='enter'||k==='arrowright')&&S.done&&document.querySelector('.opts')){e.preventDefault();next()}
});
let SM=null;
try{window.claude&&claude.use&&claude.use('sample').then(s=>{SM=s}).catch(()=>{})}catch(e){}
const ec={get(){try{return JSON.parse(localStorage.getItem('vl1-exp')||'{}')}catch(e){return{}}},set(k,v){try{const o=ec.get();o[k]=v;localStorage.setItem('vl1-exp',JSON.stringify(o))}catch(e){}}};
function show(t,s){const ls=(s.includes('\n')?s.split('\n'):s.split(/(?<=[.!?…])\s+/)).map(x=>x.trim()).filter(Boolean);t.textContent='';ls.forEach(x=>{const d=document.createElement('div');d.className='ln';d.textContent=x;t.append(d)})}
function explain(q,i,ok){
  const box=document.createElement('div');box.className='ex';box.innerHTML='<small>Giải thích</small>';
  app.querySelector('.card').appendChild(box);
  const t=document.createElement('span');box.append(t);
  show(t,q.e.join('\n'));
  if(SM){const b=document.createElement('button');b.className='ghost';b.style.marginTop='10px';b.textContent='Giải thích chi tiết hơn (cần mạng)';b.onclick=()=>{b.remove();detail(q,i,ok,t)};box.append(b)}
}
async function detail(q,i,ok,t){
  const key='v2|'+q.id+'|'+(ok?'ok':q.o.indexOf(q.opts[i])),hit=ec.get()[key];
  const fallback=()=>{show(t,q.e.join('\n'))};
  if(hit){show(t,hit);return}
  t.textContent='Đang soạn lời giải chi tiết…';
  const P=h=>{const d=document.createElement('div');d.innerHTML=h;d.querySelectorAll('img').forEach(m=>m.replaceWith('[hình/công thức]'));return d.textContent.replace(/\s+/g,' ').trim()};
  const hasImg=/<img/.test(q.q+q.o.join(''));
  const p='Bạn là giảng viên Vật lý đại cương. Giải thích ngắn gọn bằng tiếng Việt (văn bản thuần, không markdown, không tiêu đề; mỗi ý hoặc mỗi bước tính viết trên MỘT DÒNG riêng, xuống dòng giữa các ý, tối đa 6 dòng, mỗi dòng ngắn gọn, không đánh số) cho câu trắc nghiệm sau.\nCâu hỏi: '+P(q.q)+'\n'+q.opts.map((x,k)=>L[k]+'. '+P(x)).join('\n')+'\nĐáp án đúng của đề: '+L[q.ans]+'.\nNgười học chọn: '+L[i]+' ('+(ok?'đúng':'sai')+').\n'+(hasImg?'Lưu ý: đề có hình vẽ hoặc công thức dạng ảnh mà bạn không nhìn thấy; hãy dựa vào đáp án đề đã cho.\n':'')+'Yêu cầu: nêu kiến thức hoặc công thức then chốt và các bước tính chính để ra đáp án '+L[q.ans]+'; '+(ok?'':'chỉ ra ngắn gọn vì sao phương án '+L[i]+' không đúng; ')+'nếu thấy đáp án của đề có vẻ chưa khớp với cách tính hoặc đề có số liệu chưa hợp lý thì nói thẳng.';
  try{const r=await SM(p,{modelTier:'quick',onText:({text})=>show(t,text)});ec.set(key,r.text);show(t,r.text)}catch(e){fallback()}
}
function setGlass(on){document.documentElement.dataset.glass=on?'on':'off';document.getElementById('glass').setAttribute('aria-pressed',on);try{localStorage.setItem('vl1-glass',on?'on':'off')}catch(e){}}
document.getElementById('glass').onclick=()=>setGlass(document.documentElement.dataset.glass!=='on');
let g=true;try{g=localStorage.getItem('vl1-glass')!=='off'}catch(e){}
setGlass(g);
document.getElementById('theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
home();
</script>
